<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iNOPS Dashboard — Wireframes</title>
<style>
:root{
  /* ---- Amazon iNOPS brand ---- */
  --az-ink:#232F3E; --az-ink-deep:#131A22; --az-orange:#FF9900; --az-orange-600:#E47911;
  --az-blue:#146EB4; --az-blue-700:#0F5288;

  --gray-50:#F9FAFB;--gray-100:#F3F4F6;--gray-200:#E5E7EB;--gray-300:#D1D5DB;--gray-400:#9CA3AF;
  --gray-500:#6B7280;--gray-600:#4B5563;--gray-700:#374151;--gray-800:#1F2937;--gray-900:#111827;

  --blue-50:#EDF4FB;--blue-100:#D6E7F6;--blue-200:#B4D2EE;
  --orange-50:#FFF8EC;--orange-100:#FDEBCE;

  /* Categorical data hues — validated (lightness band, chroma floor,
     CVD separation, normal-vision floor, contrast). Assigned in fixed
     order, never cycled. Amazon orange #FF9900 is BRAND ONLY — it fails
     the contrast and lightness checks as a data hue. */
  --c1:#146EB4; --c2:#C7511F; --c3:#067D62; --c4:#8C4799; --c5:#946200;

  /* Status — reserved, never reused as a series colour. */
  --ok:#1E7B34; --ok-bg:#E8F4EA; --warn:#B45309; --warn-bg:#FEF3C7;
  --bad:#B42318; --bad-bg:#FEE4E2; --none:#6B7280; --none-bg:#F3F4F6;

  /* Sequential ramp (single hue, light→dark) for choropleth + heat cells. */
  --s1:#EDF4FB;--s2:#D6E7F6;--s3:#A9CCEA;--s4:#6FA8D6;--s5:#3B82BF;--s6:#1D5F9C;--s7:#0C3D6B;

  --shadow-1:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.06);
  --shadow-2:0 4px 12px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
  --shadow-3:0 12px 24px rgba(0,0,0,.12),0 4px 8px rgba(0,0,0,.06);
  --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --ease-out:cubic-bezier(0,0,.2,1);
  --sidebar:208px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--gray-50);color:var(--gray-900);font-size:13px;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
a{color:var(--az-blue)}

/* ===== topbar ===== */
.gd-topbar{display:flex;align-items:center;gap:14px;height:46px;padding:0 18px;background:var(--az-ink);color:#fff;position:sticky;top:0;z-index:60}
.gd-back{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#AAB7B8;text-decoration:none;padding:5px 9px;border-radius:6px}
.gd-back:hover{background:rgba(255,255,255,.08);color:#fff}
.gd-wordmark{font-size:17px;font-weight:700;letter-spacing:-.5px;padding-left:14px;border-left:1px solid #3B4859}
.gd-wordmark .smile{color:var(--az-orange)}
.gd-topbar-title{font-size:12.5px;color:#D5DBDB}
.gd-topbar-spacer{flex:1}
.gd-topbar-meta{display:flex;align-items:center;gap:12px;font-size:11.5px;color:#AAB7B8}
.gd-refresh{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);border:1px solid #3B4859;color:#D5DBDB;font-size:11.5px;padding:5px 10px;border-radius:6px;cursor:pointer}
.gd-refresh:hover{background:rgba(255,255,255,.16);color:#fff}
.gd-refresh svg{transition:transform .5s var(--ease-out)}
.gd-refresh.spin svg{transform:rotate(360deg)}
.gd-topbar-user{padding-left:12px;border-left:1px solid #3B4859}

/* ===== shell ===== */
.shell{display:flex;min-height:calc(100vh - 46px)}
.fsidebar{width:var(--sidebar);flex-shrink:0;background:#fff;border-right:1px solid var(--gray-200);padding:14px 0;position:sticky;top:46px;height:calc(100vh - 46px);overflow-y:auto}
.fsb-brand{padding:4px 18px 14px}
.fsb-brand b{display:block;font-size:13px;color:var(--gray-900)}
.fsb-brand span{font-size:11px;color:var(--gray-500)}
.nav-item{display:flex;align-items:center;gap:9px;margin:2px 8px;padding:9px 10px;border-radius:8px;font-size:12.5px;line-height:1.3;color:var(--gray-600);cursor:pointer;border:none;background:none;width:calc(100% - 16px);text-align:left;transition:background 150ms,color 150ms}
.nav-item svg{width:16px;height:16px;flex-shrink:0}
.nav-item:hover{background:var(--gray-100);color:var(--gray-800)}
.nav-item.active{background:var(--az-ink);color:#fff;font-weight:600}
.nav-item.active svg{color:var(--az-orange)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.pagehead{background:#fff;border-bottom:1px solid var(--gray-200);padding:16px 22px 0}
.pagehead h1{font-size:21px;font-weight:700;color:var(--gray-900)}
.pagehead .ph-sub{font-size:12px;color:var(--gray-500);margin-top:3px}
.top-tabs{display:flex;overflow-x:auto;margin-top:12px}
.tab{padding:11px 16px;font-size:13.5px;font-weight:500;color:var(--gray-500);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--gray-700)}
.tab.on{color:var(--az-ink);border-bottom-color:var(--az-orange);font-weight:600}

/* ===== filter strip ===== */
.filter-strip{display:flex;flex-direction:column;row-gap:8px;padding:10px 22px;background:#fff;border-bottom:1px solid var(--gray-200)}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%}
.frow .freset{margin-left:auto}
.fsearch{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;flex:1;min-width:220px;max-width:340px;border:1px solid var(--gray-200);border-radius:8px;background:#fff}
.fsearch:focus-within{border-color:var(--az-orange);box-shadow:0 0 0 3px var(--orange-100)}
.fsearch svg{width:14px;height:14px;color:var(--gray-400);flex-shrink:0}
.fsearch input{border:none;outline:none;font-family:inherit;font-size:13px;color:var(--gray-800);width:100%;background:none}
.fpill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 4px 0 10px;flex-shrink:0;border:1px solid var(--gray-200);border-radius:8px;background:#fff;cursor:pointer}
.fpill:hover{border-color:var(--gray-300)}
.fpill:focus-within{border-color:var(--az-orange);box-shadow:0 0 0 3px var(--orange-100)}
.fpill.on{border-color:var(--az-orange);background:var(--orange-50)}
.fpill > span{font-size:10.5px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.fpill select{border:none;outline:none;background:none;font-family:inherit;font-size:12.5px;font-weight:500;color:var(--gray-800);cursor:pointer;padding-right:2px;max-width:190px}
.segmented{display:inline-flex;background:var(--gray-100);border-radius:8px;padding:2px;height:32px;flex-shrink:0}
.segmented button{border:none;background:none;padding:0 11px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--gray-500);cursor:pointer}
.segmented button:hover{color:var(--gray-700)}
.segmented button.on{background:#fff;color:var(--az-ink);font-weight:600;box-shadow:var(--shadow-1)}
.freset{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;flex-shrink:0;border:none;border-radius:8px;background:var(--orange-50);color:var(--az-orange-600);font-size:12.5px;font-weight:600;cursor:pointer}
.freset:hover{background:var(--orange-100)}
.freset .badge{background:var(--az-orange-600);color:#fff;border-radius:99px;padding:0 6px;font-size:11px}
.fscope{font-size:11px;color:var(--gray-500);padding:0 2px}
.fscope b{color:var(--gray-700)}
[data-f].hide{display:none!important}

/* ===== page + cards ===== */
.page{padding:18px 22px 60px;display:none}
.page.on{display:block}
.rowhd{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.rowhd h2{font-size:13px;font-weight:700;color:var(--gray-800)}
.rowhd .rh-sub{font-size:11.5px;color:var(--gray-500)}
.rowhd .sp{flex:1}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px;margin-bottom:16px}
.kpi-card{background:#fff;border-radius:12px;box-shadow:var(--shadow-1);padding:16px 18px;display:flex;flex-direction:column;gap:5px;cursor:pointer;transition:box-shadow 200ms,transform 150ms var(--ease-out);border:1px solid transparent;position:relative}
.kpi-card:hover{box-shadow:var(--shadow-2);transform:translateY(-1px);border-color:var(--gray-200)}
.kpi-card .go{position:absolute;top:14px;right:14px;color:var(--gray-300)}
.kpi-card:hover .go{color:var(--az-blue)}
.kpi-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--blue-50);color:var(--az-blue);margin-bottom:3px}
.kpi-icon svg{width:16px;height:16px}
.kpi-number{font-size:26px;font-weight:700;color:var(--gray-900);line-height:1.1}
.kpi-number .unit{font-size:14px;font-weight:600;color:var(--gray-400)}
.kpi-label{font-size:12.5px;color:var(--gray-500);min-height:32px}
.kpi-delta{font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:4px}
.up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--gray-500)}
.kpi-bar{height:5px;background:var(--gray-100);border-radius:99px;overflow:hidden;margin-top:6px}
.kpi-bar i{display:block;height:100%;border-radius:99px}

.card{background:#fff;border-radius:12px;box-shadow:var(--shadow-1);margin-bottom:16px;overflow:visible}
.card-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 18px 0}
.card-title{font-size:14px;font-weight:700;color:var(--gray-900)}
.card-hd .sub{font-size:11.5px;color:var(--gray-500);margin-top:2px;line-height:1.5}
.card-bd{padding:14px 18px 18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid32{display:grid;grid-template-columns:3fr 2fr;gap:16px}
@media(max-width:1080px){.grid2,.grid32{grid-template-columns:1fr}}

/* ===== download control ===== */
.cardtools{display:flex;align-items:center;gap:6px;flex-shrink:0}
.dlbtn{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 8px;border:1px solid var(--gray-200);background:#fff;border-radius:7px;color:var(--gray-600);cursor:pointer}
.dlbtn:hover{border-color:var(--az-blue);color:var(--az-blue);background:var(--blue-50)}
.dlmenu{position:fixed;z-index:120;background:#fff;border:1px solid var(--gray-200);border-radius:9px;box-shadow:var(--shadow-3);padding:5px;display:none;min-width:168px}
.dlmenu.on{display:block}
.dlmenu button{display:flex;align-items:center;gap:8px;width:100%;border:none;background:none;text-align:left;font-size:12.5px;color:var(--gray-700);padding:7px 9px;border-radius:6px;cursor:pointer}
.dlmenu button:hover{background:var(--gray-100)}
.dlmenu .hd{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--gray-400);padding:5px 9px 3px;font-weight:700}

/* ===== theme tiles ===== */
.tile-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(296px,1fr));gap:14px}
.tile{background:#fff;border-radius:12px;box-shadow:var(--shadow-1);border-top:3px solid var(--gray-300);padding:16px 18px 12px;cursor:pointer;transition:box-shadow 200ms,transform 150ms var(--ease-out)}
.tile:hover{box-shadow:var(--shadow-2);transform:translateY(-1px)}
.tile-hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.tile-ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tile-ic svg{width:17px;height:17px}
.tile-hd b{font-size:14px;font-weight:700;flex:1;line-height:1.25}
.tile-chip{background:var(--gray-100);color:var(--gray-600);border-radius:99px;padding:2px 9px;font-size:11px;font-weight:600;white-space:nowrap}
.tile-row{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;font-size:12.5px;color:var(--gray-500)}
.tile-row b{font-size:13.5px;color:var(--gray-900);font-variant-numeric:tabular-nums}
.tile-row.big b{font-size:19px}
.tile-prog{margin:6px 0 2px}
.tile-prog .lbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--gray-500);margin-bottom:4px}
.tile-prog .tr{height:7px;background:var(--gray-100);border-radius:99px;overflow:hidden;position:relative}
.tile-prog .tr i{display:block;height:100%;border-radius:99px}
.tile-ft{display:flex;align-items:center;gap:8px;border-top:1px solid var(--gray-100);margin-top:11px;padding-top:9px;font-size:11.5px;color:var(--gray-500)}
.tile-ft .dot{width:8px;height:8px;border-radius:99px;flex-shrink:0}
.tile-ft .go{margin-left:auto;color:var(--az-blue);font-weight:600}

/* ===== indicator cards (theme detail) ===== */
.icard-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:14px}
.icard{background:#fff;border-radius:12px;box-shadow:var(--shadow-1);padding:15px 17px 13px;border:1px solid transparent;cursor:pointer;transition:box-shadow 200ms,transform 150ms var(--ease-out)}
.icard:hover{box-shadow:var(--shadow-2);transform:translateY(-1px);border-color:var(--gray-200)}
.icard-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.icard-id{background:var(--az-ink);color:#fff;border-radius:6px;padding:2px 7px;font-size:10.5px;font-weight:700;letter-spacing:.03em}
.icard-n{font-size:12.5px;font-weight:600;color:var(--gray-800);line-height:1.35;margin-bottom:10px;min-height:34px}
.icard-big{display:flex;align-items:baseline;gap:8px}
.icard-big b{font-size:24px;font-weight:700;line-height:1.05}
.icard-big span{font-size:11.5px;color:var(--gray-500)}
.icard-mini{display:flex;gap:4px;margin-top:10px}
.icard-mini div{flex:1;text-align:center;background:var(--gray-50);border-radius:6px;padding:5px 2px}
.icard-mini span{display:block;font-size:9.5px;color:var(--gray-400);text-transform:uppercase;letter-spacing:.04em}
.icard-mini b{font-size:11.5px;font-variant-numeric:tabular-nums}
.icard-ft{display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:9px;border-top:1px solid var(--gray-100);font-size:11px;color:var(--gray-500)}
.icard-ft .go{margin-left:auto;color:var(--az-blue);font-weight:600}

.crumbnav{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.backbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border:1px solid var(--gray-200);background:#fff;border-radius:8px;font-size:12.5px;color:var(--gray-700);cursor:pointer}
.backbtn:hover{border-color:var(--az-orange);color:var(--az-orange-600)}

/* ===== tables ===== */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--gray-50);color:var(--gray-600);text-align:left;padding:8px 10px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;border-bottom:1px solid var(--gray-200)}
td{padding:7px 10px;border-bottom:1px solid var(--gray-100);white-space:nowrap}
tbody tr[data-drill]{cursor:pointer}
tbody tr[data-drill]:hover td{background:var(--blue-50)}
tr.grouprow td{background:var(--gray-100);font-weight:700;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--az-ink)}
tr.totalrow td{background:var(--orange-50);font-weight:700;border-top:2px solid var(--az-orange)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--gray-400)}

.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:700}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)} .p-none{background:var(--none-bg);color:var(--none)}
.flag{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:11px}
.flag i{width:8px;height:8px;border-radius:2px;display:inline-block}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--gray-600);margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.note{background:var(--blue-50);border-left:3px solid var(--az-blue);border-radius:0 8px 8px 0;padding:10px 12px;font-size:12px;color:var(--gray-700);line-height:1.55;margin-top:12px}
.note.warn{background:var(--warn-bg);border-left-color:var(--warn)}
.note.bad{background:var(--bad-bg);border-left-color:var(--bad)}
.note b{color:var(--gray-900)}

.srcbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:10.5px;color:var(--gray-500);padding:8px 18px;background:var(--gray-50);border-top:1px solid var(--gray-100);border-radius:0 0 12px 12px}
.srctag{background:#fff;border:1px solid var(--gray-200);border-radius:99px;padding:1px 8px;font-weight:600}
.srctag.live{border-color:var(--ok);color:var(--ok)}
.srctag.sheet{border-color:var(--az-blue);color:var(--az-blue)}
.srctag.none{border-color:var(--bad);color:var(--bad)}

/* ===== drawer ===== */
.scrim{position:fixed;inset:0;background:rgba(19,26,34,.42);opacity:0;pointer-events:none;transition:opacity 200ms;z-index:80}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;width:min(820px,96vw);height:100vh;background:#fff;box-shadow:var(--shadow-3);transform:translateX(100%);transition:transform 260ms var(--ease-out);z-index:90;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer-hd{padding:16px 20px;border-bottom:1px solid var(--gray-200);display:flex;align-items:flex-start;gap:12px}
.drawer-hd .dic{width:34px;height:34px;border-radius:9px;background:var(--blue-50);color:var(--az-blue);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.drawer-hd .dic svg{width:17px;height:17px}
.drawer-hd .eyebrow{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--gray-400)}
.drawer-hd h3{font-size:16px;font-weight:700;line-height:1.25}
.drawer-hd .sub{font-size:11.5px;color:var(--gray-500);margin-top:3px}
.drawer-hd .sp{flex:1}
.drawer-x{border:none;background:var(--bad-bg);width:28px;height:28px;border-radius:7px;cursor:pointer;font-size:14px;color:var(--bad);flex-shrink:0}
.drawer-bd{padding:16px 20px 30px;overflow-y:auto;flex:1;background:var(--gray-50)}
.dpanel{background:#fff;border-radius:11px;box-shadow:var(--shadow-1);margin-bottom:14px;overflow:hidden}
.dpanel-hd{padding:13px 16px 0;font-size:13px;font-weight:700}
.dpanel-bd{padding:11px 16px 14px}
.dpanel-bd.flush{padding:0}
.dscroll{max-height:400px;overflow:auto}
.dfoot{padding:9px 16px;font-size:11.5px;color:var(--gray-500);border-top:1px solid var(--gray-100);background:var(--gray-50)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:9px}
.statgrid div{background:var(--gray-50);border-radius:9px;padding:9px 11px}
.statgrid span{display:block;font-size:10.5px;color:var(--gray-500);margin-bottom:2px}
.statgrid b{font-size:16px;font-variant-numeric:tabular-nums}
.crumb{font-size:11px;color:var(--gray-500);margin-bottom:8px}
.crumb b{color:var(--az-blue)}

/* ===== chart primitives (inline SVG / CSS — no external libs) ===== */
.hbar{display:flex;align-items:center;gap:10px;margin:9px 0;cursor:pointer;padding:2px 4px;border-radius:6px}
.hbar:hover{background:var(--gray-50)}
.hbar .lb{width:150px;font-size:11.5px;color:var(--gray-700);text-align:right;flex-shrink:0}
.hbar .tr{flex:1;height:16px;background:var(--gray-100);border-radius:4px;overflow:hidden;position:relative}
.hbar .tr i{display:block;height:100%;border-radius:0 4px 4px 0}
.hbar .tr .tgt{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--gray-700)}
.hbar .vl{width:96px;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;flex-shrink:0}
.spark{display:inline-flex;align-items:flex-end;gap:2px;height:20px}
.spark i{width:5px;border-radius:1px 1px 0 0;background:var(--gray-300)}
.spark i.hi{background:var(--az-orange)}
.heat td.hc{text-align:center;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.stackbar{display:flex;height:22px;border-radius:4px;overflow:hidden;gap:2px;background:var(--gray-100)}
.stackbar i{display:block;cursor:pointer}
svg .gridline{stroke:var(--gray-200);stroke-width:1}
svg .axis{stroke:var(--gray-300);stroke-width:1}
svg text{font-family:var(--font-sans);fill:var(--gray-500);font-size:10px}
svg text.vlab{fill:var(--gray-700);font-size:10px;font-weight:600}

<script>
/* ============================================================
   iNOPS Dashboard — wireframe v1.1
   Structure mirrors the Vedanta grant-dashboard (rail → pagehead →
   tabs → two-row filter strip → page, plus drawer drill-down).
   Every figure on screen is computed from FACTS, so every filter
   genuinely re-slices the page. Charts are inline SVG/CSS so the
   file renders with no network.
   ============================================================ */

const F = n => n==null ? '—' : Math.round(n).toLocaleString('en-IN');
const PCT = n => n==null ? '—' : (n*100).toFixed(0)+'%';
const PCT1 = n => n==null ? '—' : (n*100).toFixed(1)+'%';
const C = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)'];
const SEQ = ['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)','var(--s6)','var(--s7)'];

function ragPill(p){
  if(p==null) return '<span class="pill p-none">No goal</span>';
  if(p>=1)    return '<span class="pill p-ok">'+PCT(p)+' &#10003;</span>';
  if(p>=0.8)  return '<span class="pill p-warn">'+PCT(p)+' !</span>';
  return '<span class="pill p-bad">'+PCT(p)+' &#9660;</span>';
}
function ragBarColor(p){ return p==null?'var(--gray-300)':p>=1?'var(--ok)':p>=0.8?'var(--warn)':'var(--bad)'; }
function ragDot(p){ return p==null?'var(--gray-300)':p>=1?'var(--ok)':p>=0.8?'var(--warn)':'var(--bad)'; }

/* ---------- source stamp under every card ---------- */
function src(kind,text){
  const cls = kind==='live'?'live':kind==='none'?'none':'sheet';
  const lab = kind==='live'?'LIVE ON PROD':kind==='none'?'NO PLATFORM SOURCE':'FROM SHEET';
  return '<div class="srcbar"><span class="srctag '+cls+'">'+lab+'</span><span>'+text+'</span></div>';
}

/* ============================================================
   DOWNLOAD — every card that carries data registers its rows.
   CSV and Excel are produced client-side; no network.
   ============================================================ */
const DL={}; let dlSeq=0;
function reg(name,cols,rows){ const id='dl'+(++dlSeq); DL[id]={name:name,cols:cols,rows:rows}; return id; }
const ICO_DL='<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 21h16"/></svg>';
const ICO_CV='<svg viewBox="0 0 24 24" width="9" height="9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg>';
function dlTool(id){
  if(!id) return '';
  return '<div class="cardtools"><button class="dlbtn" data-dl="'+id+'" title="Download this data">'+ICO_DL+ICO_CV+'</button></div>';
}
function csvEsc(v){ v=(v==null?'':String(v)); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function htmlEsc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function doDownload(id,fmt){
  const d=DL[id]; if(!d) return;
  const stamp=new Date().toISOString().slice(0,10);
  const fname='iNOPS_'+d.name.replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_')+'_'+stamp;
  let blob,ext;
  if(fmt==='csv'){
    const txt=[d.cols.join(',')].concat(d.rows.map(r=>r.map(csvEsc).join(','))).join('\r\n');
    blob=new Blob(['﻿'+txt],{type:'text/csv;charset=utf-8;'}); ext='csv';
  }else{
    const html='<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"></head><body>'+
      '<table border="1"><thead><tr>'+d.cols.map(c=>'<th>'+htmlEsc(c)+'</th>').join('')+'</tr></thead><tbody>'+
      d.rows.map(r=>'<tr>'+r.map(c=>'<td>'+htmlEsc(c)+'</td>').join('')+'</tr>').join('')+
      '</tbody></table><p>Source: iNOPS Dashboard wireframe · '+htmlEsc(d.name)+' · exported '+stamp+'</p></body></html>';
    blob=new Blob(['﻿'+html],{type:'application/vnd.ms-excel;charset=utf-8;'}); ext='xls';
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname+'.'+ext;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
}
const dlmenu=document.getElementById('dlmenu');
function openDlMenu(btn,id){
  const d=DL[id]||{rows:[]};
  dlmenu.innerHTML='<div class="hd">'+(d.rows?d.rows.length:0)+' rows · current filters</div>'+
    '<button data-fmt="csv" data-id="'+id+'">'+ICO_DL+' Download CSV</button>'+
    '<button data-fmt="xls" data-id="'+id+'">'+ICO_DL+' Download Excel (.xls)</button>';
  const r=btn.getBoundingClientRect();
  dlmenu.style.top=(r.bottom+6)+'px';
  dlmenu.style.left=Math.max(8,Math.min(r.right-176,window.innerWidth-186))+'px';
  dlmenu.classList.add('on');
}
function closeDlMenu(){ dlmenu.classList.remove('on'); }

function card(title,sub,body,srcHtml,dlId){
  return '<div class="card"><div class="card-hd"><div><div class="card-title">'+title+'</div>'+
    (sub?'<div class="sub">'+sub+'</div>':'')+'</div>'+dlTool(dlId)+'</div>'+
    '<div class="card-bd">'+body+'</div>'+(srcHtml||'')+'</div>';
}
function rowHead(title,sub,dlId){
  return '<div class="rowhd"><h2>'+title+'</h2>'+(sub?'<span class="rh-sub">'+sub+'</span>':'')+
    '<span class="sp"></span>'+dlTool(dlId)+'</div>';
}
const ICO={
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>',
  target:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>',
  alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',
  grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
  leaf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 20A7 7 0 019.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10z"/><path d="M2 21c0-3 1.9-5.7 5-7"/></svg>',
  bag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a4 4 0 018 0v2"/></svg>',
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l8 4v6c0 5-3.4 9.3-8 10-4.6-.7-8-5-8-10V6z"/></svg>',
  recycle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 19H4.8a2 2 0 01-1.7-3l2.4-4"/><path d="M11 5l2-3 2.6 4.4"/><path d="M17 19h2.2a2 2 0 001.7-3L18 11"/><path d="M9 22l-2-3 3-2"/><path d="M15 22h2"/><path d="M6.5 12L4 8"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 5.6a5.5 5.5 0 00-7.8 0L12 6.6l-1-1a5.5 5.5 0 10-7.8 7.8l8.8 8.8 8.8-8.8a5.5 5.5 0 000-7.8z"/></svg>',
  hand:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 11V6a2 2 0 00-4 0v5"/><path d="M14 10V4a2 2 0 00-4 0v7"/><path d="M10 10.5V6a2 2 0 00-4 0v9"/><path d="M18 8a2 2 0 114 0v6a8 8 0 01-8 8h-2a8 8 0 01-8-8v-1a2 2 0 114 0"/></svg>'
};
/* ---------- horizontal bar with optional target marker ---------- */
function hbar(label,val,max,color,valText,drill,targetPct){
  const w = max? Math.max(val>0?1:0,(val/max)*100) : 0;
  return '<div class="hbar" '+(drill?'data-drill="'+drill+'"':'')+'>'+
    '<div class="lb">'+label+'</div>'+
    '<div class="tr"><i style="width:'+w+'%;background:'+color+'"></i>'+
      (targetPct!=null?'<span class="tgt" style="left:'+Math.min(99.5,targetPct*100)+'%"></span>':'')+
    '</div>'+
    '<div class="vl">'+(valText!=null?valText:F(val))+'</div></div>';
}

/* Nice axis top: 1 / 2 / 2.5 / 5 x 10^k, so ticks read 0 · 10k · 20k · 30k. */
function niceMax(v){
  if(v<=0) return 4;
  const k=Math.pow(10,Math.floor(Math.log10(v)));
  const r=v/k;
  const step=r<=1?1:r<=2?2:r<=2.5?2.5:r<=5?5:10;
  return step*k;
}

function groupedBars(cats, series, opts){
  opts=opts||{};
  const W=opts.w||520,H=opts.h||190,PL=48,PB=28,PT=10,PR=8;
  const iw=W-PL-PR, ih=H-PT-PB;
  const max=Math.max(1,...series.flatMap(s=>s.data));
  const nice=niceMax(max);
  const gw=iw/cats.length, bw=Math.max(5,Math.min(22,(gw-10)/series.length));
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-height:'+H+'px" preserveAspectRatio="xMidYMid meet" role="img">';
  for(let i=0;i<=4;i++){const y=PT+ih-(ih*i/4);
    s+='<line class="gridline" x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'"/>';
    s+='<text x="'+(PL-6)+'" y="'+(y+3)+'" text-anchor="end">'+F(Math.round(nice*i/4))+'</text>';}
  cats.forEach((c,ci)=>{
    series.forEach((se,si)=>{
      const v=se.data[ci]||0, h=(v/nice)*ih;
      const x=PL+ci*gw+(gw-bw*series.length-2*(series.length-1))/2+si*(bw+2);
      s+='<rect x="'+x+'" y="'+(PT+ih-h)+'" width="'+bw+'" height="'+Math.max(0,h)+'" rx="3" fill="'+se.color+'"><title>'+se.name+' · '+c+': '+F(v)+'</title></rect>';
    });
    s+='<text x="'+(PL+ci*gw+gw/2)+'" y="'+(H-9)+'" text-anchor="middle">'+c+'</text>';
  });
  s+='<line class="axis" x1="'+PL+'" y1="'+(PT+ih)+'" x2="'+(W-PR)+'" y2="'+(PT+ih)+'"/></svg>';
  return s;
}

function lineChart(cats, series, opts){
  opts=opts||{};
  const W=opts.w||520,H=opts.h||190,PL=50,PB=26,PT=10,PR=12;
  const iw=W-PL-PR, ih=H-PT-PB;
  const max=Math.max(1,...series.flatMap(s=>s.data));
  const nice=niceMax(max);
  const px=i=>PL+(cats.length===1?iw/2:(iw*i/(cats.length-1)));
  const py=v=>PT+ih-(v/nice)*ih;
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-height:'+H+'px" preserveAspectRatio="xMidYMid meet" role="img">';
  for(let i=0;i<=4;i++){const y=PT+ih-(ih*i/4);
    s+='<line class="gridline" x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'"/>';
    s+='<text x="'+(PL-6)+'" y="'+(y+3)+'" text-anchor="end">'+F(Math.round(nice*i/4))+'</text>';}
  cats.forEach((c,i)=>s+='<text x="'+px(i)+'" y="'+(H-8)+'" text-anchor="middle">'+c+'</text>');
  series.forEach(se=>{
    const d=se.data.map((v,i)=>(i?'L':'M')+px(i)+' '+py(v)).join(' ');
    s+='<path d="'+d+'" fill="none" stroke="'+se.color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"'+(se.dash?' stroke-dasharray="5 4"':'')+'/>';
    se.data.forEach((v,i)=>{ s+='<circle cx="'+px(i)+'" cy="'+py(v)+'" r="4" fill="'+se.color+'" stroke="#fff" stroke-width="2"><title>'+se.name+' · '+cats[i]+': '+F(v)+'</title></circle>'; });
  });
  s+='<line class="axis" x1="'+PL+'" y1="'+(PT+ih)+'" x2="'+(W-PR)+'" y2="'+(PT+ih)+'"/></svg>';
  return s;
}

function donut(items,opts){
  opts=opts||{}; const R=54,r=33,cx=68,cy=68;
  const tot=items.reduce((a,b)=>a+b.v,0)||1;
  let a0=-Math.PI/2, s='<svg viewBox="0 0 136 136" width="136" height="136" role="img">';
  items.forEach(it=>{
    const a1=a0+(it.v/tot)*Math.PI*2, big=(a1-a0)>Math.PI?1:0;
    const p=(ra,an)=>[cx+ra*Math.cos(an),cy+ra*Math.sin(an)];
    const q0=p(R,a0),q1=p(R,a1),q2=p(r,a1),q3=p(r,a0);
    s+='<path d="M'+q0[0]+' '+q0[1]+' A'+R+' '+R+' 0 '+big+' 1 '+q1[0]+' '+q1[1]+' L'+q2[0]+' '+q2[1]+' A'+r+' '+r+' 0 '+big+' 0 '+q3[0]+' '+q3[1]+' Z" fill="'+it.c+'" stroke="#fff" stroke-width="2"><title>'+it.k+': '+F(it.v)+'</title></path>';
    a0=a1;
  });
  s+='<text x="68" y="64" text-anchor="middle" style="font-size:15px;font-weight:700;fill:var(--gray-900)">'+(opts.center||F(tot))+'</text>';
  s+='<text x="68" y="79" text-anchor="middle" style="font-size:9px">'+(opts.sub||'total')+'</text></svg>';
  const leg='<div style="display:flex;flex-direction:column;gap:6px;min-width:200px">'+items.map(it=>
    '<span style="display:flex;align-items:center;gap:7px;font-size:11.5px"><i style="width:10px;height:10px;border-radius:3px;background:'+it.c+'"></i>'+it.k+' <b style="margin-left:auto;font-variant-numeric:tabular-nums">'+F(it.v)+'</b></span>').join('')+'</div>';
  return '<div class="donut-wrap">'+s+leg+'</div>';
}
function legend(items){
  return '<div class="legend">'+items.map(i=>'<span><i style="background:'+i.c+'"></i>'+i.k+'</span>').join('')+'</div>';
}
function emptyBox(t,b){ return '<div class="empty"><b>'+t+'</b>'+b+'</div>'; }

/* ============================================================
   DIMENSIONS
   ============================================================ */
const FY_LIST=['FY 26-27','FY 25-26','FY 24-25','FY 23-24','FY 22-23','FY 21-22'];
const FY_FACTOR={'FY 26-27':1,'FY 25-26':0.86,'FY 24-25':0.64,'FY 23-24':0.47,'FY 22-23':0.31,'FY 21-22':0.19};
const MON=['Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar'];
const MONFULL=['April','May','June','July','August','September','October','November','December','January','February','March'];
const SEASON=[0.92,0.86,1.02,0.97,1.06,1.12,0.83,0.91,1.00,1.04,1.09,1.18];
const QTR={'Q1 · Apr–Jun':[0,1,2],'Q2 · Jul–Sep':[3,4,5],'Q3 · Oct–Dec':[6,7,8],'Q4 · Jan–Mar':[9,10,11]};
/* FY 26-27 is open: partner returns exist to July 2026 only. */
const FY_MONTHS={'FY 26-27':[0,1,2,3]};
const BU_LIST=['INFC','ATS','UFF','AMZL','Unassigned'];
const CHARTERS={1:'1 · Community Engagement',2:'2 · Associate Welfare',3:'3 · Volunteering'};

/* Zone → Province → Locality → BU-Site. iNOPS geography is Amazon's
   operational hierarchy: Zone(State) → Province(District) →
   Locality(Block) → BU-Site(Gram Panchayat) in the underlying doctypes. */
const GEO={
  North:{w:0.3298,lon:77.2,lat:28.6,prov:{

function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0)/4294967295; }

function placeIn(zone,seed){
  const z=GEO[zone], pk=Object.keys(z.prov);
  let r=hash(seed+'|p'), acc=0, prov=pk[pk.length-1];
  for(const p of pk){ acc+=z.prov[p].w; if(r<=acc){ prov=p; break; } }
  const lk=Object.keys(z.prov[prov].loc);
  r=hash(seed+'|l'); acc=0; let loc=lk[lk.length-1];
  for(const l of lk){ acc+=z.prov[prov].loc[l].w; if(r<=acc){ loc=l; break; } }

     across the master rather than piling onto a few codes */
  const sites=z.prov[prov].loc[loc].sites;
  const ck=zone+'|'+prov+'|'+loc;
  SITEC[ck]=(SITEC[ck]||0)+1;
  const site=sites[SITEC[ck]%sites.length];
  return {prov:prov,loc:loc,site:site};
}

   FACT TABLE — one row per FY × month × indicator × BU × zone × partner.
   Integer allocation is largest-remainder, so every published total is
   reproduced exactly at the top and every slice below it adds up.
   ============================================================ */
function alloc(total,weights){
  const sw=weights.reduce((a,b)=>a+b,0);
  if(!sw||!total) return weights.map(()=>0);
  const raw=weights.map(w=>total*w/sw);
  const base=raw.map(Math.floor);
  let rem=total-base.reduce((a,b)=>a+b,0);
  const order=raw.map((v,i)=>[v-Math.floor(v),i]).sort((a,b)=>b[0]-a[0]);
  for(let k=0;k<order.length&&rem>0;k++){ base[order[k][1]]++; rem--; }
  return base;
}

/* The pillar pack covers Apr–Jun 2026 only, so those two modules open on Q1
   rather than on the Leadership default of July. An explicit period change
   afterwards is respected — the empty state then says why. */
function ensurePackPeriod(){
  if(S.page==='lead') return;
  if(S.f.fy!=='All years' && S.f.fy!==PACK_FY) return;
  if(packMonths().length) return;
  S.f.period='Q1 · Apr–Jun';
  const e=document.getElementById('fPeriod'); if(e) e.value=S.f.period;
}
function setPage(p){ S.page=p; S.tab=0; S.theme=null; ensurePackPeriod(); render(); }
function setTab(i){ S.tab=i; S.theme=null; render(); }

function renderTabs(){
  const P=PAGES[S.page];
  document.getElementById('tabs').innerHTML=P.tabs.map((x,i)=>'<button class="tab '+(i===S.tab?'on':'')+'" data-i="'+i+'">'+x+'</button>').join('');
  document.getElementById('pgTitle').textContent=P.title;
  document.getElementById('pgSub').innerHTML=P.sub;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.page===S.page));
  document.querySelectorAll('[data-f]').forEach(el=>el.classList.toggle('hide',P.filters.indexOf(el.dataset.f)<0));
  let scope=P.scope||'';
  if(S.page==='pill'){
    const pk=PACKS[S.pillar];
    scope='Source: <b>'+(pk?pk.file:'Social Security Pillar pack')+'</b> — the '+S.pillar+
      ' pack, Apr–Jun 2026. Partner and period apply; the pillar switcher below sets the pillar.';
  }
  document.getElementById('fScope').innerHTML=scope;
}
function render(){
  renderTabs();
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  const host=document.getElementById('p-'+S.page);
  host.classList.add('on');
  if(S.page==='lead') host.innerHTML=renderLead(S.tab);
  if(S.page==='prog') host.innerHTML=renderProg(S.tab);
  if(S.page==='pill') host.innerHTML=renderPill(S.tab);
  syncReset();
  location.hash='#/'+S.page+'/'+S.tab+(S.theme?'/'+encodeURIComponent(S.theme):'');
}

    ['Theme','Indicators','Indicators reporting','Lives touched','Lives impacted','Goal','% of goal','BU coverage','Partners','Sites'],
    stats.map(s=>[s.th.k,s.n,s.rep,totT(s.rows),totI(s.rows),s.g,s.g?PCT1(s.v/s.g):'',s.bus,s.parts,s.sites]));

  const totV_=totV(rows), totG_=totG(rows);
  const head=card('Theme-level reach, goal and coverage',
    stats.length+' themes · click any tile to open its indicators. Sorted by the framework order — never by value, because the framework order is what leadership reads.',
    '<div class="tile-grid">'+tiles+'</div>',
    src('sheet','Amazon_iNOPS_MBR_July2026.xlsx · Page 0 · goals from the CE revised Goal sheet, Jul–Sep ÷ 3'),dl);

  const roll='<div class="note"><b>Rolled up: '+F(totV_)+' against a goal of '+F(totG_)+' ('+PCT(totG_?totV_/totG_:0)+').</b> '+
    'Charter totals here are computed from the indicator rows. On the full framework that gives a monthly goal of 354,039, where the MBR\'s own Page-0 total row reads 348,307 — a 5,732 difference between the total row and the rows above it, unreconciled in the source sheet and not introduced here.</div>';

  return head+roll;
}

function themeDetail(key){
  const th=THEMES.find(t=>t.k===key)||THEMES[0];
  const rows=slice().filter(r=>r.pil===key);
  const s=themeStats(slice(),th);
  const nav='<div class="crumbnav"><button class="backbtn" data-theme="__back">&larr; All themes</button>'+
    '<div class="crumb" style="margin:0">Theme Overview &rsaquo; <b>'+key+'</b> · '+periodLabel(S.f)+'</div></div>';

  if(!rows.length) return nav+emptyBox('No rows for '+key+' in this slice','This theme has no submission matching the current filters.');

  const recId=reg('Theme '+key+' records',REC_COLS,recRows(rows));
  const k=rowHead(key,s.rep+' of '+s.n+' indicators reporting · '+s.parts+' partners · '+s.sites+' BU-Sites',recId)+
    '<div class="kpi-row">'+
    kpi({key:'th-v|'+key,ico:ICO.users,val:F(s.v),label:metricWord()+' — '+key,delta:PCT(s.pct)+' of goal',dir:s.pct>=1?'up':'down',pct:s.pct})+
    kpi({key:'th-g|'+key,ico:ICO.target,val:F(s.g),label:'Goal for '+periodLabel(S.f),delta:s.g?F(Math.max(0,s.g-s.v))+' to go':'no goal set',dir:'flat'})+
    kpi({key:'th-p|'+key,ico:ICO.doc,val:String(s.parts),label:'Partners delivering this theme',delta:s.rep+' of '+s.n+' indicators live',dir:'flat'})+
    kpi({key:'th-s|'+key,ico:ICO.pin,val:String(s.sites),unit:'/ '+SITE_MASTER,label:'BU-Sites reached by this theme',delta:PCT(s.sites/SITE_MASTER)+' of the site master',dir:'flat',pct:s.sites/SITE_MASTER})+
  '</div>';

  const ids=[...distinct(rows,r=>r.ind)].sort();
  const cards=ids.map(id=>{
    const ind=IND_BY[id], r=rows.filter(x=>x.ind===id);
    const v=totV(r), g=totG(r), p=g?v/g:null;
    const bu=group(r,x=>x.bu).sort((a,b)=>b.v-a.v).slice(0,5);
    const parts=[...distinct(r.filter(x=>x.t>0),x=>x.pt)];
    /* an indicator with no source form is not "0% of goal" — it is unsourced */
    const noSrc=ind.st==='unmapped'||ind.st==='outside'||ind.st==='closed';
    return '<div class="icard" data-drill="ind:'+id+'">'+
      '<div class="icard-hd"><span class="icard-id">'+id+'</span>'+((g&&!(noSrc&&!v))?ragPill(p):ST_TAG[ind.st])+'</div>'+
      '<div class="icard-n">'+ind.n+'</div>'+
      '<div class="icard-big"><b style="color:'+(v?'var(--gray-900)':'var(--gray-400)')+'">'+F(v)+'</b>'+
        '<span>of '+(g?F(g):'no goal')+'</span></div>'+
      '<div class="tile-prog" style="margin-top:8px"><div class="tr"><i style="width:'+Math.min(100,(p||0)*100)+'%;background:'+ragBarColor(p)+'"></i></div></div>'+
      '<div class="icard-mini">'+bu.map(b=>'<div><span>'+b.k+'</span><b>'+F(b.v)+'</b></div>').join('')+'</div>'+
      '<div class="icard-ft">'+(parts.length?parts.slice(0,2).join(', ')+(parts.length>2?' +'+(parts.length-2):''):ind.form)+
        '<span class="go">View records &rarr;</span></div>'+
    '</div>';
  }).join('');

  const grid=card('Indicators in '+key,
    'One card per indicator. The bar is achievement against the goal for the selected period; the strip below it is the Business Unit split. Click a card for the rows behind it.',
    '<div class="icard-grid">'+cards+'</div>',
    src('sheet','Amazon_iNOPS_MBR_July2026.xlsx · Page 0'),
    reg('Indicators '+key,['Indicator','Name','Form','Status','Actual','Goal','% of goal','Partners'],
      ids.map(id=>{const ind=IND_BY[id],r=rows.filter(x=>x.ind===id),v=totV(r),g=totG(r);
        return [id,ind.n,ind.form,ST_TXT[ind.st],v,g,g?PCT1(v/g):'',[...distinct(r,x=>x.pt)].join('; ')];})));

  const buRows=group(rows,r=>r.bu);
  const maxBU=Math.max(1,...buRows.map(o=>o.v));
  const split=card('Business Unit split — '+key,
    'Unassigned = submissions whose site code is not in the BU dictionary.',
    buRows.sort((a,b)=>b.v-a.v).map((o,ix)=>hbar(o.k,o.v,maxBU,C[ix%5],F(o.v),'bu:'+o.k)).join(''),

    'Who actually filed against this theme in the selected period.',

  return nav+k+grid+'<div class="grid2">'+split+byPart+'</div>';
}

/* ---------- TAB 3 · BUSINESS UNITS ---------- */
function leadBU(){
  const rows=slice();
  if(!rows.length) return emptyBox('Nothing reported in this slice','No Business Unit rows match '+periodLabel(S.f)+'.');
  const buRows=BU_LIST.map(b=>{const o=group(rows.filter(r=>r.bu===b),()=>b)[0]; return o||{k:b,t:0,i:0,v:0,g:0,n:0,rows:[]};});
  const max=Math.max(1,...buRows.map(o=>Math.max(o.v,o.g)));
  const contrib=card('Business Unit contribution — '+periodLabel(S.f),
    'IN Ops = INFC + ATS + UFF + AMZL, plus the sites whose code prefix is not yet in the BU dictionary. Click a bar for that BU.',
    legend([{k:metricWord(),c:'var(--c1)'},{k:'Goal',c:'var(--gray-700)'}])+
    buRows.map((o,ix)=>hbar(o.k,o.v,max,o.k==='Unassigned'?'var(--gray-400)':C[ix%5],F(o.v)+(o.g?'  '+PCT(o.v/o.g):''),'bu:'+o.k,o.g?o.g/max:null)).join(''),
    src('sheet','Amazon_iNOPS_MBR_July2026.xlsx · Page 0, by Business Unit'),
    reg('Business Units '+periodLabel(S.f),['Business Unit','Lives touched','Lives impacted','Goal','% of goal','Records','Sites'],
      buRows.map(o=>[o.k,o.t,o.i,o.g,o.g?PCT1(o.v/o.g):'',o.n,distinct(o.rows,r=>r.site).size])));

  const pils=THEMES.map(t=>t.k).filter(k=>rows.some(r=>r.pil===k));
  const series=BU_LIST.filter(b=>rows.some(r=>r.bu===b)).map((b,ix)=>({
    name:b,color:b==='Unassigned'?'var(--gray-400)':C[ix%5],
    data:pils.map(p=>totV(rows.filter(r=>r.bu===b&&r.pil===p)))
  }));
  const grouped=card('Pillar &times; Business Unit',
    'Grouped columns, one group per pillar. Hover a column for the exact figure.',
    legend(series.map(s=>({k:s.name,c:s.color})))+groupedBars(pils.map(p=>p.split(' ')[0]),series,{h:220,w:560}),
    src('sheet','Amazon_iNOPS_MBR_July2026.xlsx · Page 0'),
    reg('Pillar by BU '+periodLabel(S.f),['Pillar'].concat(series.map(s=>s.name)),
      pils.map((p,pi)=>[p].concat(series.map(s=>s.data[pi])))));

  const zones=ZN.filter(z=>rows.some(r=>r.z===z));
  const heatCols=pils.slice(0,5);
  const heatCard=card('Zone &times; pillar — % of goal',
    'Sequential ramp, one hue light→dark. A dash means no goal is set for that combination. Cell click opens the rows behind it.',
    '<div style="overflow-x:auto"><table class="heat"><thead><tr><th>Zone</th>'+heatCols.map(h=>'<th class="num">'+h+'</th>').join('')+'</tr></thead><tbody>'+
    zones.map(z=>'<tr><td><b>'+z+'</b></td>'+heatCols.map(p=>{
      const r=rows.filter(x=>x.z===z&&x.pil===p);
      const v=totV(r), g=totG(r);
      if(!g) return '<td class="hc muted">–</td>';
      const pctv=Math.round((v/g)*100);
      const step=SEQ[Math.min(6,Math.floor(pctv/22))];
      const ink = pctv>=88?'#fff':'var(--gray-800)';
      return '<td class="hc" style="background:'+step+';color:'+ink+'" data-drill="heat:'+z+'|'+p+'">'+pctv+'%</td>';
    }).join('')+'</tr>').join('')+'</tbody></table></div>',
    src('sheet','Computed from Page 0 by zone and pillar'),
    reg('Zone by pillar '+periodLabel(S.f),['Zone'].concat(heatCols),
      zones.map(z=>[z].concat(heatCols.map(p=>{const r=rows.filter(x=>x.z===z&&x.pil===p);const g=totG(r);return g?PCT1(totV(r)/g):'';})))));

  const un=buRows.find(o=>o.k==='Unassigned');
  const note=un&&un.v?'<div class="note warn"><b>'+F(un.v)+' of '+F(totV(rows))+' ('+PCT(un.v/totV(rows))+
    ') sits in Unassigned.</b> Business Unit is derived from the site-code prefix, not stored on the record, so a site missing from the master counts at IN Ops level but in no BU row. A single site dictionary closes this column permanently.</div>':'';

  return contrib+'<div class="grid2">'+grouped+heatCard+'</div>'+note;
}

/* ---------- TAB 4 · TREND ---------- */
function leadTrend(){
  const f=Object.assign({},S.f,{period:'Full year'});
  const rows=FACTS.filter(r=>matches(r,f));
  if(!rows.length) return emptyBox('No trend for this selection','Nothing reported across '+(S.f.fy==='All years'?'any year':S.f.fy)+' on these filters.');
  const monthsPresent=MON.map((m,i)=>i).filter(i=>rows.some(r=>r.m===i&&r.t>0));
  const cats=monthsPresent.map(i=>MON[i]);
  const topInds=group(rows,r=>r.ind).sort((a,b)=>b.v-a.v).slice(0,5).map(o=>o.k);
  const series=topInds.map((id,ix)=>({name:id+' '+IND_BY[id].n.slice(0,30),color:C[ix%5],
    data:monthsPresent.map(mi=>totV(rows.filter(r=>r.ind===id&&r.m===mi)))}));
  const t=card('Monthly trend — '+(S.f.fy==='All years'?'all years combined':S.f.fy),
    'Time runs left to right, y-axis starts at zero. Direction matters more than level: a line falls when a partner stops reporting, not only when delivery stops. The period filter does not apply to this chart — the whole year is the point.',
    legend(series.map(s=>({k:s.name,c:s.color})))+lineChart(cats,series,{h:250,w:900}),
    src('sheet','Apr–Jun as published in the Q2 QBR (17 Jul 2026); July computed from the partner returns'),
    reg('Trend by indicator',['Indicator'].concat(cats),series.map(s=>[s.name].concat(s.data))));

  const totals=monthsPresent.map(mi=>totV(rows.filter(r=>r.m===mi)));
  const goals=monthsPresent.map(mi=>totG(rows.filter(r=>r.m===mi)));
  const vsGoal=card('Total against goal, by month',
    'Actual column against the month\'s goal column — two measures of the same thing on one scale, never two axes.',
    legend([{k:metricWord(),c:C[0]},{k:'Goal',c:'var(--gray-400)'}])+
    groupedBars(cats,[{name:'Actual',color:C[0],data:totals},{name:'Goal',color:'var(--gray-400)',data:goals}],{h:220,w:560}),
    src('sheet','Amazon_iNOPS_MBR_July2026.xlsx · Trend'),
    reg('Monthly totals',['Month','Actual','Goal','% of goal'],cats.map((c,i)=>[c,totals[i],goals[i],goals[i]?PCT1(totals[i]/goals[i]):''])));

  const sparks=card('Indicator momentum',
    'One row per indicator in this slice. The last bar is the most recent month with a return.',
    group(rows,r=>r.ind).sort((a,b)=>b.v-a.v).slice(0,8).map(o=>{
      const d=monthsPresent.map(mi=>totV(rows.filter(r=>r.ind===o.k&&r.m===mi)));
      const mx=Math.max(1,...d);
      return '<div class="hbar" data-drill="ind:'+o.k+'"><div class="lb"><b>'+o.k+'</b> '+IND_BY[o.k].n.slice(0,20)+'</div>'+
        '<div style="flex:1"><span class="spark">'+d.map((v,i)=>'<i class="'+(i===d.length-1?'hi':'')+'" style="height:'+Math.max(3,(v/mx)*20)+'px"></i>').join('')+'</span></div>'+
        '<div class="vl">'+F(d[d.length-1])+'</div></div>';
    }).join(''),
    src('sheet','Amazon_iNOPS_MBR_July2026.xlsx · Trend'),
    reg('Indicator momentum',['Indicator','Name'].concat(cats),
      group(rows,r=>r.ind).sort((a,b)=>b.v-a.v).map(o=>[o.k,IND_BY[o.k].n].concat(monthsPresent.map(mi=>totV(rows.filter(r=>r.ind===o.k&&r.m===mi)))))));

  return t+'<div class="grid2">'+vsGoal+sparks+'</div>';
}

function packMonths(){ return PACK_MONTHS.filter(m=>monthsOf(S.f.period).indexOf(m)>=0).map(m=>MON[m]); }
function packColActive(col){

function renderProg(tab){
  const g=packGuard(); if(g) return g;
  if(tab===0) return progRecon();
  if(tab===1) return progYTD();
  return progMOU();
}
function gapPill(g){
  if(g==null) return '<span class="pill p-none">—</span>';
  const p=(g*100).toFixed(1)+'%';
  if(Math.abs(g)<=0.02) return '<span class="pill p-ok">'+(g>=0?'+':'')+p+' &#10003;</span>';
  if(Math.abs(g)<=0.15) return '<span class="pill p-warn">'+(g>=0?'+':'')+p+' !</span>';
  return '<span class="pill p-bad">'+(g>=0?'+':'')+p+' &#9650;</span>';
}
function reconData(key){
  const d=RECON[key], ms=packMonths();
  const cols=d.cols.filter(packColActive);
  const rows=ms.map(m=>{
    const raw=cols.reduce((a,c)=>a+d.rows[m][c],0);
    /* Page 0 is only comparable when the whole partner set is in view */
    const p0=(cols.length===d.cols.length)?d.rows[m].p0:null;
    return {m:m,cells:cols.map(c=>d.rows[m][c]),raw:raw,p0:p0,gap:p0?(raw-p0)/p0:null};
  });
  const tot={cells:cols.map(c=>ms.reduce((a,m)=>a+d.rows[m][c],0)),
             raw:rows.reduce((a,r)=>a+r.raw,0),
             p0:rows.every(r=>r.p0!=null)?rows.reduce((a,r)=>a+r.p0,0):null};
  tot.gap=tot.p0?(tot.raw-tot.p0)/tot.p0:null;
  return {cols:cols,rows:rows,tot:tot,label:d.label};
}
function reconTable(D){
  return '<table><thead><tr><th>Month</th>'+D.cols.map(c=>'<th class="num">'+c+'</th>').join('')+
    '<th class="num">Raw total</th><th class="num">Page 0</th><th class="num">Gap</th></tr></thead><tbody>'+
    D.rows.map(r=>'<tr data-drill="recon:'+r.m+'"><td><b>'+r.m+'</b></td>'+
      r.cells.map(v=>'<td class="num">'+F(v)+'</td>').join('')+
      '<td class="num"><b>'+F(r.raw)+'</b></td><td class="num">'+(r.p0==null?'<span class="muted">n/a</span>':F(r.p0))+'</td>'+
      '<td class="num">'+gapPill(r.gap)+'</td></tr>').join('')+
    '<tr class="totalrow"><td>Total</td>'+D.tot.cells.map(v=>'<td class="num">'+F(v)+'</td>').join('')+
    '<td class="num">'+F(D.tot.raw)+'</td><td class="num">'+(D.tot.p0==null?'n/a':F(D.tot.p0))+'</td>'+
    '<td class="num">'+gapPill(D.tot.gap)+'</td></tr></tbody></table>';
}

function renderPill(tab){
  const head=pillarSwitch();

    return head+(tab===0?pillSurveyor():tab===1?pillNarrative():pillDQ());

/* ---------- reconciliation card, shared by both packs ---------- */
function reconCard(r,P){
  const ms=monSel();
  const keep=r.cols.map((c,i)=>i).filter(i=>ownerActive(r.owner[i]));
  const rows=r.rows.filter(x=>ms.indexOf(x[0])>=0);
  if(!keep.length) return card(r.id+' — '+r.title,r.note,
    emptyBox('No delivery partner in view','Neither '+r.owner.join(' nor ')+' matches the partner filter.'),
    src('sheet',P.file+' · sheet 1 Monthly Reconciliation'));
  const full=keep.length===r.cols.length;
  const body=rows.map(x=>{
    const cells=keep.map(i=>x[1][i]);
    const raw=cells.reduce((a,b)=>a+b,0);
    const p0=full?x[2]:null;
    return {m:x[0],cells:cells,raw:raw,p0:p0,gap:p0?(raw-p0)/p0:null};
  });
  const tRaw=body.reduce((a,b)=>a+b.raw,0);
  const tP0=full?body.reduce((a,b)=>a+(b.p0||0),0):null;
  const tGap=tP0?(tRaw-tP0)/tP0:null;
  const tbl='<table><thead><tr><th>Month</th>'+keep.map(i=>'<th class="num">'+r.cols[i]+'</th>').join('')+
    '<th class="num">Raw total</th><th class="num">Page 0</th><th class="num">Gap</th></tr></thead><tbody>'+
    body.map(b=>'<tr data-drill="recon:'+r.id+' '+b.m+'"><td><b>'+b.m+'</b></td>'+
      b.cells.map(v=>'<td class="num">'+F(v)+'</td>').join('')+
      '<td class="num"><b>'+F(b.raw)+'</b></td><td class="num">'+(b.p0==null?'<span class="muted">n/a</span>':F(b.p0))+'</td>'+
      '<td class="num">'+gapPill(b.gap)+'</td></tr>').join('')+
    '<tr class="totalrow"><td>Total</td>'+keep.map((i,k)=>'<td class="num">'+F(body.reduce((a,b)=>a+b.cells[k],0))+'</td>').join('')+
    '<td class="num">'+F(tRaw)+'</td><td class="num">'+(tP0==null?'n/a':F(tP0))+'</td><td class="num">'+gapPill(tGap)+'</td></tr>'+
    '</tbody></table>'+
    (r.goal?'<div style="margin-top:10px">'+hbar('Q1 goal '+F(r.goal),tP0||tRaw,Math.max(r.goal,tP0||tRaw),
        ragBarColor((tP0||tRaw)/r.goal),F(tP0||tRaw)+'  '+PCT((tP0||tRaw)/r.goal),null,
        r.goal/Math.max(r.goal,tP0||tRaw))+'</div>':'');
  const dl=reg(P.pillar+' '+r.id+' reconciliation',['Month'].concat(keep.map(i=>r.cols[i]),['Raw total','Page 0','Gap %']),
    body.map(b=>[b.m].concat(b.cells,[b.raw,b.p0,b.gap==null?'':PCT1(b.gap)])));
  return card(r.id+' — '+r.title,r.note,tbl,src('sheet',P.file+' · sheet 1 Monthly Reconciliation'),dl)+
    (full?'<div class="note '+(r.tone==='bad'?'bad':r.tone==='warn'?'warn':'')+'">'+r.read+'</div>'
        :'<div class="note warn"><b>Page 0 is published at indicator level, not per partner.</b> The comparison column is suppressed on a partner filter rather than shown against a partial raw total.</div>');
}

  return k+healthCard+'<div class="grid2">'+gmCard+swCard+'</div>'+zoneCard;

/* ---------- TAB 2 · narrative vs data ---------- */
function packNarrative(P){
  const recons=P.recon.map(r=>reconCard(r,P)).join('');
  const heads=P.recon.map(r=>{
    const keep=r.cols.map((c,i)=>i).filter(i=>ownerActive(r.owner[i]));
    const full=keep.length===r.cols.length;
    const rows=r.rows.filter(x=>monSel().indexOf(x[0])>=0);
    const raw=rows.reduce((a,x)=>a+keep.reduce((s,i)=>s+x[1][i],0),0);
    const p0=full?rows.reduce((a,x)=>a+x[2],0):null;
    return {id:r.id,raw:raw,p0:p0,gap:p0?(raw-p0)/p0:null,tone:r.tone};
  });
  const k=rowHead('Narrative vs platform',scopeLine(P),
    reg(P.pillar+' narrative vs platform',['Indicator','Raw total','Page 0','Gap %'],
      heads.map(h=>[h.id,h.raw,h.p0,h.gap==null?'':PCT1(h.gap)])))+
  '<div class="kpi-row">'+heads.map(h=>kpi({key:'pk-'+h.id,ico:h.tone==='ok'?ICO.check:ICO.alert,
      val:h.gap==null?'n/a':(h.gap>0?'+':'')+PCT1(h.gap),label:h.id+' — raw against Page 0',
      delta:F(h.raw)+' raw'+(h.p0?' · '+F(h.p0)+' reported':''),dir:h.tone==='bad'?'down':'flat'})).join('')+'</div>';

  const cats=heads.map(h=>h.id);
  const chart=card('Every indicator, raw against Page 0',
    'Two measures of the same thing on one scale — never two axes. A bar pair that does not match is a counting-rule question until proven otherwise.',
    legend([{k:'Raw partner data',c:C[0]},{k:'Reported to Page 0',c:C[1]}])+
    groupedBars(cats,[{name:'Raw',color:C[0],data:heads.map(h=>h.raw)},
                      {name:'Page 0',color:C[1],data:heads.map(h=>h.p0||0)}],{h:210,w:620}),
    src('sheet',P.file+' · sheet 1'),
    reg(P.pillar+' raw vs Page 0',['Indicator','Raw','Page 0'],heads.map(h=>[h.id,h.raw,h.p0])));

  return k+chart+recons+(P.mou?mouCard(P):'')+(P.mouA?accessMouCard(P):'')+(P.donation?donationCard(P):'');
}

function packDQ(P){
  const dq=P.dq.filter(r=>(S.f.partner==='All'||r[0]===S.f.partner||r[0]==='Cross-partner')&&(qMatch(r[0])||qMatch(r[1])||qMatch(r[3])));

  const flagged=(P.flagged||[]).filter(r=>(S.f.partner==='All'||r[1].indexOf(S.f.partner)>=0)&&qMatch(r.join(' ')));
  if(!dq.length&&!good.length&&!flagged.length) return emptyBox('No finding matches','Clear the partner filter or the search box.');
  const dlDQ=reg(P.pillar+' data quality register',['Partner','Finding','Measure','Detail','Severity'],
    dq.map(r=>[r[0],r[1],r[2]==null?'':PCT1(r[2]),r[3],r[4]]));

    kpi({key:'pd-2',ico:ICO.doc,val:String(flagged.length),label:'Sites or officer groups flagged',delta:'consolidated across indicators',dir:'flat'})+
    (P.dup?kpi({key:'pd-3',ico:ICO.users,val:PCT1(P.dup.total[2]),label:'Rows matching the duplicate signature',delta:P.dup.total[0]+' excess of '+F(P.dup.total[1]),dir:'down',pct:P.dup.total[2]})
          :kpi({key:'pd-3',ico:ICO.users,val:String(P.dupTests?P.dupTests.reduce((a,r)=>a+r[1],0):0),label:'Duplicate rows found across the three ACCESS files',delta:'of '+F(P.dupTests?P.dupTests.reduce((a,r)=>a+r[2],0):0)+' rows tested',dir:'down'}))+
    kpi({key:'pd-4',ico:ICO.check,val:String(good.length),label:'Good practices worth replicating',delta:good.length?'named partner behaviours':'none recorded in this pack',dir:good.length?'up':'flat'})+

  const tbl=card('Data quality register','Every finding carries its measurement and its consequence. Sorted worst first.',
    dq.length?'<table><thead><tr><th>Partner</th><th>Finding</th><th class="num">Measure</th><th>Detail</th></tr></thead><tbody>'+

      '<td style="white-space:normal">'+r[3]+'</td></tr>').join('')+'</tbody></table>'
      :emptyBox('No finding for this partner','Nothing logged against '+S.f.partner+'.'),
    src('sheet',P.file+' · consolidated data-quality sheets'),dlDQ);

  let extra='';
  if(P.dup){
    const dup=partnerRows(P.dup.partners,0);
    const one=P.dup.oneMonth.filter(r=>S.f.partner==='All'||r[2]===S.f.partner);
    extra='<div class="grid2">'+
      card('Duplicate rate by partner',P.dup.rule,
        legend([{k:'Duplicate rate',c:'var(--bad)'}])+
        dup.map(r=>hbar(r[0],r[3],0.25,r[3]>=0.15?'var(--bad)':'var(--warn)',PCT1(r[3])+'  '+r[1]+' of '+F(r[2]),'dq:'+r[0])).join(''),
        src('sheet',P.file+' · sheet 5 Duplicate Analysis'),
        reg('Food Security duplicates',['Partner','Excess entries','Partner raw total','% of partner total'],
          dup.map(r=>[r[0],r[1],r[2],PCT1(r[3])])))+
      card('Sites reporting in only 1 of 3 months',
        one.length+' sites filed in a single month. Confirm whether they opened or closed during the quarter, or whether reporting is simply incomplete.',
        one.length?'<table><thead><tr><th>Site</th><th>Zone</th><th>Partner</th><th>Month active</th><th class="num">Q2 total</th></tr></thead><tbody>'+
        one.map(r=>'<tr data-drill="site:'+r[0]+'"><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td>'+
          '<td class="num">'+F(r[4])+'</td></tr>').join('')+'</tbody></table>':emptyBox('None for this partner',''),
        src('sheet',P.file+' · sheet 5'),
        reg('Sites active one month only',['Site','Zone','Partner','Month active','Q2 total'],one))+
      '</div>';
  }
  if(P.dupTests){

      '<table><thead><tr><th>File</th><th class="num">Duplicate rows</th><th class="num">File total</th><th class="num">Rate</th><th>Reading</th></tr></thead><tbody>'+
      dt.map(r=>'<tr data-drill="dq:'+r[0]+'"><td>'+r[0]+'</td><td class="num">'+r[1]+'</td><td class="num">'+F(r[2])+'</td>'+

      '<td style="white-space:normal">'+r[3]+'</td>'+
      '<td><span class="pill '+(r[4]==='High'?'p-bad':r[4]==='Medium'?'p-warn':'p-none')+'">'+r[4]+'</span></td>'+
      '<td style="white-space:normal;color:var(--gray-500)">'+r[5]+'</td></tr>').join('')+'</tbody></table>',
    src('sheet',P.file+' · sheet Non-Performing Sites'),
    reg(P.pillar+' flagged sites',['Site / group','Partner','Indicator','Issue','Severity','Detail'],flagged)):'';

  const goodCard=P.good?card('Good practices — what is already working',
    'The transferable lessons. Each one is a named partner behaviour another partner can copy.',
    good.length?'<table><thead><tr><th>Partner</th><th>Highlight</th><th>Why it matters</th></tr></thead><tbody>'+
    good.map(r=>'<tr data-drill="gp:'+r[0]+'"><td><b>'+r[0]+'</b></td><td style="white-space:normal">'+r[1]+'</td>'+
      '<td style="white-space:normal;color:var(--gray-500)">'+r[2]+'</td></tr>').join('')+'</tbody></table>'
      :emptyBox('None logged for this partner',''),
    src('sheet',P.file+' · sheet Good Practices'),
    reg(P.pillar+' good practices',['Partner','Highlight','Why it matters'],good))
    :'<div class="note warn"><b>This pack has no Good Practices sheet.</b> The Social Security and Livelihood packs both carry one; the Food Security pack records findings only. Worth asking for the same section so the pillar review is not purely a defect list.</div>';

  return k+tbl+extra+flagCard+goodCard;
}

function scatterSVG(rows){
  const W=520,H=210,PL=48,PB=28,PT=10,PR=10,iw=W-PL-PR,ih=H-PT-PB;
  const mx=Math.max(1,...rows.map(r=>r[4])), my=niceMax(Math.max(1,...rows.map(r=>r[3])));
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-height:'+H+'px" preserveAspectRatio="xMidYMid meet" role="img">';
  for(let i=0;i<=4;i++){const y=PT+ih-(ih*i/4);
    s+='<line class="gridline" x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'"/>';
    s+='<text x="'+(PL-6)+'" y="'+(y+3)+'" text-anchor="end">'+F(Math.round(my*i/4))+'</text>';}
  rows.forEach(r=>{
    const x=PL+(r[4]/mx)*iw, y=PT+ih-(r[3]/my)*ih;
    s+='<circle cx="'+x+'" cy="'+y+'" r="5.5" fill="'+FLAGC[r[8]]+'" fill-opacity=".85" stroke="#fff" stroke-width="1.5"><title>'+r[2]+' ('+r[0]+') — '+r[4]+' activities, '+F(r[3])+' reached</title></circle>';
  });
  s+='<line class="axis" x1="'+PL+'" y1="'+(PT+ih)+'" x2="'+(W-PR)+'" y2="'+(PT+ih)+'"/>';
  s+='<text x="'+(PL+iw/2)+'" y="'+(H-6)+'" text-anchor="middle">Activities reported &rarr;</text></svg>';
  return s;
}
function pillNarrative(){
  const A=reconData('A.3.1'), B=reconData('A.3.2');
  const k=rowHead('Narrative vs platform','Partner narrative figures against the platform, '+packMonths().join(', '),
    reg('Narrative vs platform',['Indicator','Month','Narrative','Platform','Gap %'],
      [].concat(A.rows.map(r=>['A.3.1',r.m,r.raw,r.p0,r.gap==null?'':PCT1(r.gap)]),
                B.rows.map(r=>['A.3.2',r.m,r.raw,r.p0,r.gap==null?'':PCT1(r.gap)]))))+
  '<div class="kpi-row">'+
    kpi({key:'n1',ico:ICO.doc,val:F(A.tot.raw),label:'Narrative report figure — A.3.1',delta:'partner submissions',dir:'flat'})+
    kpi({key:'n2',ico:ICO.check,val:A.tot.p0==null?'n/a':F(A.tot.p0),label:'Platform / Page 0 figure — A.3.1',delta:A.tot.gap==null?'not comparable on a partner filter':PCT1(Math.abs(A.tot.gap))+' apart',dir:'up'})+
    kpi({key:'n3',ico:ICO.doc,val:F(B.tot.raw),label:'Narrative report figure — A.3.2',delta:'partner submissions',dir:'flat'})+
    kpi({key:'n4',ico:ICO.alert,val:B.tot.p0==null?'n/a':F(B.tot.p0),label:'Platform / Page 0 figure — A.3.2',delta:B.tot.gap==null?'not comparable on a partner filter':PCT1(B.tot.gap)+' apart',dir:'down'})+
  '</div>';

  const cats=[].concat(A.rows.map(r=>'A.3.1 '+r.m),B.rows.map(r=>'A.3.2 '+r.m));
  const cmp=card('Narrative report figures vs data on the platform',
    'The question this view answers: when a partner writes a number in their monthly narrative, does the platform agree? Two measures, one scale.',
    legend([{k:'Narrative report',c:C[0]},{k:'Platform (Page 0)',c:C[1]}])+
    groupedBars(cats,[
      {name:'Narrative',color:C[0],data:[].concat(A.rows.map(r=>r.raw),B.rows.map(r=>r.raw))},
      {name:'Platform',color:C[1],data:[].concat(A.rows.map(r=>r.p0||0),B.rows.map(r=>r.p0||0))}
    ],{h:220,w:760}),
    src('sheet','Social Security Pillar pack · sheet 1 — the same comparison at pillar-lead grain'),
    reg('Narrative vs platform chart',['Series'].concat(cats),
      [['Narrative'].concat(A.rows.map(r=>r.raw),B.rows.map(r=>r.raw)),
       ['Platform'].concat(A.rows.map(r=>r.p0),B.rows.map(r=>r.p0))]));

  const basis=[
    ['A.3.1','Financial wellbeing awareness',A.tot.raw,A.tot.p0,A.tot.gap,'Reconciles. Nothing to action.'],
    ['A.3.2','Enrolments to schemes',B.tot.raw,B.tot.p0,B.tot.gap,'Does not reconcile. Jan Sahas reports on an "individuals enrolled" basis; applications (25,391) and benefits delivered (24,773) are materially lower.'],
    ['A.3.2','— if counted as applications',25391,B.tot.p0,B.tot.p0?(25391-B.tot.p0)/B.tot.p0:null,'Counting rule, not a data error. The basis has to be agreed before the gap can be called.'],
    ['A.3.2','— if counted as benefits delivered',24773,B.tot.p0,B.tot.p0?(24773-B.tot.p0)/B.tot.p0:null,'Same. Three defensible numbers exist for one indicator.']
  ];
  const tbl=card('Where the two disagree, and why',
    'Each row states the reason. A reconciliation gap is a counting-rule question until proven otherwise.',
    '<table><thead><tr><th>#</th><th>Basis</th><th class="num">Narrative</th><th class="num">Platform</th><th class="num">Gap</th><th>Reading</th></tr></thead><tbody>'+
    basis.map(r=>'<tr data-drill="narr:'+r[1]+'"><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td class="num">'+F(r[2])+'</td>'+
      '<td class="num">'+(r[3]==null?'n/a':F(r[3]))+'</td><td class="num">'+gapPill(r[4])+'</td><td style="white-space:normal">'+r[5]+'</td></tr>').join('')+
    '</tbody></table>',
    src('sheet','Social Security Pillar pack · sheets 1 and 4'),
    reg('Counting basis',['Indicator','Basis','Narrative','Platform','Gap %','Reading'],
      basis.map(r=>[r[0],r[1],r[2],r[3],r[4]==null?'':PCT1(r[4]),r[5]])));

  return k+cmp+tbl+'<div class="note warn"><b>This is the view that settles an MBR argument.</b> It puts the partner\'s own narrative figure next to the platform figure for the same month and indicator, and names the counting basis behind each. Without it, the monthly conversation is two people quoting different numbers at each other.</div>';
}
function pillDQ(){
  const rows=DQ.filter(r=>(S.f.partner==='All'||r[0]===S.f.partner||r[0]==='Cross-partner')&&(qMatch(r[0])||qMatch(r[1])||qMatch(r[3])));
  const good=GOODP.filter(r=>(S.f.partner==='All'||r[0]===S.f.partner)&&(qMatch(r[0])||qMatch(r[1])));
  if(!rows.length&&!good.length) return emptyBox('No data-quality finding matches','Clear the partner filter or the search box.');
  const dlDQ=reg('Data quality register',['Partner','Finding','Measure','Detail','Severity'],rows.map(r=>[r[0],r[1],r[2]==null?'':PCT1(r[2]),r[3],r[4]]));

  const k=rowHead('Data quality',rows.length+' findings · '+good.length+' good practices · '+(S.f.partner==='All'?'all partners':S.f.partner),dlDQ)+
  '<div class="kpi-row">'+
    kpi({key:'d1',ico:ICO.alert,val:'32.8%',label:'HHH household records with a placeholder Household Number',delta:'state convention, not individual error',dir:'down',pct:0.328})+
    kpi({key:'d2',ico:ICO.target,val:'28.6%',label:'Jan Sahas DBT share against a 40% MoU commitment',delta:'11.4 pts short',dir:'down',pct:0.715})+
    kpi({key:'d3',ico:ICO.pin,val:'27',unit:'/ 71',label:'Sites carrying two or more partners',delta:'no common beneficiary key',dir:'down'})+
    kpi({key:'d4',ico:ICO.check,val:'0',label:'True duplicate records, Jan Sahas (18,138 applications)',delta:'seven separate tests',dir:'up',pct:1})+
  '</div>';

  const tbl=card('Data quality register','Every finding carries its measurement and its consequence. Sorted worst first.',
    rows.length?'<table><thead><tr><th>Partner</th><th>Finding</th><th class="num">Measure</th><th>Detail</th></tr></thead><tbody>'+
    rows.map(r=>'<tr data-drill="dq:'+r[1]+'"><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td>'+

      '<td style="white-space:normal">'+r[3]+'</td></tr>').join('')+'</tbody></table>':emptyBox('No finding for this partner','Nothing logged against '+S.f.partner+'.'),
    src('sheet','Social Security Pillar pack · sheets 3, 4 and 7'),dlDQ);

  const geoRows=[['Maharashtra',0.969],['Telangana',0.852],['Karnataka',0.041],['Tamil Nadu',0.028],['Delhi NCR',0.012]];
  const geo=card('Placeholder Household Number by state',
    'It is a state convention, not individual error — which means it is fixable with a form rule, not retraining.',
    legend([{k:'Placeholder rate',c:C[1]}])+
    geoRows.map(r=>hbar(r[0],r[1],1,r[1]>0.5?'var(--bad)':'var(--c3)',PCT1(r[1]),'dqgeo:'+r[0])).join(''),
    src('sheet','Social Security Pillar pack · sheet 3'),
    reg('Placeholder rate by state',['State','Placeholder rate'],geoRows.map(r=>[r[0],PCT1(r[1])])));

  const gp=card('Good practices — what is already working',
    'The transferable lessons. Each one is a named partner behaviour another partner can copy.',
    good.length?'<table><thead><tr><th>Partner</th><th>Highlight</th><th>Why it matters</th></tr></thead><tbody>'+

      '<td style="white-space:normal;color:var(--gray-500)">'+r[2]+'</td></tr>').join('')+'</tbody></table>':emptyBox('None logged for this partner','Good practices are recorded per partner in sheet 5.'),
    src('sheet','Social Security Pillar pack · sheet 5 "Good Practices"'),
    reg('Good practices',['Partner','Highlight','Why it matters'],good.map(r=>[r[0],r[1],r[2]])));

  return k+tbl+'<div class="grid2">'+geo+gp+'</div>';
}

const drawer=document.getElementById('drawer'), scrim=document.getElementById('scrim');
function openDrawer(eyebrow,title,sub,body,dlId,ico){
  document.getElementById('drawerHd').innerHTML=
    '<div class="dic">'+(ico||ICO.grid)+'</div>'+
    '<div><div class="eyebrow">'+eyebrow+'</div><h3>'+title+'</h3><div class="sub">'+sub+'</div></div>'+
    '<div class="sp"></div>'+dlTool(dlId)+'<button class="drawer-x" id="dx">&#10005;</button>';
  document.getElementById('drawerBd').innerHTML=body;
  drawer.classList.add('on'); scrim.classList.add('on');
  document.getElementById('dx').onclick=closeDrawer;
}
function closeDrawer(){ drawer.classList.remove('on'); scrim.classList.remove('on'); closeDlMenu(); }
scrim.onclick=closeDrawer;
function panel(title,body,flush){ return '<div class="dpanel"><div class="dpanel-hd">'+title+'</div><div class="dpanel-bd'+(flush?' flush':'')+'">'+body+'</div></div>'; }
function stats(items){ return '<div class="statgrid">'+items.map(i=>'<div><span>'+i[0]+'</span><b>'+i[1]+'</b></div>').join('')+'</div>'; }

/* rows behind a KPI or a chart element, plus its own download */
function rowsDrawer(eyebrow,title,rows,extra,ico){
  const t=totT(rows), i=totI(rows), g=totG(rows);
  const dl=reg(title,REC_COLS,recRows(rows));
  const byPart=group(rows,r=>r.pt).sort((a,b)=>b.v-a.v);
  const body=(extra||'')+
    panel('Summary',stats([
      ['Records',F(rows.length)],['Lives touched',F(t)],['Lives impacted',F(i)],
      ['Goal',g?F(g):'—'],['% of goal',g?PCT(t/g):'—'],
      ['Partners',String(distinct(rows,r=>r.pt).size)],['BU-Sites',String(distinct(rows,r=>r.site).size)],
      ['Approved',F(rows.filter(r=>r.appr).length)]
    ]))+
    (byPart.length?panel('By partner','<table><thead><tr><th>Partner</th><th class="num">Touched</th><th class="num">Impacted</th><th class="num">Goal</th><th class="num">Records</th></tr></thead><tbody>'+
      byPart.map(o=>'<tr><td>'+o.k+'</td><td class="num">'+F(o.t)+'</td><td class="num">'+F(o.i)+'</td><td class="num">'+F(o.g)+'</td><td class="num">'+o.n+'</td></tr>').join('')+
      '</tbody></table>',true):'')+
    panel('Records',recTable(rows),true);
  openDrawer(eyebrow,title,periodLabel(S.f)+' · '+(S.f.partner==='All'?'all partners':S.f.partner)+' · '+(S.f.zone==='All'?'all zones':S.f.zone),body,dl,ico);
}
function kpiDrawer(key){
  const rows=slice();
  const k=key.split('|')[0], arg=key.split('|')[1];
  if(k==='th-v'||k==='th-g'||k==='th-p'||k==='th-s') return rowsDrawer('THEME',arg,rows.filter(r=>r.pil===arg),null,ICO.grid);
  if(k==='touched') return rowsDrawer('PORTFOLIO','Lives touched',rows.filter(r=>r.t>0),null,ICO.users);
  if(k==='impacted') return rowsDrawer('PORTFOLIO','Lives impacted',rows.filter(r=>r.i>0),null,ICO.check);
  if(k==='sites'){
    const g=group(rows.filter(r=>r.t>0),r=>r.site);
    const dl=reg('Sites '+periodLabel(S.f),['BU-Site','Zone','Province','Locality','Lives touched','Records','Partners'],
      g.map(o=>[o.k,o.rows[0].z,o.rows[0].prov,o.rows[0].loc,o.t,o.n,distinct(o.rows,r=>r.pt).size]));
    return openDrawer('GEOGRAPHY','BU-Sites reporting',g.length+' of '+SITE_MASTER+' sites · '+periodLabel(S.f),
      panel('Sites','<div class="dscroll"><table><thead><tr><th>BU-Site</th><th>Zone</th><th>Province</th><th>Locality</th><th class="num">Touched</th><th class="num">Records</th></tr></thead><tbody>'+
      g.sort((a,b)=>b.t-a.t).map(o=>'<tr><td><b>'+o.k+'</b></td><td>'+o.rows[0].z+'</td><td>'+o.rows[0].prov+'</td><td>'+o.rows[0].loc+'</td>'+
        '<td class="num">'+F(o.t)+'</td><td class="num">'+o.n+'</td></tr>').join('')+'</tbody></table></div>',true)+
      '<div class="note">'+(SITE_MASTER-g.length)+' sites in the master filed nothing in this slice. A site with no return and a site reporting zero are different states and are never drawn the same way.</div>',
      dl,ICO.pin);
  }
  if(k==='report'||k==='ontrack'){
    const g=group(rows,r=>r.ind).sort((a,b)=>a.k<b.k?-1:1);
    const dl=reg('Indicators '+periodLabel(S.f),['Indicator','Name','Pillar','Status','Actual','Goal','% of goal','Partners'],
      g.map(o=>[o.k,IND_BY[o.k].n,o.rows[0].pil,ST_TXT[IND_BY[o.k].st],o.v,o.g,o.g?PCT1(o.v/o.g):'',distinct(o.rows,r=>r.pt).size]));
    return openDrawer('FRAMEWORK',k==='report'?'Indicators with a submission':'Indicators against goal',
      g.length+' indicators in this slice · '+periodLabel(S.f),
      panel('Indicators','<div class="dscroll"><table><thead><tr><th>#</th><th>Indicator</th><th class="num">Actual</th><th class="num">Goal</th><th>Status</th></tr></thead><tbody>'+
      g.map(o=>'<tr data-drill="ind:'+o.k+'"><td><b>'+o.k+'</b></td><td>'+IND_BY[o.k].n+'</td><td class="num">'+F(o.v)+'</td>'+
        '<td class="num">'+F(o.g)+'</td><td>'+(o.g?ragPill(o.v/o.g):ST_TAG[IND_BY[o.k].st])+'</td></tr>').join('')+
      '</tbody></table></div>',true),dl,ICO.doc);
  }
  /* pack KPIs have no fact rows behind them */
  return openDrawer('PILLAR PACK','Figure from the Social Security pack',
    'Apr–Jun 2026 · '+(S.f.partner==='All'?'all partners':S.f.partner),
    '<div class="note">This figure comes from the hand-built pillar pack, not from a platform table. In the built dashboard it resolves to the partner\'s own submission rows once the pack is replaced by a Script Report reading mGrant directly.</div>',
    null,ICO.doc);
}
function drillDrawer(kind,val){
  const rows=slice();
  if(kind==='ind'){
    const ind=IND_BY[val]; if(!ind) return;
    const r=rows.filter(x=>x.ind===val);
    const v=totV(r), g=totG(r);
    const bu=group(r,x=>x.bu);
    const extra=panel('Definition','<table><tbody>'+
      '<tr><td><b>Indicator</b></td><td>'+val+' — '+ind.n+'</td></tr>'+
      '<tr><td><b>Pillar · charter</b></td><td>'+ind.pil+' · '+CHARTERS[THEMES.find(t=>t.k===ind.pil).ch]+'</td></tr>'+
      '<tr><td><b>Source form</b></td><td>'+ind.form+'</td></tr>'+
      '<tr><td><b>Measure</b></td><td>'+(ind.meas==='impacted'?'Lives impacted':'Lives touched')+'</td></tr>'+
      '<tr><td><b>Mapping status</b></td><td>'+ST_TAG[ind.st]+'</td></tr>'+
      '<tr><td><b>Actual vs goal</b></td><td>'+F(v)+' of '+F(g)+' · '+(g?ragPill(v/g):'no goal')+'</td></tr>'+
      '</tbody></table>')+
      panel('Business Unit split',bu.map((o,ix)=>hbar(o.k,o.v,Math.max(1,...bu.map(x=>x.v)),C[ix%5],F(o.v))).join(''));
    return rowsDrawer('INDICATOR',val+' · '+ind.n,r,extra,ICO.target);
  }
  if(kind==='pillar') return rowsDrawer('PILLAR',val,rows.filter(r=>r.pil===val),null,ICO.grid);
  if(kind==='bu')     return rowsDrawer('BUSINESS UNIT',val,rows.filter(r=>r.bu===val),null,ICO.grid);
  if(kind==='partner')return rowsDrawer('PARTNER',val,rows.filter(r=>r.pt===val),null,ICO.users);
  if(kind==='site')   return rowsDrawer('BU-SITE',val,rows.filter(r=>r.site===val),null,ICO.pin);
  if(kind==='heat'){
    const p=val.split('|');
    return rowsDrawer('ZONE × PILLAR',p[0]+' · '+p[1],rows.filter(r=>r.z===p[0]&&r.pil===p[1]),null,ICO.grid);
  }
  if(kind==='surv'){
    const r=SURV.find(x=>x[2]===val)||[];
    return openDrawer('SURVEYOR',val,r[0]+' · '+r[1]+' · Apr–Jun 2026',
      panel('Reporting integrity',stats([['People reached',F(r[3])],['Activities',String(r[4])],
        ['At exactly 100',r[5]+' of '+r[4]],['% exactly 100',PCT1(r[6])],['Reach from those',F(r[7])],['Flag',r[8]]]))+
      '<div class="note warn">A RED flag is not an accusation — it says the form let a ceiling value stand in for a count. The fix is a form validation, not a performance conversation.</div>',
      reg('Surveyor '+val,['Partner','Role','Officer','People reached','Activities','Times exactly 100','% exactly 100','Reach from those','Flag'],
        [[r[0],r[1],r[2],r[3],r[4],r[5],PCT1(r[6]),r[7],r[8]]]),ICO.users);
  }
  if(kind==='mou'){
    const r=MOU.find(x=>x[2]===val)||[];
    return openDrawer('OFFICER · MoU',val,r[0]+' · '+r[1]+' · June 2026',
      panel('Against MoU target','<table><thead><tr><th>Deliverable</th><th class="num">Actual</th><th class="num">Target</th><th>Pace</th></tr></thead><tbody>'+
      MOU_COLS.map((c,i)=>'<tr><td>'+c+'</td><td class="num">'+F(r[3][i][0])+'</td><td class="num">'+F(r[3][i][1])+'</td>'+
        '<td>'+ragPill(r[3][i][1]?r[3][i][0]/r[3][i][1]:null)+'</td></tr>').join('')+
      '<tr class="totalrow"><td>Total</td><td class="num">'+F(r[4])+'</td><td class="num">'+F(r[5])+'</td><td>'+ragPill(r[4]/r[5])+'</td></tr>'+
      '</tbody></table>',true),
      reg('MoU '+val,['Deliverable','Actual','Target','Pace %'],
        MOU_COLS.map((c,i)=>[c,r[3][i][0],r[3][i][1],r[3][i][1]?PCT1(r[3][i][0]/r[3][i][1]):''])),ICO.doc);
  }
  const titles={kpi:'Metric',recon:'Reconciliation',ytd:'Partner pace',dbt:'DBT split',dq:'Data quality finding',
    dqgeo:'Placeholder rate',gp:'Good practice',narr:'Narrative vs platform',flag:'Integrity flag'};
  openDrawer('DETAIL',(titles[kind]||'Detail')+' — '+val.replace('|',' · '),periodLabel(S.f),
    '<div class="note">This figure comes from the Social Security pillar pack. In the built dashboard the panel loads the rows behind it, scoped to what the signed-in user\'s own record permissions allow.</div>',null,ICO.doc);
}

   INTERACTION
   ============================================================ */
document.addEventListener('click',function(e){
  const dlb=e.target.closest('[data-dl]');
  if(dlb){ e.preventDefault(); e.stopPropagation();
    if(dlmenu.classList.contains('on')&&dlmenu.dataset.for===dlb.dataset.dl){ closeDlMenu(); }
    else { dlmenu.dataset.for=dlb.dataset.dl; openDlMenu(dlb,dlb.dataset.dl); }
    return; }
  const mi=e.target.closest('#dlmenu button');
  if(mi){ doDownload(mi.dataset.id,mi.dataset.fmt); closeDlMenu(); return; }
  closeDlMenu();

  const nav=e.target.closest('.nav-item[data-page]');
  if(nav){ setPage(nav.dataset.page); return; }
  const tab=e.target.closest('.tab');
  if(tab){ setTab(+tab.dataset.i); return; }
  const th=e.target.closest('[data-theme]');
  if(th){ S.theme = th.dataset.theme==='__back'?null:th.dataset.theme; render(); return; }
  const pb=e.target.closest('[data-pillar]');
  if(pb){ S.pillar=pb.dataset.pillar; S.tab=0; render(); return; }
  const seg=e.target.closest('.segmented[data-seg]:not([data-seg="pillar"]) button');
  if(seg){
    seg.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on'));
    seg.classList.add('on');
    S.f[seg.parentNode.dataset.seg]=+seg.dataset.v;
    render(); return;
  }
  const d=e.target.closest('[data-drill]');
  if(!d) return;
  e.preventDefault();
  const ix=d.dataset.drill.indexOf(':');
  const kind=d.dataset.drill.slice(0,ix), val=d.dataset.drill.slice(ix+1);
  if(kind==='zone'){ if(val==='__up'){S.geo={zone:null,province:null,locality:null};} else {S.geo={zone:val,province:null,locality:null};} render(); return; }
  if(kind==='prov'){ if(val==='__up'){S.geo.province=null;S.geo.locality=null;} else {S.geo.province=val;S.geo.locality=null;} render(); return; }
  if(kind==='loc'){ if(val==='__up'){S.geo.locality=null;} else {S.geo.locality=val;} render(); return; }
  if(kind==='kpi'){ kpiDrawer(val); return; }
  drillDrawer(kind,val);
});

function syncReset(){
  let n=0;
  const active=PAGES[S.page].filters;
  document.querySelectorAll('.fpill').forEach(function(p){
    const key=p.dataset.f, s=p.querySelector('select');
    const isDefault=(S.f[key]===DEF[key]);
    p.classList.toggle('on', key==='fy'||key==='period'||!isDefault);
    if(!isDefault && active.indexOf(key)>=0) n++;
  });
  if(S.f.approval) n++;
  if(S.f.metric) n++;
  if(S.f.q) n++;
  if(S.geo.zone) n++;
  const r=document.getElementById('fReset');
  r.style.display=n?'inline-flex':'none';
  r.querySelector('.badge').textContent=n;
}
document.getElementById('fReset').addEventListener('click',function(){
  S.f=Object.assign({},DEF);
  S.geo={zone:null,province:null,locality:null};
  Object.keys(FMAP).forEach(id=>document.getElementById(id).value=DEF[FMAP[id]]);
  document.getElementById('fSearch').value='';
  document.querySelectorAll('.segmented[data-seg]:not([data-seg="pillar"])').forEach(function(sg){
    sg.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===0));
  });
  render();
});

/* ---- refresh + as-at chrome (mirrors the Vedanta header contract) ---- */
let refreshedAt=Date.now()-2*60000;
document.getElementById('gdAsAt').textContent='as at '+new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
function syncRefreshed(){
  const m=Math.max(0,Math.round((Date.now()-refreshedAt)/60000));
  document.getElementById('gdRefreshedAt').textContent = m<1?'Refreshed just now':m===1?'Refreshed 1 min ago':'Refreshed '+m+' min ago';
}
setInterval(syncRefreshed,60000); syncRefreshed();
document.getElementById('gdRefresh').addEventListener('click',function(){
  this.classList.add('spin');
  const self=this;
  setTimeout(function(){ self.classList.remove('spin'); refreshedAt=Date.now(); syncRefreshed(); },700);
});

/* ---- boot ---- */
(function(){
  const h=location.hash.match(/#\/(\w+)\/(\d+)(?:\/(.+))?/);
  if(h&&PAGES[h[1]]){ S.page=h[1]; S.tab=+h[2]; if(h[3]) S.theme=decodeURIComponent(h[3]); }
  ensurePackPeriod();
  render();
})();
</script>
