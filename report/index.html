  if(g.zone) crumb+=' &rsaquo; <b>'+g.zone+'</b>';
  if(g.province) crumb+=' &rsaquo; <b>'+g.province+'</b>';
  if(g.locality) crumb+=' &rsaquo; <b>'+g.locality+'</b>';
  crumb+='</div>';
  const fin=S.map.fin;
  function tbl(head,items,drillKind,back){
    const max=Math.max(1,...items.map(o=>o.v));
    return crumb+'<div style="font-size:11.5px;color:var(--gray-500);margin-bottom:8px">'+head+
      (back?' <a href="#" data-drill="'+back+'">&uarr; back</a>':'')+'</div>'+
      '<div style="overflow-x:auto"><table><thead><tr><th>'+drillKind[1]+'</th><th class="num">Sites</th><th class="num">'+metricWord()+'</th>'+
      (fin?'<th class="num">Allocated</th><th class="num">Utilised</th><th class="num">Util.</th>':'<th>Share</th>')+
      '</tr></thead><tbody>'+
      items.map((o,ix)=>'<tr data-drill="'+drillKind[0]+':'+o.k+'"><td><span class="flag"><i style="background:'+(C[ix%5])+'"></i>'+o.k+'</span></td>'+
        '<td class="num">'+o.s+'</td><td class="num">'+F(o.v)+'</td>'+
        (fin?'<td class="num">'+CR(o.bg)+'</td><td class="num">'+CR(o.sp)+'</td><td class="num">'+(o.bg?PCT(o.sp/o.bg):'—')+'</td>'
            :'<td><div style="height:10px;background:var(--gray-100);border-radius:3px;width:90px"><i style="display:block;height:100%;border-radius:3px;width:'+((o.v/max)*100)+'%;background:'+(C[ix%5])+'"></i></div></td>')+
        '</tr>').join('')+
      '</tbody></table></div>';
  }
  const mk=(key)=>group(rows,key).map(o=>({k:o.k,v:o.v,s:distinct(o.rows.filter(r=>r.t>0),r=>r.site).size,
    sp:sum(o.rows,r=>r.sp),bg:sum(o.rows,r=>r.bg)})).sort((a,b)=>b.v-a.v);
  if(!g.zone)      return tbl('Select a zone on the map, or a row below.',mk(r=>r.z),['mzone','Zone'],null);
  if(!g.province)  return tbl('States in the '+g.zone+' zone.',mk(r=>r.prov),['mprov','State'],'mzone:__all');
  if(!g.locality)  return tbl('Districts in '+g.province+'.',mk(r=>r.loc),['mloc','District'],'mzone:'+g.zone);
  /* a picked district: the map stays on the state; its BU-Sites are listed here */
  const loc=rows.filter(r=>r.loc===g.locality);
  const sites=group(loc,r=>r.site).map(o=>({k:o.k,v:o.v,bu:o.rows[0].bu,n:o.n,
    pt:distinct(o.rows,r=>r.pt).size,sp:sum(o.rows,r=>r.sp),bg:sum(o.rows,r=>r.bg)})).sort((a,b)=>b.v-a.v);
  const max=Math.max(1,...sites.map(o=>o.v));
  return crumb+'<div style="font-size:11.5px;color:var(--gray-500);margin-bottom:8px">BU-Sites in '+g.locality+' · '+F(totV(loc))+' '+metricWord().toLowerCase()+
    ' · '+distinct(loc,r=>r.pt).size+' partner'+(distinct(loc,r=>r.pt).size===1?'':'s')+'. <a href="#" data-drill="mprov:'+g.province+'">&uarr; all districts</a></div>'+
    '<div style="overflow-x:auto"><table><thead><tr><th>BU-Site</th><th>BU</th><th class="num">Partners</th><th class="num">Records</th><th class="num">'+metricWord()+'</th>'+
    (fin?'<th class="num">Allocated</th><th class="num">Utilised</th>':'<th>Share</th>')+'</tr></thead><tbody>'+
    sites.map((o,ix)=>'<tr data-drill="site:'+o.k+'"><td><span class="flag"><i style="background:'+C[ix%5]+'"></i>'+o.k+'</span></td><td>'+o.bu+'</td>'+
      '<td class="num">'+o.pt+'</td><td class="num">'+F(o.n)+'</td><td class="num"><b>'+F(o.v)+'</b></td>'+
      (fin?'<td class="num">'+CR(o.bg)+'</td><td class="num">'+CR(o.sp)+'</td>'
          :'<td><div style="height:10px;background:var(--gray-100);border-radius:3px;width:90px"><i style="display:block;height:100%;border-radius:3px;width:'+((o.v/max)*100)+'%;background:'+C[ix%5]+'"></i></div></td>')+
      '</tr>').join('')+'</tbody></table></div>'+
    '<div class="caption" style="margin-top:8px">Click a BU-Site for its submissions. Click the district again on the map to clear the pick.</div>';
}
/* ---------- TAB 2 · THEME OVERVIEW (was Indicator Scorecard) ---------- */
function themeStats(rows,th){
  const r=rows.filter(x=>x.pil===th.k);
  const ids=distinct(r,x=>x.ind);
  const reporting=distinct(r.filter(x=>x.t>0),x=>x.ind);
  const v=totV(r), g=totG(r);
  return {th:th,rows:r,n:ids.size,rep:reporting.size,v:v,g:g,pct:g?v/g:null,
          bus:distinct(r.filter(x=>x.t>0),x=>x.bu).size,
          sites:distinct(r.filter(x=>x.t>0),x=>x.site).size,
          parts:distinct(r.filter(x=>x.t>0),x=>x.pt).size};
}
function themeOverview(){
  const rows=slice();
  const stats=THEMES.map(th=>themeStats(rows,th)).filter(s=>s.n>0);
  const grand=totV(rows)||1;
  if(!stats.length) return emptyBox('No theme has data in this slice','Clear a filter — the framework has 22 indicators across 6 themes.');

  const tiles=stats.map(s=>{
    const th=s.th;
    return '<div class="tile" style="border-top-color:'+th.c+'" data-theme="'+th.k+'">'+
      '<div class="tile-hd"><div class="tile-ic" style="background:color-mix(in srgb,'+th.c+' 14%,#fff);color:'+th.c+'">'+th.ic+'</div>'+
        '<b>'+th.k+'</b><span class="tile-chip">'+s.n+' indicator'+(s.n>1?'s':'')+'</span></div>'+
      '<div class="tile-row big"><span>'+metricWord()+'</span><b>'+F(s.v)+'</b></div>'+
      '<div class="tile-row"><span>% of IN Ops total</span><b>'+PCT1(s.v/grand)+'</b></div>'+
      '<div class="tile-row"><span>Goal for this period</span><b>'+(s.g?F(s.g):'—')+'</b></div>'+
      '<div class="tile-prog"><div class="lbl"><span>Achievement</span><span>'+(s.pct==null?'no goal':PCT(s.pct))+'</span></div>'+
        '<div class="tr"><i style="width:'+Math.min(100,(s.pct||0)*100)+'%;background:'+ragBarColor(s.pct)+'"></i></div></div>'+
      '<div class="tile-row"><span>BU coverage</span><b>'+s.bus+' of '+BU_LIST.length+'</b></div>'+
      '<div class="tile-row"><span>Partners reporting</span><b>'+s.parts+'</b></div>'+
      '<div class="tile-ft"><i class="dot" style="background:'+ragDot(s.pct)+'"></i>'+
        s.rep+' of '+s.n+' indicators reporting<span class="go">View details &rarr;</span></div>'+
    '</div>';
  }).join('');

  const dl=reg('Theme overview '+periodLabel(S.f),
    ['Theme','Indicators','Indicators reporting','Lives touched','Lives impacted','Goal','% of goal','BU coverage','Partners','Sites'],
    stats.map(s=>[s.th.k,s.n,s.rep,totT(s.rows),totI(s.rows),s.g,s.g?PCT1(s.v/s.g):'',s.bus,s.parts,s.sites]));

  const totV_=totV(rows), totG_=totG(rows);
  const head=card('Theme-level reach, goal and coverage',
    stats.length+' themes · click any tile to open its indicators. Sorted by the framework order — never by value, because the framework order is what leadership reads.',
    '<div class="tile-grid">'+tiles+'</div>',
    src('live',SRC_SYS+'. '+SRC_GOAL),dl);

  const roll='<div class="note"><b>Rolled up: '+F(totV_)+' against a goal of '+F(totG_)+' ('+PCT(totG_?totV_/totG_:0)+').</b> '+
    'Charter totals here are computed from the indicator rows. On the full framework that gives a monthly goal of 354,039, where the MBR\'s own Page-0 total row reads 348,307 — a 5,732 difference between the total row and the rows above it, unreconciled in the source sheet and not introduced here.</div>';

  return head;
}

function themeDetail(key){
  const th=THEMES.find(t=>t.k===key)||THEMES[0];
  const rows=slice().filter(r=>r.pil===key);
  const s=themeStats(slice(),th);
  const nav='<div class="crumbnav"><button class="backbtn" data-theme="__back">&larr; All themes</button>'+
    '<div class="crumb" style="margin:0">Theme Overview &rsaquo; <b>'+key+'</b> · '+periodLabel(S.f)+'</div></div>';

  if(!rows.length) return nav+emptyBox('No rows for '+key+' in this slice','This theme has no submission matching the current filters.');

  const recId=reg('Theme '+key+' records',REC_COLS,recRows(rows));
  const k=rowHead(key,s.rep+' of '+s.n+' indicators reporting · '+s.parts+' partners · '+s.sites+' BU-Sites',recId)+
    '<div class="kpi-row">'+
    kpi({key:'th-v|'+key,ico:ICO.users,val:F(s.v),label:metricWord()+' — '+key,delta:PCT(s.pct)+' of goal',dir:s.pct>=1?'up':'down',pct:s.pct})+
    kpi({key:'th-g|'+key,ico:ICO.target,val:F(s.g),label:'Goal for '+periodLabel(S.f),delta:s.g?F(Math.max(0,s.g-s.v))+' to go':'no goal set',dir:'flat'})+
    kpi({key:'th-p|'+key,ico:ICO.doc,val:String(s.parts),label:'Partners delivering this theme',delta:s.rep+' of '+s.n+' indicators live',dir:'flat'})+
    kpi({key:'th-s|'+key,ico:ICO.pin,val:String(s.sites),unit:'/ '+SITE_MASTER,label:'BU-Sites reached by this theme',delta:PCT(s.sites/SITE_MASTER)+' of the site master',dir:'flat',pct:s.sites/SITE_MASTER})+
  '</div>';

  const ids=[...distinct(rows,r=>r.ind)].sort();
  const cards=ids.map(id=>{
    const ind=IND_BY[id], r=rows.filter(x=>x.ind===id);
    const v=totV(r), g=totG(r), p=g?v/g:null;
    const bu=group(r,x=>x.bu).sort((a,b)=>b.v-a.v).slice(0,5);
    const parts=[...distinct(r.filter(x=>x.t>0),x=>x.pt)];
    /* an indicator with no source form is not "0% of goal" — it is unsourced */
    const noSrc=ind.st==='unmapped'||ind.st==='outside'||ind.st==='closed';
    return '<div class="icard" data-drill="ind:'+id+'">'+
      '<div class="icard-hd"><span class="icard-id">'+id+'</span>'+((g&&!(noSrc&&!v))?ragPill(p):ST_TAG[ind.st])+'</div>'+
      '<div class="icard-n">'+ind.n+'</div>'+
      '<div class="icard-big"><b style="color:'+(v?'var(--gray-900)':'var(--gray-400)')+'">'+F(v)+'</b>'+
        '<span>of '+(g?F(g):'no goal')+'</span></div>'+
      '<div class="tile-prog" style="margin-top:8px"><div class="tr"><i style="width:'+Math.min(100,(p||0)*100)+'%;background:'+ragBarColor(p)+'"></i></div></div>'+
      '<div class="icard-mini">'+bu.map(b=>'<div><span>'+b.k+'</span><b>'+F(b.v)+'</b></div>').join('')+'</div>'+
      '<div class="icard-ft">'+(parts.length?parts.slice(0,2).join(', ')+(parts.length>2?' +'+(parts.length-2):''):ind.form)+
        '<span class="go">View records &rarr;</span></div>'+
    '</div>';
  }).join('');

  const grid=card('Indicators in '+key,
    'One card per indicator. The bar is achievement against the goal for the selected period; the strip below it is the Business Unit split. Click a card for the rows behind it.',
    '<div class="icard-grid">'+cards+'</div>',
    src('live',SRC_SYS),
    reg('Indicators '+key,['Indicator','Name','Form','Status','Actual','Goal','% of goal','Partners'],
      ids.map(id=>{const ind=IND_BY[id],r=rows.filter(x=>x.ind===id),v=totV(r),g=totG(r);
        return [id,ind.n,ind.form,ST_TXT[ind.st],v,g,g?PCT1(v/g):'',[...distinct(r,x=>x.pt)].join('; ')];})));

  const buRows=group(rows,r=>r.bu);
  const maxBU=Math.max(1,...buRows.map(o=>o.v));
  const split=card('Business Unit split — '+key,
    'Unassigned = submissions whose site code is not in the BU dictionary.',
    buRows.sort((a,b)=>b.v-a.v).map((o,ix)=>hbar(o.k,o.v,maxBU,C[ix%5],F(o.v),'bu:'+o.k)).join(''),
    src('live',SRC_SYS),
    reg('BU split '+key,['Business Unit','Lives touched','Lives impacted','Goal','Records'],buRows.map(o=>[o.k,o.t,o.i,o.g,o.n])));

  const pRows=group(rows,r=>r.pt).sort((a,b)=>b.v-a.v);
  const maxP=Math.max(1,...pRows.map(o=>o.v));
  const byPart=card('Partner delivery — '+key,
    'Who actually filed against this theme in the selected period.',
    pRows.map((o,ix)=>hbar(o.k,o.v,maxP,o.v?C[ix%5]:'var(--gray-200)',o.v?F(o.v):'no return','partner:'+o.k)).join(''),
    src('live',SRC_SYS+'. '+SRC_GOAL),
    reg('Partner delivery '+key,['Partner','Lives touched','Lives impacted','Goal','Records'],pRows.map(o=>[o.k,o.t,o.i,o.g,o.n])));

  return nav+k+grid+'<div class="grid2">'+split+byPart+'</div>';
}

/* ---------- TAB 3 · BUSINESS UNITS ---------- */
function leadBU(){
  const rows=slice();
  if(!rows.length) return emptyBox('Nothing reported in this slice','No Business Unit rows match '+periodLabel(S.f)+'.');
  const buRows=BU_LIST.map(b=>{const o=group(rows.filter(r=>r.bu===b),()=>b)[0]; return o||{k:b,t:0,i:0,v:0,g:0,n:0,rows:[]};});
  const max=Math.max(1,...buRows.map(o=>Math.max(o.v,o.g)));
  const contrib=card('Business Unit contribution — '+periodLabel(S.f),
    'IN Ops = INFC + ATS + UFF + AMZL, plus the sites whose code prefix is not yet in the BU dictionary. Click a bar for that BU.',
    legend([{k:metricWord(),c:'var(--c1)'},{k:'Goal',c:'var(--gray-300)'}])+
    buRows.map((o,ix)=>hbar(o.k,o.v,max,o.k==='Unassigned'?'var(--gray-400)':C[ix%5],F(o.v)+(o.g?'  '+PCT(o.v/o.g):''),'bu:'+o.k,o.g?o.g/max:null)).join(''),
    src('live',SRC_SYS),
    reg('Business Units '+periodLabel(S.f),['Business Unit','Lives touched','Lives impacted','Goal','% of goal','Records','Sites'],
      buRows.map(o=>[o.k,o.t,o.i,o.g,o.g?PCT1(o.v/o.g):'',o.n,distinct(o.rows,r=>r.site).size])));

  const pils=THEMES.map(t=>t.k).filter(k=>rows.some(r=>r.pil===k));
  const series=BU_LIST.filter(b=>rows.some(r=>r.bu===b)).map((b,ix)=>({
    name:b,color:b==='Unassigned'?'var(--gray-400)':C[ix%5],
    data:pils.map(p=>totV(rows.filter(r=>r.bu===b&&r.pil===p)))
  }));
  const grouped=card('Pillar &times; Business Unit',
    'Grouped columns, one group per pillar. Hover a column for the exact figure.',
    legend(series.map(s=>({k:s.name,c:s.color})))+groupedBars(pils.map(p=>p.split(' ')[0]),series,{h:220,w:560}),
    src('live',SRC_SYS),
    reg('Pillar by BU '+periodLabel(S.f),['Pillar'].concat(series.map(s=>s.name)),
      pils.map((p,pi)=>[p].concat(series.map(s=>s.data[pi])))));

  const zones=ZN.filter(z=>rows.some(r=>r.z===z));
  const heatCols=pils.slice(0,5);
  const heatCard=card('Zone &times; pillar — % of goal',
    'Sequential ramp, one hue light→dark. A dash means no goal is set for that combination. Cell click opens the rows behind it.',
    '<div style="overflow-x:auto"><table class="heat"><thead><tr><th>Zone</th>'+heatCols.map(h=>'<th class="num">'+h+'</th>').join('')+'</tr></thead><tbody>'+
    zones.map(z=>'<tr><td><b>'+z+'</b></td>'+heatCols.map(p=>{
      const r=rows.filter(x=>x.z===z&&x.pil===p);
      const v=totV(r), g=totG(r);
      if(!g) return '<td class="hc muted">–</td>';
      const pctv=Math.round((v/g)*100);
      const step=SEQ[Math.min(6,Math.floor(pctv/22))];
      const ink = pctv>=88?'#fff':'var(--gray-800)';
      return '<td class="hc" style="background:'+step+';color:'+ink+'" data-drill="heat:'+z+'|'+p+'">'+pctv+'%</td>';
    }).join('')+'</tr>').join('')+'</tbody></table></div>',
    src('live',SRC_SYS),
    reg('Zone by pillar '+periodLabel(S.f),['Zone'].concat(heatCols),
      zones.map(z=>[z].concat(heatCols.map(p=>{const r=rows.filter(x=>x.z===z&&x.pil===p);const g=totG(r);return g?PCT1(totV(r)/g):'';})))));

  /* ---- goal vs achievement against MoU ---- */
  const moTot={}; MOU.forEach(r=>{ moTot[r[0]]=(moTot[r[0]]||0)+r[5]; });
  const moRows=BU_LIST.map(b=>{
    const r=rows.filter(x=>x.bu===b);
    let mou=0, covered=0, all=0;
    group(r,x=>x.pt).forEach(o=>{
      all+=o.v;
      if(moTot[o.k]!=null){ const share=o.v/Math.max(1,totV(rows.filter(x=>x.pt===o.k)));
        mou+=moTot[o.k]*share*monSelCount(); covered+=o.v; }
    });
    return {bu:b,v:totV(r),g:totG(r),mou:Math.round(mou),cov:all?covered/all:0};
  }).filter(o=>o.v||o.g);
  const maxM=Math.max(1,...moRows.map(o=>Math.max(o.v,o.g,o.mou)));
  const mouCard=card('Goal vs achievement — against Page 0 and against MoU',
    'Two different commitments sit behind the same number. Page 0 is the goal Amazon publishes; the MoU is what the partner actually signed. Where they disagree, the MoU is the contract.',
    legend([{k:metricWord(),c:'var(--c1)'},{k:'Page 0 goal',c:'var(--gray-300)'},{k:'MoU commitment',c:C[1]}])+
    moRows.map(o=>hbar(o.bu,o.v,maxM,ragBarColor(o.g?o.v/o.g:null),
      F(o.v)+'  '+(o.g?PCT(o.v/o.g):'—')+' / '+(o.mou?PCT(o.v/o.mou):'no MoU'),'bu:'+o.bu,o.g?o.g/maxM:null)).join('')+
    '<table style="margin-top:12px"><thead><tr><th>Business Unit</th><th class="num">Actual</th><th class="num">Page 0 goal</th><th class="num">vs Page 0</th><th class="num">MoU commitment</th><th class="num">vs MoU</th><th class="num">MoU coverage</th></tr></thead><tbody>'+
    moRows.map(o=>'<tr data-drill="bu:'+o.bu+'"><td><b>'+o.bu+'</b></td><td class="num">'+F(o.v)+'</td>'+
      '<td class="num">'+F(o.g)+'</td><td class="num">'+(o.g?ragPill(o.v/o.g):'<span class="pill p-none">—</span>')+'</td>'+
      '<td class="num">'+(o.mou?F(o.mou):'<span class="muted">not on file</span>')+'</td>'+
      '<td class="num">'+(o.mou?ragPill(o.v/o.mou):'<span class="pill p-none">—</span>')+'</td>'+
      '<td class="num">'+PCT(o.cov)+'</td></tr>').join('')+'</tbody></table>',
    src('live',SRC_SYS+'. '+SRC_GOAL),
    reg('BU goal vs MoU',['Business Unit','Actual','Page 0 goal','% of Page 0','MoU commitment','% of MoU','Share of reach covered by an MoU'],
      moRows.map(o=>[o.bu,o.v,o.g,o.g?PCT1(o.v/o.g):'',o.mou||'',o.mou?PCT1(o.v/o.mou):'',PCT1(o.cov)])),
    'MoU commitment apportions each partner\'s signed monthly target to the BU in proportion to that partner\'s reach in the BU, times the months in the selected period. "MoU coverage" is the share of the BU\'s reach delivered by a partner that has an MoU on file — where it is low, the MoU column is not a fair test.')+
    '<div class="note warn"><b>Only the GM/PM partners have a machine-readable MoU target.</b> SNEHA and ACCESS MoUs are annual and expressed in outputs (workers trained, enterprises promoted), not lives, so they cannot be compared on this axis without a conversion rule. That rule is a client decision.</div>';

  /* ---- achievement by BU-Site — no source apportions a goal below BU, so
     sites are ranked on reach and zero-reporters come off the site master ---- */
  const siteRows=group(REC(rows),r=>r.site).map(o=>({k:o.k,v:o.v,n:o.n,z:o.rows[0].z,prov:o.rows[0].prov,bu:o.rows[0].bu})).sort((a,b)=>b.v-a.v);
  const hi=siteRows.slice(0,6), lo=siteRows.filter(o=>o.v>0).slice(-6).reverse();
  const zeroSites=masterSitesInScope().filter(s=>!siteRows.some(o=>o.k===s.k&&o.v>0));
  const mxS=Math.max(1,...siteRows.map(x=>x.v));
  const siteCard=card('Achievement by BU-Site',
    'The six sites with the highest reach and the six with the lowest non-zero reach, plus every site in the master that reported nothing.',
    '<div class="grid2"><div><b style="font-size:11.5px;color:var(--ok)">Highest reach</b>'+
    hi.map(o=>hbar(o.k+' · '+o.bu,o.v,mxS,'var(--ok)',F(o.v),'site:'+o.k)).join('')+
    '</div><div><b style="font-size:11.5px;color:var(--bad)">Lowest reach</b>'+
    lo.map(o=>hbar(o.k+' · '+o.bu,o.v,mxS,'var(--bad)',F(o.v),'site:'+o.k)).join('')+
    '</div></div>'+
    (zeroSites.length?'<div style="margin-top:14px"><b style="font-size:11.5px;color:var(--warn)">Zero-reporting sites ('+zeroSites.length+' of '+SITE_MASTER+')</b>'+
      '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:7px">'+
      zeroSites.map(o=>'<span class="pill p-warn">'+o.k+' · '+o.prov+'</span>').join('')+'</div></div>':''),
    src('live','Gram Panchayat (BU-Site) master + '+SRC_SYS),
    reg('Site achievement',['BU-Site','Zone','State','BU','Actual','Records'],siteRows.map(o=>[o.k,o.z,o.prov,o.bu,o.v,o.n])),
    'No goal is apportioned below Business Unit in any source, so sites are compared on reach, not % of goal. A zero-reporting site is in the master with no submission in the slice.');

  const un=buRows.find(o=>o.k==='Unassigned');
  const note=un&&un.v?'<div class="note warn"><b>'+F(un.v)+' of '+F(totV(rows))+' ('+PCT(un.v/totV(rows))+
    ') sits in Unassigned.</b> Business Unit is derived from the site-code prefix, not stored on the record, so a site missing from the master counts at IN Ops level but in no BU row. A single site dictionary closes this column permanently.</div>':'';

  return contrib+'<div class="grid2">'+grouped+heatCard+'</div>'+mouCard+siteCard+note;
}
function monSelCount(){ return Math.max(1,monthsOf(S.f.period).length); }

/* ---------- TAB 4 · TREND ---------- */
function leadTrend(){
  const f=Object.assign(activeF(),{period:'Full year'});
  const rows=FACTS.filter(r=>matches(r,f));
  if(!rows.length) return emptyBox('No trend for this selection','Nothing reported across '+(S.f.fy==='All years'?'any year':S.f.fy)+' on these filters.');
  const monthsPresent=MON.map((m,i)=>i).filter(i=>rows.some(r=>r.m===i&&r.t>0));
  const cats=monthsPresent.map(i=>MON[i]);
  const topInds=group(rows,r=>r.ind).sort((a,b)=>b.v-a.v).slice(0,5).map(o=>o.k);
  const series=topInds.map((id,ix)=>({name:id+' '+IND_BY[id].n.slice(0,30),color:C[ix%5],
    data:monthsPresent.map(mi=>totV(rows.filter(r=>r.ind===id&&r.m===mi)))}));
  const t=card('Monthly trend — '+(S.f.fy==='All years'?'all years combined':S.f.fy),
    'Time runs left to right, y-axis starts at zero. Direction matters more than level: a line falls when a partner stops reporting, not only when delivery stops. The period filter does not apply to this chart — the whole year is the point.',
    legend(series.map(s=>({k:s.name,c:s.color})))+lineChart(cats,series,{h:250,w:900}),
    src('live',SRC_SYS),
    reg('Trend by indicator',['Indicator'].concat(cats),series.map(s=>[s.name].concat(s.data))));

  const totals=monthsPresent.map(mi=>totV(rows.filter(r=>r.m===mi)));
  const goals=monthsPresent.map(mi=>totG(rows.filter(r=>r.m===mi)));
  const vsGoal=card('Total against goal, by month',
    'Actual column against the month\'s goal column — two measures of the same thing on one scale, never two axes.',
    legend([{k:metricWord(),c:C[0]},{k:'Goal',c:'var(--gray-400)'}])+
    groupedBars(cats,[{name:'Actual',color:C[0],data:totals},{name:'Goal',color:'var(--gray-400)',data:goals}],{h:220,w:560}),
    src('live',SRC_SYS),
    reg('Monthly totals',['Month','Actual','Goal','% of goal'],cats.map((c,i)=>[c,totals[i],goals[i],goals[i]?PCT1(totals[i]/goals[i]):''])));

  const sparks=card('Indicator momentum',
    'One row per indicator in this slice. The last bar is the most recent month with a return.',
    group(rows,r=>r.ind).sort((a,b)=>b.v-a.v).slice(0,8).map(o=>{
      const d=monthsPresent.map(mi=>totV(rows.filter(r=>r.ind===o.k&&r.m===mi)));
      const mx=Math.max(1,...d);
      return '<div class="hbar" data-drill="ind:'+o.k+'"><div class="lb"><b>'+o.k+'</b> '+IND_BY[o.k].n.slice(0,20)+'</div>'+
        '<div style="flex:1"><span class="spark">'+d.map((v,i)=>'<i class="'+(i===d.length-1?'hi':'')+'" style="height:'+Math.max(3,(v/mx)*20)+'px"></i>').join('')+'</span></div>'+
        '<div class="vl">'+F(d[d.length-1])+'</div></div>';
    }).join(''),
    src('live',SRC_SYS),
    reg('Indicator momentum',['Indicator','Name'].concat(cats),
      group(rows,r=>r.ind).sort((a,b)=>b.v-a.v).map(o=>[o.k,IND_BY[o.k].n].concat(monthsPresent.map(mi=>totV(rows.filter(r=>r.ind===o.k&&r.m===mi)))))));

  return t+'<div class="grid2">'+vsGoal+sparks+'</div>';
}

function gapPill(g){
  if(g==null) return '<span class="pill p-none">—</span>';
  const p=(g*100).toFixed(1)+'%';
  if(Math.abs(g)<=0.02) return '<span class="pill p-ok">'+(g>=0?'+':'')+p+' &#10003;</span>';
  if(Math.abs(g)<=0.15) return '<span class="pill p-warn">'+(g>=0?'+':'')+p+' !</span>';
  return '<span class="pill p-bad">'+(g>=0?'+':'')+p+' &#9650;</span>';
}
function reconData(key){
  const d=RECON[key], ms=packMonths();
  const cols=d.cols.filter(packColActive);
  const rows=ms.map(m=>{
    const raw=cols.reduce((a,c)=>a+d.rows[m][c],0);
    /* Page 0 is only comparable when the whole partner set is in view */
    const p0=(cols.length===d.cols.length)?d.rows[m].p0:null;
    return {m:m,cells:cols.map(c=>d.rows[m][c]),raw:raw,p0:p0,gap:p0?(raw-p0)/p0:null};
  });
  const tot={cells:cols.map(c=>ms.reduce((a,m)=>a+d.rows[m][c],0)),
             raw:rows.reduce((a,r)=>a+r.raw,0),
             p0:rows.every(r=>r.p0!=null)?rows.reduce((a,r)=>a+r.p0,0):null};
  tot.gap=tot.p0?(tot.raw-tot.p0)/tot.p0:null;
  return {cols:cols,rows:rows,tot:tot,label:d.label};
}

/* ---------- TAB 1 · KPI TARGET vs ACHIEVEMENT (Vedanta theme-detail pattern) ----------

   sheet (the only target that exists). mGrant KPI master: achieved from the
   ICE records tagged to each KPI; no KPI carries a target in mGrant, so each
   line says so — exactly how Vedanta renders a KPI without a target. */
const BANDS=[{k:'blue',l:'Blue',r:'> 100%',c:'var(--az-blue)'},{k:'green',l:'Green',r:'96–100%',c:'var(--ok)'},
             {k:'amber',l:'Amber',r:'81–95%',c:'var(--warn)'},{k:'red',l:'Red',r:'0–80%',c:'var(--bad)'}];
function bandOf(p){ return p>100?'blue':p>=96?'green':p>=81?'amber':'red'; }
function kpiLine(o){
  if(o.tg==null) return '<div class="kpi-line" data-drill="'+o.drill+'"><div class="kpi-line-hd"><h5>'+o.name+'</h5>'+
    '<span class="chip">'+(o.chip||'No target')+'</span></div>'+

    (o.sub?'<div class="caption" style="margin-top:6px">'+o.sub+'</div>':'')+'</div>';
  const pct=o.tg?o.a/o.tg*100:0, p=Math.min(100,pct);
  const st=pct>=95?['On Track','var(--ok)','var(--ok-bg)']:pct>=75?['At Risk','var(--warn)','var(--warn-bg)']:['Off Track','var(--bad)','var(--bad-bg)'];
  return '<div class="kpi-line" data-drill="'+o.drill+'"><div class="kpi-line-hd"><h5>'+o.name+'</h5>'+
    '<span class="chip" style="background:'+st[2]+';color:'+st[1]+'">'+st[0]+'</span></div>'+
    '<div class="secondary" style="margin-bottom:8px">Achieved <b>'+F(o.a)+'</b> / Target '+F(o.tg)+'</div>'+
    '<div class="prog"><i style="width:'+p+'%;background:'+st[1]+'"></i></div>'+
    '<div style="display:flex;justify-content:space-between;margin-top:5px"><span class="caption">'+(o.sub||'Progress')+'</span>'+
    '<b style="font-size:12px;color:'+st[1]+'">'+pct.toFixed(1)+'%</b></div></div>';
}
function pillKPI(){
  const rows=pillRows(), pil=PIL_OF[S.pillar], cut=activeF().partner!=='All', PJ=curProject();

    return {id:ind.id,ind:ind,a:totV(r),tg:(!cut&&g)?g:null,recs:REC(r).length};
  });
  const withT=lines.filter(l=>l.tg);
  const bands={blue:0,green:0,amber:0,red:0}; withT.forEach(l=>bands[bandOf(l.a/l.tg*100)]++);

    kpi({key:'pk-r',ico:ICO.doc,val:F(REC(rows).length),label:'Submissions behind these figures',

      a:o.a,tg:null,unit:o.unit,drill:'kpim:'+o.c,chip:'No target in mGrant',sub:o.c})).join('')+'</div>':'';

  const ms=monthsOf(S.f.period);
  const monthCard=card('Achievement against target, by month','Achieved and target for each month in the period, on one scale.',

  const byP=group(REC(rows),r=>r.pt).sort((a,b)=>b.v-a.v);

  return k+bandsHtml+fw+mg+'<div class="grid2">'+monthCard+partCard+'</div>'+(S.pillar==='Social Security'&&(!PJ||PJ.id==='ss-sa')?ssFunnel(rows):'');
}
/* Social Security — the application funnel Gaurav asked for, off the live
   Household Survey → Beneficiary → Scheme Application chain. */
function ssFunnel(rows){
  const sa=REC(rows).filter(r=>r.form==='Scheme Application');
  const f=S.f, ms=monthsOf(f.period);
  const hs=(SYS.hs||[]).filter(r=>r[1]&&(f.fy==='All years'||fyOf(r[1])===f.fy)&&ms.indexOf(monOf(r[1]))>=0&&(f.partner==='All'||ptName(r[2])===f.partner));
  const hb=(SYS.hb||[]).filter(r=>f.partner==='All'||ptName(r[0])===f.partner).reduce((a,r)=>a+r[6],0);
  const ORD={'Identified':0,'Applied':1,'Under Review':1,'Re-applied':1,'Approved':2,'Benefit Received':3};
  const stages=['Identified','Applied','Approved','Benefit Received'];
  const cum=stages.map((s,i)=>sa.filter(r=>(ORD[r.life]==null?-1:ORD[r.life])>=i).length);
  const steps=[['Households surveyed',hs.length,null],['Members profiled (all time)',hb,null]].concat(stages.map((s,i)=>['Reached '+s,cum[i],s]));
  const mx=Math.max(1,...steps.map(x=>x[1]));
  const funnel=card('Social entitlements funnel','Household Survey → Household Beneficiary → Scheme Application, each stage counting applications that reached at least that step.',
    steps.map((x,i)=>hbar(x[0],x[1],mx,i<2?'var(--gray-400)':C[2],F(x[1])+(i>2&&cum[0]?'  '+PCT(x[1]/cum[0]):''),x[2]?'funnel:'+x[2]:(i===0?null:null))).join(''),
    src('live','Household Survey · Household Beneficiary · Scheme Application — inops.mgrant.in'),
    reg('Social entitlements funnel',['Stage','Count'],steps.map(x=>[x[0],x[1]])));
  const bySch=group(sa,r=>r.scheme||'—').sort((a,b)=>b.n-a.n).slice(0,10);
  const schCard=card('Applications by scheme','Top schemes by applications in the slice, with how many reached Benefit Received.',
    bySch.length?'<table><thead><tr><th>Scheme</th><th class="num">Applications</th><th class="num">Enrolled</th><th class="num">Benefit received</th></tr></thead><tbody>'+
      bySch.map(o=>'<tr data-drill="sub:'+subId(o.rows)+'|'+htmlEsc(o.k)+'"><td>'+htmlEsc(o.k)+'</td><td class="num">'+o.n+'</td><td class="num">'+o.rows.filter(r=>r.t>0).length+'</td>'+
        '<td class="num">'+o.rows.filter(r=>r.life==='Benefit Received').length+'</td></tr>').join('')+'</tbody></table>'
      :emptyBox('No Scheme Application in this slice',''),
    src('live','Scheme Application · inops.mgrant.in'),
    reg('Applications by scheme',['Scheme','Applications','Enrolled','Benefit received'],bySch.map(o=>[o.k,o.n,o.rows.filter(r=>r.t>0).length,o.rows.filter(r=>r.life==='Benefit Received').length])));
  return '<div class="grid2">'+funnel+schCard+'</div>';
}

/* ---------- TAB 2 · PERFORMANCE vs MoU — pillar first, then partner ----------
   Moved down from Programme Overview: MoU commitments are signed per partner
   per pillar, so the pillar lead is the person who acts on them. */
let PACK_FORCE=false;
function pillMOU(P){
  const pillarNote='<div class="mapcrumb" style="margin-bottom:12px">'+
    '<span style="font-size:11px;color:var(--gray-500);font-weight:600">Scope</span>'+
    '<span class="mchip on">'+S.pillar+'</span><span style="color:var(--gray-300)">›</span>'+
    '<span class="mchip'+(S.f.partner==='All'?' on':'')+'" data-ptn="All">All partners</span>'+
    (P?P.partners:['Read India','SAAD Foundation','Way For Life','Head Held High','Jan Sahas'])
      .map(p=>'<span class="mchip'+(S.f.partner===p?' on':'')+'" data-ptn="'+p+'">'+p+'</span>').join('')+
    '</div>';
  if(!P) return pillarNote+progMOU();
  /* SNEHA and ACCESS MoUs are output-based and live only in the pack, so
     those cards always show the pack's own quarter (Apr–Jun 2026). */
  PACK_FORCE=true;
  let h='';
  try{
    if(P.mouA) h=accessMouCard(P)||emptyBox('ACCESS is not in the partner filter','The only MoU on file for '+S.pillar+' is the ACCESS Amazon EE Grant. Clear the partner filter, or pick AccessDev.');
    else if(P.mou) h=mouCard(P)||emptyBox('SNEHA is not in the partner filter','The only MoU on file for '+S.pillar+' is SNEHA’s Sehat Project annexure. Clear the partner filter, or pick SNEHA.');
    else h=emptyBox('No MoU on file for '+S.pillar,'Ask the pillar lead for the partner agreements before this view can be built.');
  }finally{ PACK_FORCE=false; }
  return pillarNote+h;
}

/* ---------- shared pack helpers ---------- */
function monSel(){ return PACK_FORCE?['Apr','May','Jun']:packMonths(); }
function ownerActive(owner){
  if(S.f.partner==='All') return true;
  return (PACK_COLMAP[owner]||[owner]).indexOf(S.f.partner)>=0;
}
function partnerRows(rows,ix){ return rows.filter(r=>(S.f.partner==='All'||r[ix]===S.f.partner)&&(qMatch(r.join(' ')))); }
function monCols(){ const ms=monSel(); return ['Apr','May','Jun'].filter(m=>ms.indexOf(m)>=0); }
function monIdx(){ const ms=monSel(); return ['Apr','May','Jun'].map((m,i)=>ms.indexOf(m)>=0?i:-1).filter(i=>i>=0); }
function scopeLine(P){
  return (S.f.partner==='All'?'all partners':S.f.partner)+' · '+(monSel().join(', ')||'no month')+' 2026 · '+P.file;
}

/* ---------- reconciliation card, shared by both packs ---------- */
function reconCard(r,P){
  const ms=monSel();
  const keep=r.cols.map((c,i)=>i).filter(i=>ownerActive(r.owner[i]));
  const rows=r.rows.filter(x=>ms.indexOf(x[0])>=0);
  if(!keep.length) return card(r.id+' — '+r.title,r.note,
    emptyBox('No delivery partner in view','Neither '+r.owner.join(' nor ')+' matches the partner filter.'),
    src('sheet',P.file+' · sheet 1 Monthly Reconciliation'));
  const full=keep.length===r.cols.length;
  const body=rows.map(x=>{
    const cells=keep.map(i=>x[1][i]);
    const raw=cells.reduce((a,b)=>a+b,0);
    const p0=full?x[2]:null;
    return {m:x[0],cells:cells,raw:raw,p0:p0,gap:p0?(raw-p0)/p0:null};
  });
  const tRaw=body.reduce((a,b)=>a+b.raw,0);
  const tP0=full?body.reduce((a,b)=>a+(b.p0||0),0):null;
  const tGap=tP0?(tRaw-tP0)/tP0:null;
  const tbl='<table><thead><tr><th>Month</th>'+keep.map(i=>'<th class="num">'+r.cols[i]+'</th>').join('')+
    '<th class="num">Raw total</th><th class="num">Page 0</th><th class="num">Gap</th></tr></thead><tbody>'+
    body.map(b=>'<tr data-drill="recon:'+r.id+' '+b.m+'"><td><b>'+b.m+'</b></td>'+
      b.cells.map(v=>'<td class="num">'+F(v)+'</td>').join('')+
      '<td class="num"><b>'+F(b.raw)+'</b></td><td class="num">'+(b.p0==null?'<span class="muted">n/a</span>':F(b.p0))+'</td>'+
      '<td class="num">'+gapPill(b.gap)+'</td></tr>').join('')+
    '<tr class="totalrow"><td>Total</td>'+keep.map((i,k)=>'<td class="num">'+F(body.reduce((a,b)=>a+b.cells[k],0))+'</td>').join('')+
    '<td class="num">'+F(tRaw)+'</td><td class="num">'+(tP0==null?'n/a':F(tP0))+'</td><td class="num">'+gapPill(tGap)+'</td></tr>'+
    '</tbody></table>'+
    (r.goal?'<div style="margin-top:10px">'+hbar('Q1 goal '+F(r.goal),tP0||tRaw,Math.max(r.goal,tP0||tRaw),
        ragBarColor((tP0||tRaw)/r.goal),F(tP0||tRaw)+'  '+PCT((tP0||tRaw)/r.goal),null,
        r.goal/Math.max(r.goal,tP0||tRaw))+'</div>':'');
  const dl=reg(P.pillar+' '+r.id+' reconciliation',['Month'].concat(keep.map(i=>r.cols[i]),['Raw total','Page 0','Gap %']),
    body.map(b=>[b.m].concat(b.cells,[b.raw,b.p0,b.gap==null?'':PCT1(b.gap)])));
  return card(r.id+' — '+r.title,r.note,tbl,src('sheet',P.file+' · sheet 1 Monthly Reconciliation'),dl)+
    (full?'<div class="note '+(r.tone==='bad'?'bad':r.tone==='warn'?'warn':'')+'">'+r.read+'</div>'
        :'<div class="note warn"><b>Page 0 is published at indicator level, not per partner.</b> The comparison column is suppressed on a partner filter rather than shown against a partial raw total.</div>');
}

  let extra='';

      card('Sites reporting in only 1 of 3 months',
        one.length+' sites filed in a single month. Confirm whether they opened or closed during the quarter, or whether reporting is simply incomplete.',
        one.length?'<table><thead><tr><th>Site</th><th>Zone</th><th>Partner</th><th>Month active</th><th class="num">Q2 total</th></tr></thead><tbody>'+

    src('sheet',P.file+' · sheet Non-Performing Sites'),
    reg(P.pillar+' flagged sites',['Site / group','Partner','Indicator','Issue','Severity','Detail'],flagged)):'';

  const goodCard=P.good?card('Good practices — what is already working',

    :'<div class="note warn"><b>This pack has no Good Practices sheet.</b> The Social Security and Livelihood packs both carry one; the Food Security pack records findings only. Worth asking for the same section so the pillar review is not purely a defect list.</div>';

  return k+tbl+extra+flagCard+goodCard;
}
/* Officer-level activity computed from the live records in the pillar. */
function survSys(){
  const rows=REC(pillRows()).filter(r=>r.srv&&r.srv!=='—');
  const ORDER=['RED','AMBER','LOW','GREEN'];
  return group(rows,r=>r.srv).map(o=>{
    const recs=o.rows, acts=recs.length, at=recs.filter(r=>r.t===100), pct=acts?at.length/acts:0;
    const pts={}; recs.forEach(r=>pts[r.pt]=(pts[r.pt]||0)+1);
    const pt=Object.keys(pts).sort((a,b)=>pts[b]-pts[a])[0];
    return [pt,[...new Set(recs.map(r=>r.form==='Social Entitlements Enrolment Form'?'SEEF':r.form))].join(', '),o.k,totT(recs),acts,at.length,pct,totT(at),
      pct>=0.5?'RED':pct>=0.2?'AMBER':pct>0?'LOW':'GREEN'];
  }).sort((a,b)=>(ORDER.indexOf(a[8])-ORDER.indexOf(b[8]))||(b[3]-a[3]));
}

function scatterSVG(rows){
  const W=520,H=210,PL=48,PB=28,PT=10,PR=10,iw=W-PL-PR,ih=H-PT-PB;
  const mx=Math.max(1,...rows.map(r=>r[4])), my=niceMax(Math.max(1,...rows.map(r=>r[3])));

  for(let i=0;i<=4;i++){const y=PT+ih-(ih*i/4);
    s+='<line class="gridline" x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'"/>';
    s+='<text x="'+(PL-6)+'" y="'+(y+3)+'" text-anchor="end">'+F(Math.round(my*i/4))+'</text>';}
  rows.forEach(r=>{
    const x=PL+(r[4]/mx)*iw, y=PT+ih-(r[3]/my)*ih;
    s+='<circle cx="'+x+'" cy="'+y+'" r="5.5" fill="'+FLAGC[r[8]]+'" fill-opacity=".85" stroke="#fff" stroke-width="1.5"><title>'+r[2]+' ('+r[0]+') — '+r[4]+' activities, '+F(r[3])+' reached</title></circle>';
  });
  s+='<line class="axis" x1="'+PL+'" y1="'+(PT+ih)+'" x2="'+(W-PR)+'" y2="'+(PT+ih)+'"/>';
  s+='<text x="'+(PL+iw/2)+'" y="'+(H-6)+'" text-anchor="middle">Activities reported &rarr;</text></svg>';
  return s;
}

    ['A.3.2','— if counted as applications',25391,B.tot.p0,B.tot.p0?(25391-B.tot.p0)/B.tot.p0:null,'Counting rule, not a data error. The basis has to be agreed before the gap can be called.'],
    ['A.3.2','— if counted as benefits delivered',24773,B.tot.p0,B.tot.p0?(24773-B.tot.p0)/B.tot.p0:null,'Same. Three defensible numbers exist for one indicator.']
  ];
  const tbl=card('Where the two disagree, and why',
    'Each row states the reason. A reconciliation gap is a counting-rule question until proven otherwise.',
    '<table><thead><tr><th>#</th><th>Basis</th><th class="num">Narrative</th><th class="num">Platform</th><th class="num">Gap</th><th>Reading</th></tr></thead><tbody>'+
    basis.map(r=>'<tr data-drill="narr:'+r[1]+'"><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td class="num">'+F(r[2])+'</td>'+
      '<td class="num">'+(r[3]==null?'n/a':F(r[3]))+'</td><td class="num">'+gapPill(r[4])+'</td><td style="white-space:normal">'+r[5]+'</td></tr>').join('')+
    '</tbody></table>',
    src('sheet','Social Security Pillar pack · sheets 1 and 4'),
    reg('Counting basis',['Indicator','Basis','Narrative','Platform','Gap %','Reading'],
      basis.map(r=>[r[0],r[1],r[2],r[3],r[4]==null?'':PCT1(r[4]),r[5]])));

  return k+cmp+tbl+'<div class="note warn"><b>This is the view that settles an MBR argument.</b> It puts the partner\'s own narrative figure next to the platform figure for the same month and indicator, and names the counting basis behind each. Without it, the monthly conversation is two people quoting different numbers at each other.</div>';
}
/* Data quality, tested on the live records in the pillar — every finding is
   a query against inops.mgrant.in, and each row opens the records it counts. */
function dqSys(){
  const rows=REC(pillRows()), out=[];
  const who=S.f.partner==='All'?'All partners':S.f.partner;
  const add=(pt,fin,m,det,sev,rs)=>out.push([pt,fin,m,det,sev,rs||[]]);
  if(!rows.length) return out;
  const n=rows.length, rev=rows.filter(r=>r.st===0), rej=rows.filter(r=>r.st===2);
  add(who,'Awaiting approval',rev.length/n,F(rev.length)+' of '+F(n)+' submissions are still in Review. Until approved, none of them is a reportable number.',rev.length/n>0.5?'bad':'warn',rev);
  if(rej.length) add(who,'Rejected submissions',rej.length/n,F(rej.length)+' submissions were rejected by the reviewing PM.','warn',rej);
  const ice=rows.filter(r=>r.form==='ICE Form');
  if(ice.length){
    const same=ice.filter(r=>r.t===r.inter);
    add('ICE Form','No touched / impacted split',same.length/ice.length,'Grand Total and the field labelled "Lives Impacted" hold the same number on '+F(same.length)+' of '+F(ice.length)+' ICE rows. The form records one figure twice, so lives impacted cannot be reported from ICE.','bad',same);
    const cap=ice.filter(r=>r.t===100);
    if(cap.length) add(who,'Rows at exactly 100',cap.length/ice.length,F(cap.length)+' ICE rows record exactly 100 people — a round ceiling that usually stands in for an uncounted group.',cap.length/ice.length>0.1?'warn':'ok',cap);
    const gm=ice.filter(r=>(r.male+r.fem+r.trans)!==r.t);
    if(gm.length) add('ICE Form','Gender split does not add up',gm.length/ice.length,F(gm.length)+' ICE rows where males + females + transgender ≠ Grand Total.','warn',gm);
    const z=ice.filter(r=>!r.t);
    if(z.length) add(who,'Zero people reached',z.length/ice.length,F(z.length)+' ICE activities were filed with a Grand Total of 0.','warn',z);
  }
  const seen={}, dup=[];
  rows.forEach(r=>{ const key=r.form+'|'+r.srv+'|'+r.site+'|'+r.date+'|'+(r.kpi||r.scheme||''); if(seen[key]) dup.push(r); else seen[key]=1; });
  add(who,'Duplicate signature',dup.length/n,F(dup.length)+' excess rows share surveyor + BU-Site + date + form + initiative with another row. Same-day repeat sessions also match — read the rate, not the count.',dup.length/n>0.1?'bad':dup.length?'warn':'ok',dup);
  const today=String(SYS.pulled_at).slice(0,10);
  const odd=REC(FACTS).filter(r=>r.pil===PIL_OF[S.pillar]&&(S.f.partner==='All'||r.pt===S.f.partner)&&(r.date<'2026-04-01'||r.date>today));
  if(odd.length) add(who,'Dated outside the programme window',null,F(odd.length)+' records carry an activity date before 1 Apr 2026 or after '+fmtDate(today)+' — they fall outside every current-year period.','warn',odd);
  if(S.pillar==='Social Security'){
    const sa=rows.filter(r=>r.form==='Scheme Application');
    const inc=sa.filter(r=>r.benefit==='Yes'&&r.life!=='Benefit Received');
    if(inc.length) add('Scheme Application','Benefit received, lifecycle not updated',sa.length?inc.length/sa.length:null,F(inc.length)+' applications say Benefit Received = Yes while the lifecycle still reads Identified, Applied or Approved. The funnel under-counts delivered benefits until one field drives the other.','bad',inc);
    const un=sa.filter(r=>r.elig==='To assess'&&ORD_LIFE(r.life)>=2);
    if(un.length) add('Scheme Application','Approved before eligibility was assessed',sa.length?un.length/sa.length:null,F(un.length)+' applications are Approved or Benefit Received with eligibility still "To assess".','warn',un);
  }
  const SEV={bad:0,warn:1,ok:2};
  return out.sort((a,b)=>SEV[a[4]]-SEV[b[4]]);
}
function ORD_LIFE(l){ return {'Identified':0,'Applied':1,'Under Review':1,'Re-applied':1,'Approved':2,'Benefit Received':3}[l]||0; }
function pillDQ(){
  const all=dqSys().filter(r=>qMatch(r[0])||qMatch(r[1])||qMatch(r[3]));
  if(!all.length) return emptyBox('No submission to test','No record in '+S.pillar+' matches '+periodLabel(S.f)+'.');
  const rows=REC(pillRows());
  const bad=all.filter(r=>r[4]==='bad').length, warn=all.filter(r=>r[4]==='warn').length;
  const find=n=>all.find(r=>r[1]===n);
  const appr=find('Awaiting approval'), dup=find('Duplicate signature'), cap=find('Rows at exactly 100');
  const dlDQ=reg('Data quality register '+S.pillar,['Scope','Finding','Measure','Detail','Severity','Records'],all.map(r=>[r[0],r[1],r[2]==null?'':PCT1(r[2]),r[3],r[4],r[5].length]));
  const k=rowHead('Data quality',all.length+' tests on '+F(rows.length)+' live records · '+periodLabel(S.f),dlDQ)+
  '<div class="kpi-row">'+
    kpi({key:'dq-1',ico:ICO.alert,val:String(bad),label:'High-severity findings',delta:warn+' medium',dir:bad?'down':'up',def:'Findings whose effect changes a reported number.',srcTxt:SRC_SYS})+
    kpi({key:'dq-2',ico:ICO.doc,val:appr?PCT(appr[2]):'0%',label:'Submissions awaiting approval',delta:appr?F(appr[5].length)+' of '+F(rows.length):'—',dir:'down',pct:appr?1-appr[2]:null,def:'Share of records still in Review.',srcTxt:SRC_SYS})+
    kpi({key:'dq-3',ico:ICO.users,val:dup?PCT1(dup[2]):'0%',label:'Rows matching the duplicate signature',delta:dup?F(dup[5].length)+' excess rows':'—',dir:'down',def:'Surveyor + BU-Site + date + form + initiative.',srcTxt:SRC_SYS})+
    kpi({key:'dq-4',ico:ICO.target,val:cap?PCT1(cap[2]):'0%',label:'ICE rows at exactly 100',delta:cap?F(cap[5].length)+' rows':'no ICE rows',dir:'flat',def:'Rows whose reach is exactly 100.',srcTxt:SRC_SYS})+
  '</div>';
  const tbl=card('Data quality register','Every finding carries its measurement and the records behind it. Sorted worst first.',
    '<table><thead><tr><th>Scope</th><th>Finding</th><th class="num">Measure</th><th>Detail</th><th class="num">Records</th></tr></thead><tbody>'+
    all.map(r=>'<tr data-drill="sub:'+subId(r[5])+'|'+htmlEsc(r[1])+'"><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td>'+
      '<td class="num"><span class="pill '+(r[4]==='ok'?'p-ok':r[4]==='warn'?'p-warn':'p-bad')+'">'+(r[2]==null?'—':PCT1(r[2]))+'</span></td>'+
      '<td style="white-space:normal">'+r[3]+'</td><td class="num">'+F(r[5].length)+'</td></tr>').join('')+'</tbody></table>',
    src('live',SRC_SYS),dlDQ);
  const byP=group(rows,r=>r.pt).sort((a,b)=>b.n-a.n);
  const apprCard=card('Approval state by partner','A submission that is not approved is not yet a reportable number.',
    legend([{k:'Approved',c:'var(--ok)'},{k:'Review',c:'var(--gray-300)'},{k:'Rejected',c:'var(--bad)'}])+
    byP.map(o=>{const a=o.rows.filter(r=>r.st===1).length, j=o.rows.filter(r=>r.st===2).length, n=o.rows.length||1;
      return '<div class="hbar" data-drill="partner:'+o.k+'"><div class="lb">'+o.k+'</div>'+
        '<div class="tr" style="display:flex;background:var(--gray-100)"><i style="width:'+(a/n*100)+'%;background:var(--ok)"></i>'+
        '<i style="width:'+((n-a-j)/n*100)+'%;background:var(--gray-300)"></i><i style="width:'+(j/n*100)+'%;background:var(--bad)"></i></div>'+
        '<div class="vl">'+PCT(a/n)+'  '+n+' rows</div></div>';}).join(''),
    src('live',SRC_SYS),reg('Approval by partner '+S.pillar,['Partner','Rows','Approved','Review','Rejected'],
      byP.map(o=>[o.k,o.rows.length,o.rows.filter(r=>r.st===1).length,o.rows.filter(r=>r.st===0).length,o.rows.filter(r=>r.st===2).length])));
  const dupRows=dup?dup[5]:[];
  const dP=group(rows,r=>r.pt).map(o=>({k:o.k,n:o.rows.length,d:dupRows.filter(r=>r.pt===o.k).length})).sort((a,b)=>b.d/b.n-a.d/a.n);
  const dupCard=card('Duplicate rate by partner','Excess rows sharing the duplicate signature, as a share of the partner\'s rows.',
    dP.map(o=>hbar(o.k,o.d/o.n,Math.max(0.05,...dP.map(x=>x.d/x.n)),o.d/o.n>=0.1?'var(--bad)':'var(--warn)',PCT1(o.d/o.n)+'  '+o.d+' of '+o.n,'partner:'+o.k)).join(''),
    src('live',SRC_SYS),reg('Duplicates by partner '+S.pillar,['Partner','Rows','Excess rows','Rate'],dP.map(o=>[o.k,o.n,o.d,PCT1(o.d/o.n)])));
  return k+tbl+'<div class="grid2">'+apprCard+dupCard+'</div>';
}

const SUBS={}; let subSeq=0;
function subId(rows){ const id='s'+(++subSeq); SUBS[id]=rows; return id; }
const GROUPS={
  bu:['Business Unit','business units',r=>r.bu], partner:['Partner','partners',r=>r.pt], zone:['Zone','zones',r=>r.z],
  prov:['State','states',r=>r.prov], loc:['District','districts',r=>r.loc], site:['BU-Site','BU-Sites',r=>r.site],
  ind:['Indicator','indicators',r=>r.ind], pil:['Pillar','pillars',r=>r.pil], mon:['Month','months',r=>r.mon],

function grpLabel(g,k){ return g==='ind'&&IND_BY[k]?k+' · '+IND_BY[k].n:k; }
function reportDrawer(noun,title,rows,gkey,ico,views){
  DRV=views?{fn:v=>reportDrawer(noun,title,rows,v,ico,views)}:null;
  const rec=REC(rows), v=totV(rows), i=totI(rows);
  const subline=F(rec.length)+' record'+(rec.length===1?'':'s')+' · '+F(v)+' '+metricWord().toLowerCase()+(i&&S.f.metric!==2?' · '+F(i)+' impacted':'')+' · '+periodLabel(S.f);
  let body, dl;
  if(gkey){
    const G=GROUPS[gkey];
    const gs=group(rows,G[2]).filter(o=>o.n||o.g).sort((a,b)=>(b.v-a.v)||(b.g-a.g));
    const showGoal=gs.some(o=>o.g>0);
    dl=reg(title+' — by '+G[0],[G[0],'Records','Partners','BU-Sites',metricWord()].concat(showGoal?['Goal','% of goal']:[]),
      gs.map(o=>[grpLabel(gkey,o.k),o.n,distinct(REC(o.rows),r=>r.pt).size,distinct(REC(o.rows).filter(r=>r.t>0),r=>r.site).size,o.v]
        .concat(showGoal?[o.g,o.g?PCT1(o.v/o.g):'']:[])));
    const hd=views?'<div class="dpanel-hd dview-hd"><span>By</span>'+viewSwitch(views,gkey,views.reduce((o,v)=>(o[v]=GROUPS[v][0],o),{}))+'</div>':'<div class="dpanel-hd">By '+G[0]+'</div>';
    body='<div class="dpanel">'+hd+'<div class="dpanel-bd flush"><div class="dscroll"><table><thead><tr>'+
      '<th>'+G[0]+'</th><th class="num">Records</th><th class="num">Partners</th><th class="num">BU-Sites</th><th class="num">'+metricWord()+'</th>'+
      (showGoal?'<th class="num">Goal</th><th class="num">% of goal</th>':'')+'</tr></thead><tbody>'+
      (gs.length?gs.map(o=>'<tr data-drill="sub:'+subId(o.rows)+'|'+htmlEsc(grpLabel(gkey,o.k))+'"><td><span class="lnk">'+htmlEsc(grpLabel(gkey,o.k))+'</span></td>'+
        '<td class="num">'+F(o.n)+'</td><td class="num">'+distinct(REC(o.rows),r=>r.pt).size+'</td>'+
        '<td class="num">'+distinct(REC(o.rows).filter(r=>r.t>0),r=>r.site).size+'</td><td class="num"><b>'+F(o.v)+'</b></td>'+
        (showGoal?'<td class="num">'+(o.g?F(o.g):'—')+'</td><td class="num">'+(o.g?ragPill(o.v/o.g):'<span class="muted">—</span>')+'</td>':'')+'</tr>').join('')
        :'<tr><td colspan="7" class="muted">Nothing to break down under this selection.</td></tr>')+
      '</tbody></table></div></div><div class="dfoot">'+gs.length+' '+G[1]+'</div></div>';
  }else{
    dl=reg(title,REC_COLS,recRows(rows));
    body='<div class="dpanel"><div class="dpanel-hd">Records</div><div class="dpanel-bd flush">'+recTable(rows)+'</div></div>';
  }
  openDrawer(noun,title,subline,body,dl,ico);
}

function drillDrawer(kind,val){

    const o=mouSys().find(x=>x.name===val); if(!o) return;
    const dl=reg('MoU '+val,['Deliverable','Actual','Target','Pace %'],MOU_COLS.map((c,i)=>[c,o.cells[i][0],o.cells[i][1],o.cells[i][1]?PCT1(o.cells[i][0]/o.cells[i][1]):'']));

        '<td>'+ragPill(o.cells[i][1]?o.cells[i][0]/o.cells[i][1]:null)+'</td></tr>').join('')+
      '<tr class="totalrow"><td>Total</td><td class="num">'+F(o.a)+'</td><td class="num">'+F(o.tg)+'</td><td>'+ragPill(o.tg?o.a/o.tg:null)+'</td></tr>'+

  openDrawer('MoU FILE',(titles[kind]||'Detail')+' — '+val.replace('|',' · '),'Partner MoU / pillar pack · Apr–Jun 2026',

   ============================================================ */
document.addEventListener('click',function(e){
  const dlb=e.target.closest('[data-dl]');
  if(dlb){ e.preventDefault(); e.stopPropagation();
    if(dlmenu.classList.contains('on')&&dlmenu.dataset.for===dlb.dataset.dl){ closeDlMenu(); }
    else { dlmenu.dataset.for=dlb.dataset.dl; openDlMenu(dlb,dlb.dataset.dl); }
    return; }
  const mi=e.target.closest('#dlmenu button');
  if(mi){ doDownload(mi.dataset.id,mi.dataset.fmt); closeDlMenu(); return; }
  closeDlMenu();

  if(e.target.closest('[data-popx]')){ closePop(); return; }
  const ib=e.target.closest('[data-info]');
  if(ib){ e.preventDefault(); e.stopPropagation();
    if(popEl.classList.contains('on')&&popEl.dataset.for===ib.dataset.info){ closePop(); }
    else { popEl.dataset.for=ib.dataset.info; openPop(ib,ib.dataset.info); }
    return; }
  if(!e.target.closest('#pop')) closePop();

  const nav=e.target.closest('.nav-item[data-page]');
  if(nav){ setPage(nav.dataset.page); return; }
  if(e.target.closest('#navPill')){ const sub=document.getElementById('navPillSub'), open=!sub.classList.contains('open');
    sub.classList.toggle('open',open); document.getElementById('navPill').setAttribute('aria-expanded',open); return; }
  const pn=e.target.closest('[data-pillnav]');
  if(pn){ S.pillar=pn.dataset.pillnav; S.project=null; setPage('pill'); return; }
  const pj=e.target.closest('[data-project]');
  if(pj){ S.project=pj.dataset.project||null; if(pj.classList.contains('pcard')) S.tab=0; render(); return; }
  const tab=e.target.closest('.tab');
  if(tab){ setTab(+tab.dataset.i); return; }
  const th=e.target.closest('[data-theme]');
  if(th){ S.theme = th.dataset.theme==='__back'?null:th.dataset.theme; render(); return; }
  const pb=e.target.closest('[data-pillar]');
  if(pb){ S.pillar=pb.dataset.pillar; S.tab=0; render(); return; }
  const ptn=e.target.closest('[data-ptn]');
  if(ptn){ S.f.partner=ptn.dataset.ptn; const sel=document.getElementById('fPartner'); if(sel) sel.value=S.f.partner; render(); return; }
  const seg=e.target.closest('.segmented[data-seg]:not([data-seg="pillar"]) button');
  if(seg){
    seg.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on'));
    seg.classList.add('on');
    S.f[seg.parentNode.dataset.seg]=+seg.dataset.v;
    render(); return;
  }
  const dv=e.target.closest('[data-dview]');
  if(dv){ e.preventDefault(); if(DRV) DRV.fn(dv.dataset.dview); return; }
  const gt=e.target.closest('[data-gotab]');
  if(gt){ e.preventDefault(); setTab(+gt.dataset.gotab); return; }
  const d=e.target.closest('[data-drill]');
  if(!d) return;
  e.preventDefault();
  const ix=d.dataset.drill.indexOf(':');
  const kind=d.dataset.drill.slice(0,ix), val=d.dataset.drill.slice(ix+1);
  if(kind==='mzone'){ S.geo = val==='__all'?{zone:null,province:null,locality:null}:{zone:val,province:null,locality:null}; render(); return; }
  if(kind==='mprov'){ S.geo={zone:ZONE_OF[val]||S.geo.zone,province:val,locality:null}; render(); return; }
  if(kind==='mdist'){ const l=DIST_LOC[val]; if(l){ S.geo.locality=S.geo.locality===l?null:l; render(); } return; }
  if(kind==='mloc'){ S.geo.locality=val; render(); return; }
  if(kind==='zone'){ if(val==='__up'){S.geo={zone:null,province:null,locality:null};} else {S.geo={zone:val,province:null,locality:null};} render(); return; }
  if(kind==='prov'){ if(val==='__up'){S.geo.province=null;S.geo.locality=null;} else {S.geo.province=val;S.geo.locality=null;} render(); return; }
  if(kind==='loc'){ if(val==='__up'){S.geo.locality=null;} else {S.geo.locality=val;} render(); return; }
  if(kind==='kpi'){ kpiDrawer(val); return; }
  drillDrawer(kind,val);
});
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ closeDrawer(); closeDlMenu(); closePop(); } });
window.addEventListener('resize',function(){ closeDlMenu(); closePop(); },true);

/* ---- filters ---- */
function opt(list,sel){ return list.map(v=>'<option'+(v===sel?' selected':'')+'>'+v+'</option>').join(''); }
document.getElementById('fFY').innerHTML=opt(['All years'].concat(FY_LIST),DEF.fy);
document.getElementById('fPeriod').innerHTML=opt(PERIODS,DEF.period);
document.getElementById('fCharter').innerHTML=opt(['All'].concat(Object.keys(CHARTERS).map(k=>CHARTERS[k])));
document.getElementById('fPillar').innerHTML=opt(['All'].concat(THEMES.map(t=>t.k)));
document.getElementById('fBU').innerHTML=opt(['All'].concat(BU_LIST));
document.getElementById('fZone').innerHTML=opt(['All'].concat(ZN));
/* State follows Zone, District follows State */
function geoOptions(){
  const zs=S.f.zone==='All'?ZN:[S.f.zone];
  const st=[].concat(...zs.map(z=>Object.keys(GEO[z].prov))).filter(x=>x&&x!=='—').sort();
  if(st.indexOf(S.f.state)<0) S.f.state='All';
  const ss=S.f.state==='All'?st:[S.f.state];
  const ds=[...new Set([].concat(...ss.map(s=>{ const z=ZONE_OF[s]; return z?Object.keys(GEO[z].prov[s].loc):[]; })))].filter(x=>x&&x!=='—').sort();
  if(ds.indexOf(S.f.district)<0) S.f.district='All';
  document.getElementById('fState').innerHTML=opt(['All'].concat(st),S.f.state);
  document.getElementById('fDistrict').innerHTML=opt(['All'].concat(ds),S.f.district);
}
geoOptions();
document.getElementById('fPartner').innerHTML=opt(['All'].concat(PARTNERS));
FINX.proj.forEach(p=>{ if(p.ent&&ENTITIES.indexOf(p.ent)<0) ENTITIES.push(p.ent); if(p.ft&&FUNDS.indexOf(p.ft)<0) FUNDS.push(p.ft); });
FINX.ent.forEach(e=>{ if(e.code&&ENTITIES.indexOf(e.code)<0) ENTITIES.push(e.code); if(FUNDS.indexOf(e.src)<0) FUNDS.push(e.src); });
ENTITIES.sort(); FUNDS.sort();
document.getElementById('fEnt').innerHTML=opt(['All'].concat(ENTITIES));
document.getElementById('fFund').innerHTML=opt(['All'].concat(FUNDS));
const FMAP={fFY:'fy',fPeriod:'period',fCharter:'charter',fPillar:'pillar',fBU:'bu',fZone:'zone',fState:'state',fDistrict:'district',
            fPartner:'partner',fEnt:'ent',fFund:'fund'};
Object.keys(FMAP).forEach(id=>document.getElementById(id).addEventListener('change',function(){
  S.f[FMAP[id]]=this.value;
  if(FMAP[id]==='zone'){ S.geo={zone:null,province:null,locality:null}; S.f.state='All'; S.f.district='All'; }
  if(FMAP[id]==='state'){ S.f.district='All'; S.geo={zone:null,province:null,locality:null}; }
  if(FMAP[id]==='district') S.geo={zone:null,province:null,locality:null};
  geoOptions();
  render();
}));
document.addEventListener('change',function(e){
  if(!e.target) return;
  if(e.target.id==='mapMetric'){ S.map.metric=e.target.value; render(); }
});

/* ---- map interaction: hover card, breadcrumb, zoom, drag-to-pan ----
   Same behaviours as the Vedanta Leaflet component; here they run against
   the SVG viewBox because the wireframe carries no vendor libraries. */
function mapHoverCard(id){
  const el=document.getElementById('gdMapHover'); if(!el) return;
  const o=id?HOVER[id]:null;
  if(!o){ el.innerHTML=''; el.classList.remove('has-content'); return; }
  el.innerHTML='<div class="overline">'+o.kind+'</div><h5>'+o.title+'</h5><div class="gh-grid">'+
    o.cells.map(c=>'<div><span>'+c[0]+'</span><b>'+c[1]+'</b></div>').join('')+'</div>';
  el.classList.add('has-content');
}
document.addEventListener('mouseover',function(e){
  const t=e.target.closest&&e.target.closest('[data-hv]');
  if(!t) return;
  mapHoverCard(t.dataset.hv);
  if(t.tagName==='path'){ t.setAttribute('stroke','#1F2937'); t.setAttribute('stroke-width','2.2'); }
});
document.addEventListener('mouseout',function(e){
  const t=e.target.closest&&e.target.closest('[data-hv]');
  if(!t) return;
  if(t.tagName==='path'&&!t.dataset.sel){ t.setAttribute('stroke','#fff'); t.setAttribute('stroke-width',S.geo.zone?'1':'0.8'); }
  mapHoverCard(null);
});
function mapZoom(f){
  const v=S.map.view; if(!v) return;
  const cx=v[0]+v[2]/2, cy=v[1]+v[3]/2;
  v[2]=Math.max(12,v[2]*f); v[3]=Math.max(12,v[3]*f);
  v[0]=cx-v[2]/2; v[1]=cy-v[3]/2;
  const svg=document.getElementById('gdMapSvg'); if(svg) svg.setAttribute('viewBox',v.join(' '));
}
document.addEventListener('click',function(e){
  const fb=e.target.closest&&e.target.closest('#mapFin');
  if(fb){ e.preventDefault(); e.stopPropagation();
    S.map.fin=!S.map.fin;
    /* shading by a money metric is not allowed once financials are off */
    if(!S.map.fin&&MAP_METRICS[S.map.metric]&&MAP_METRICS[S.map.metric].money) S.map.metric='reach';
    render(); return; }
  const z=e.target.closest&&e.target.closest('[data-zoom]');
  if(z){ e.preventDefault(); e.stopPropagation();
    if(z.dataset.zoom==='in') mapZoom(1/1.35);
    else if(z.dataset.zoom==='out') mapZoom(1.35);
    else { S.map.view=null; render(); }
    return; }
  const gostep=e.target.closest&&e.target.closest('.map-crumb .step');
  if(gostep){ e.preventDefault(); e.stopPropagation();
    const go=gostep.dataset.go;
    if(go==='india') S.geo={zone:null,province:null,locality:null};
    else if(go==='zone') S.geo={zone:S.geo.zone,province:null,locality:null};
    else if(go==='state') S.geo={zone:S.geo.zone,province:S.geo.province,locality:null};
    render(); return; }
},true);
(function dragPan(){
  let on=false,sx=0,sy=0,v0=null,svg=null;
  document.addEventListener('mousedown',function(e){
    svg=e.target.closest&&e.target.closest('#gdMapSvg'); if(!svg) return;
    if(e.target.closest('[data-drill]')) return;     /* let a shape click drill */
    on=true; sx=e.clientX; sy=e.clientY; v0=S.map.view.slice(); svg.classList.add('drag');
  });
  document.addEventListener('mousemove',function(e){
    if(!on||!svg) return;
    const r=svg.getBoundingClientRect();
    S.map.view[0]=v0[0]-(e.clientX-sx)*(v0[2]/r.width);
    S.map.view[1]=v0[1]-(e.clientY-sy)*(v0[3]/r.height);
    svg.setAttribute('viewBox',S.map.view.join(' '));
  });
  document.addEventListener('mouseup',function(){ if(svg) svg.classList.remove('drag'); on=false; });
})();
let qt=null;
document.getElementById('fSearch').addEventListener('input',function(){
  const v=this.value; clearTimeout(qt); qt=setTimeout(function(){ S.f.q=v; render(); },220);
});
function syncReset(){
  const on=filtersFor(), prim=PAGES[S.page].primary, af=activeF();
  let n=0, nm=0;
  F_ALL.forEach(k=>{
    const el=document.querySelector('.filter-strip [data-f="'+k+'"]');
    const set=on.indexOf(k)>=0&&af[k]!==DEF[k]&&k!=='fy'&&k!=='period';
    if(el&&el.classList.contains('fpill')) el.classList.toggle('on',k==='fy'||k==='period'||set);
    if(set){ n++; if(prim.indexOf(k)<0) nm++; }
  });
  if(S.f.q) n++;
  if(S.geo.zone) n++;
  const r=document.getElementById('fReset');
  r.style.display=n?'inline-flex':'none';
  r.querySelector('.badge').textContent=n;
  const mb=document.getElementById('fMoreN'); mb.textContent=nm||''; mb.style.display=nm?'inline-block':'none';
}
document.getElementById('fMoreBtn').addEventListener('click',function(e){ e.stopPropagation(); S.moreOpen=!S.moreOpen; renderTabs(); });
/* the Refine panel closes on an outside click or Escape, like the Vedanta one */
document.addEventListener('mousedown',function(e){ if(S.moreOpen&&!e.target.closest('.fmore-anchor')){ S.moreOpen=false; renderTabs(); } });
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&S.moreOpen){ S.moreOpen=false; renderTabs(); } });
document.getElementById('fReset').addEventListener('click',function(){
  S.f=Object.assign({},DEF);
  S.geo={zone:null,province:null,locality:null}; S.project=null;
  geoOptions();
  Object.keys(FMAP).forEach(id=>document.getElementById(id).value=DEF[FMAP[id]]);
  document.getElementById('fSearch').value='';
  document.querySelectorAll('.segmented[data-seg]:not([data-seg="pillar"])').forEach(function(sg){
    sg.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===0));
  });
  render();
});

/* ---- refresh + as-at chrome (mirrors the Vedanta header contract) ---- */
let refreshedAt=Date.now()-2*60000;
document.getElementById('gdAsAt').textContent='Data as at '+fmtDate(String(SYS.pulled_at).slice(0,10))+' '+String(SYS.pulled_at).slice(11,16);
function syncRefreshed(){
  const m=Math.max(0,Math.round((Date.now()-refreshedAt)/60000));
  document.getElementById('gdRefreshedAt').textContent = m<1?'Refreshed just now':m===1?'Refreshed 1 min ago':'Refreshed '+m+' min ago';
}
setInterval(syncRefreshed,60000); syncRefreshed();
document.getElementById('gdRefresh').addEventListener('click',function(){
  this.classList.add('spin');
  const self=this;
  setTimeout(function(){ self.classList.remove('spin'); refreshedAt=Date.now(); syncRefreshed(); },700);
});
/* Snapshot — the print stylesheet already drops the chrome and expands every
   page, so the browser's own "Save as PDF" is the capture. */
document.getElementById('gdSnap').addEventListener('click',function(){ closePop(); closeDlMenu(); window.print(); });
document.getElementById('gdBack').addEventListener('click',function(e){ e.preventDefault(); });

/* ---- boot ---- */
(function(){
  const h=location.hash.match(/#\/(\w+)\/(\d+)(?:\/(.+))?/);
  if(h&&PAGES[h[1]]){ S.page=h[1]; S.tab=+h[2]; if(h[3]) S.theme=decodeURIComponent(h[3]); }
  ensurePackPeriod();
  render();
})();
</script>
</body>
