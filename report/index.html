<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iNOPS Dashboard — Wireframes</title>
<style>
:root{
  /* ---- Amazon iNOPS brand ---- */
  --az-ink:#232F3E; --az-ink-deep:#131A22; --az-orange:#FF9900; --az-orange-600:#E47911;
  --az-blue:#146EB4; --az-blue-700:#0F5288;

  --gray-50:#F9FAFB;--gray-100:#F3F4F6;--gray-200:#E5E7EB;--gray-300:#D1D5DB;--gray-400:#9CA3AF;
  --gray-500:#6B7280;--gray-600:#4B5563;--gray-700:#374151;--gray-800:#1F2937;--gray-900:#111827;

  --blue-50:#EDF4FB;--blue-100:#D6E7F6;--blue-200:#B4D2EE;
  --orange-50:#FFF8EC;--orange-100:#FDEBCE;

  /* Categorical data hues — validated (lightness band, chroma floor,
     CVD separation, normal-vision floor, contrast). Assigned in fixed
     order, never cycled. Amazon orange #FF9900 is BRAND ONLY — it fails
     the contrast and lightness checks as a data hue. */
  --c1:#146EB4; --c2:#C7511F; --c3:#067D62; --c4:#8C4799; --c5:#946200;

  /* Status — reserved, never reused as a series colour. */
  --ok:#1E7B34; --ok-bg:#E8F4EA; --warn:#B45309; --warn-bg:#FEF3C7;
  --bad:#B42318; --bad-bg:#FEE4E2; --none:#6B7280; --none-bg:#F3F4F6;

  /* Sequential ramp (single hue, light→dark) for choropleth + heat cells. */
  --s1:#EDF4FB;--s2:#D6E7F6;--s3:#A9CCEA;--s4:#6FA8D6;--s5:#3B82BF;--s6:#1D5F9C;--s7:#0C3D6B;

  --shadow-1:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.06);
  --shadow-2:0 4px 12px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
  --shadow-3:0 12px 24px rgba(0,0,0,.12),0 4px 8px rgba(0,0,0,.06);
  --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --ease-out:cubic-bezier(0,0,.2,1);
  --sidebar:208px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--gray-50);color:var(--gray-900);font-size:13px;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
a{color:var(--az-blue)}

/* ===== topbar ===== */
.gd-topbar{display:flex;align-items:center;gap:14px;height:46px;padding:0 18px;background:var(--az-ink);color:#fff;position:sticky;top:0;z-index:60}
.gd-back{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#AAB7B8;text-decoration:none;padding:5px 9px;border-radius:6px}
.gd-back:hover{background:rgba(255,255,255,.08);color:#fff}
.gd-wordmark{font-size:17px;font-weight:700;letter-spacing:-.5px;padding-left:14px;border-left:1px solid #3B4859}
.gd-wordmark .smile{color:var(--az-orange)}
.gd-topbar-title{font-size:12.5px;color:#D5DBDB}
.gd-topbar-spacer{flex:1}
.gd-topbar-meta{display:flex;align-items:center;gap:12px;font-size:11.5px;color:#AAB7B8}
.gd-refresh{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);border:1px solid #3B4859;color:#D5DBDB;font-size:11.5px;padding:5px 10px;border-radius:6px;cursor:pointer}
.gd-refresh:hover{background:rgba(255,255,255,.16);color:#fff}
a.gd-refresh{text-decoration:none}
.gd-refresh svg{transition:transform .5s var(--ease-out)}
.gd-refresh.spin svg{transform:rotate(360deg)}
.gd-topbar-user{padding-left:12px;border-left:1px solid #3B4859}

/* ===== shell ===== */
.shell{display:flex;min-height:calc(100vh - 46px)}
.fsidebar{width:var(--sidebar);flex-shrink:0;background:#fff;border-right:1px solid var(--gray-200);padding:14px 0;position:sticky;top:46px;height:calc(100vh - 46px);overflow-y:auto}
.fsb-brand{padding:4px 18px 14px}
.fsb-brand b{display:block;font-size:13px;color:var(--gray-900)}
.fsb-brand span{font-size:11px;color:var(--gray-500)}
.nav-item{display:flex;align-items:center;gap:9px;margin:2px 8px;padding:9px 10px;border-radius:8px;font-size:12.5px;line-height:1.3;color:var(--gray-600);cursor:pointer;border:none;background:none;width:calc(100% - 16px);text-align:left;transition:background 150ms,color 150ms}
.nav-item svg{width:16px;height:16px;flex-shrink:0}
.nav-item:hover{background:var(--gray-100);color:var(--gray-800)}
.nav-item.active{background:var(--az-ink);color:#fff;font-weight:600}
.nav-item.active svg{color:var(--az-orange)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.pagehead{background:#fff;border-bottom:1px solid var(--gray-200);padding:16px 22px 0}
.pagehead h1{font-size:21px;font-weight:700;color:var(--gray-900)}
.pagehead .ph-sub{font-size:12px;color:var(--gray-500);margin-top:3px}
.top-tabs{display:flex;overflow-x:auto;margin-top:12px}
.tab{padding:11px 16px;font-size:13.5px;font-weight:500;color:var(--gray-500);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--gray-700)}
.tab.on{color:var(--az-ink);border-bottom-color:var(--az-orange);font-weight:600}

/* ===== filter strip ===== */
.filter-strip{display:flex;flex-direction:column;row-gap:8px;padding:10px 22px;background:#fff;border-bottom:1px solid var(--gray-200)}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%}
.frow .freset{margin-left:auto}
.fsearch{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;flex:1;min-width:220px;max-width:340px;border:1px solid var(--gray-200);border-radius:8px;background:#fff}
.fsearch:focus-within{border-color:var(--az-orange);box-shadow:0 0 0 3px var(--orange-100)}
.fsearch svg{width:14px;height:14px;color:var(--gray-400);flex-shrink:0}
.fsearch input{border:none;outline:none;font-family:inherit;font-size:13px;color:var(--gray-800);width:100%;background:none}
.fpill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 4px 0 10px;flex-shrink:0;border:1px solid var(--gray-200);border-radius:8px;background:#fff;cursor:pointer}
.fpill:hover{border-color:var(--gray-300)}
.fpill:focus-within{border-color:var(--az-orange);box-shadow:0 0 0 3px var(--orange-100)}
.fpill.on{border-color:var(--az-orange);background:var(--orange-50)}
.fpill > span{font-size:10.5px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.fpill select{border:none;outline:none;background:none;font-family:inherit;font-size:12.5px;font-weight:500;color:var(--gray-800);cursor:pointer;padding-right:2px;max-width:190px}
.segmented{display:inline-flex;background:var(--gray-100);border-radius:8px;padding:2px;height:32px;flex-shrink:0}
.segmented button{border:none;background:none;padding:0 11px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--gray-500);cursor:pointer}
.segmented button:hover{color:var(--gray-700)}
.segmented button.on{background:#fff;color:var(--az-ink);font-weight:600;box-shadow:var(--shadow-1)}
.freset{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;flex-shrink:0;border:none;border-radius:8px;background:var(--orange-50);color:var(--az-orange-600);font-size:12.5px;font-weight:600;cursor:pointer}
.freset:hover{background:var(--orange-100)}
.freset .badge{background:var(--az-orange-600);color:#fff;border-radius:99px;padding:0 6px;font-size:11px}
.fscope{font-size:11px;color:var(--gray-500);padding:0 2px}
.fscope b{color:var(--gray-700)}
[data-f].hide{display:none!important}

/* ===== page + cards ===== */
.page{padding:18px 22px 60px;display:none}
.page.on{display:block}
.rowhd{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.rowhd h2{font-size:13px;font-weight:700;color:var(--gray-800)}
.rowhd .rh-sub{font-size:11.5px;color:var(--gray-500)}
.rowhd .sp{flex:1}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px;margin-bottom:16px}
.kpi-card{background:#fff;border-radius:12px;box-shadow:var(--shadow-1);padding:16px 18px;display:flex;flex-direction:column;gap:5px;cursor:pointer;transition:box-shadow 200ms,transform 150ms var(--ease-out);border:1px solid transparent;position:relative}
.kpi-card:hover{box-shadow:var(--shadow-2);transform:translateY(-1px);border-color:var(--gray-200)}
.kpi-card .go{position:absolute;top:14px;right:14px;color:var(--gray-300)}
.kpi-card:hover .go{color:var(--az-blue)}
.kpi-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--blue-50);color:var(--az-blue);margin-bottom:3px}
.kpi-icon svg{width:16px;height:16px}
.kpi-number{font-size:26px;font-weight:700;color:var(--gray-900);line-height:1.1}
.kpi-number .unit{font-size:14px;font-weight:600;color:var(--gray-400)}
.kpi-label{font-size:12.5px;color:var(--gray-500);min-height:32px}
.kpi-delta{font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:4px}
.up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--gray-500)}
.kpi-bar{height:5px;background:var(--gray-100);border-radius:99px;overflow:hidden;margin-top:6px}
.kpi-bar i{display:block;height:100%;border-radius:99px}

.card{background:#fff;border-radius:12px;box-shadow:var(--shadow-1);margin-bottom:16px;overflow:visible}
.card-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 18px 0}
.card-title{font-size:14px;font-weight:700;color:var(--gray-900)}
.card-hd .sub{font-size:11.5px;color:var(--gray-500);margin-top:2px;line-height:1.5}
.card-bd{padding:14px 18px 18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid32{display:grid;grid-template-columns:3fr 2fr;gap:16px}
@media(max-width:1080px){.grid2,.grid32{grid-template-columns:1fr}}

/* ===== download control ===== */
.cardtools{display:flex;align-items:center;gap:6px;flex-shrink:0}
.dlbtn{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 8px;border:1px solid var(--gray-200);background:#fff;border-radius:7px;color:var(--gray-600);cursor:pointer}
.dlbtn:hover{border-color:var(--az-blue);color:var(--az-blue);background:var(--blue-50)}
.dlmenu{position:fixed;z-index:120;background:#fff;border:1px solid var(--gray-200);border-radius:9px;box-shadow:var(--shadow-3);padding:5px;display:none;min-width:168px}
.dlmenu.on{display:block}
.dlmenu button{display:flex;align-items:center;gap:8px;width:100%;border:none;background:none;text-align:left;font-size:12.5px;color:var(--gray-700);padding:7px 9px;border-radius:6px;cursor:pointer}
.dlmenu button:hover{background:var(--gray-100)}
.dlmenu .hd{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--gray-400);padding:5px 9px 3px;font-weight:700}

/* ===== info popover ===== */
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:1px solid var(--gray-200);background:#fff;border-radius:50%;color:var(--gray-400);cursor:pointer;flex-shrink:0;padding:0}
.ibtn:hover{border-color:var(--az-blue);color:var(--az-blue);background:var(--blue-50)}
.kpi-card .ibtn{position:absolute;top:12px;right:12px;width:20px;height:20px}
.pop{position:fixed;z-index:130;background:#fff;border:1px solid var(--gray-200);border-radius:11px;box-shadow:var(--shadow-3);padding:14px 16px;display:none;width:320px;max-width:92vw}
.pop.on{display:block}
.pop h4{font-size:13px;font-weight:700;margin-bottom:8px;padding-right:18px}
.pop dt{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-400);font-weight:700;margin-top:9px}
.pop dd{font-size:12px;line-height:1.55;color:var(--gray-700);margin-top:2px}
.pop .x{position:absolute;top:10px;right:10px;border:none;background:none;color:var(--gray-400);cursor:pointer;font-size:13px;line-height:1}

/* ===== theme tiles ===== */
.tile-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(296px,1fr));gap:14px}
.tile{background:#fff;border-radius:12px;box-shadow:var(--shadow-1);border-top:3px solid var(--gray-300);padding:16px 18px 12px;cursor:pointer;transition:box-shadow 200ms,transform 150ms var(--ease-out)}
.tile:hover{box-shadow:var(--shadow-2);transform:translateY(-1px)}
.tile-hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.tile-ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tile-ic svg{width:17px;height:17px}
.tile-hd b{font-size:14px;font-weight:700;flex:1;line-height:1.25}
.tile-chip{background:var(--gray-100);color:var(--gray-600);border-radius:99px;padding:2px 9px;font-size:11px;font-weight:600;white-space:nowrap}
.tile-row{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;font-size:12.5px;color:var(--gray-500)}
.tile-row b{font-size:13.5px;color:var(--gray-900);font-variant-numeric:tabular-nums}
.tile-row.big b{font-size:19px}
.tile-prog{margin:6px 0 2px}
.tile-prog .lbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--gray-500);margin-bottom:4px}
.tile-prog .tr{height:7px;background:var(--gray-100);border-radius:99px;overflow:hidden;position:relative}
.tile-prog .tr i{display:block;height:100%;border-radius:99px}
.tile-ft{display:flex;align-items:center;gap:8px;border-top:1px solid var(--gray-100);margin-top:11px;padding-top:9px;font-size:11.5px;color:var(--gray-500)}
.tile-ft .dot{width:8px;height:8px;border-radius:99px;flex-shrink:0}
.tile-ft .go{margin-left:auto;color:var(--az-blue);font-weight:600}

/* ===== indicator cards (theme detail) ===== */
.icard-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:14px}
.icard{background:#fff;border-radius:12px;box-shadow:var(--shadow-1);padding:15px 17px 13px;border:1px solid transparent;cursor:pointer;transition:box-shadow 200ms,transform 150ms var(--ease-out)}
.icard:hover{box-shadow:var(--shadow-2);transform:translateY(-1px);border-color:var(--gray-200)}
.icard-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.icard-id{background:var(--az-ink);color:#fff;border-radius:6px;padding:2px 7px;font-size:10.5px;font-weight:700;letter-spacing:.03em}
.icard-n{font-size:12.5px;font-weight:600;color:var(--gray-800);line-height:1.35;margin-bottom:10px;min-height:34px}
.icard-big{display:flex;align-items:baseline;gap:8px}
.icard-big b{font-size:24px;font-weight:700;line-height:1.05}
.icard-big span{font-size:11.5px;color:var(--gray-500)}
.icard-mini{display:flex;gap:4px;margin-top:10px}
.icard-mini div{flex:1;text-align:center;background:var(--gray-50);border-radius:6px;padding:5px 2px}
.icard-mini span{display:block;font-size:9.5px;color:var(--gray-400);text-transform:uppercase;letter-spacing:.04em}
.icard-mini b{font-size:11.5px;font-variant-numeric:tabular-nums}
.icard-ft{display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:9px;border-top:1px solid var(--gray-100);font-size:11px;color:var(--gray-500)}
.icard-ft .go{margin-left:auto;color:var(--az-blue);font-weight:600}

.crumbnav{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.backbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border:1px solid var(--gray-200);background:#fff;border-radius:8px;font-size:12.5px;color:var(--gray-700);cursor:pointer}
.backbtn:hover{border-color:var(--az-orange);color:var(--az-orange-600)}

/* ===== tables ===== */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--gray-50);color:var(--gray-600);text-align:left;padding:8px 10px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;border-bottom:1px solid var(--gray-200)}
td{padding:7px 10px;border-bottom:1px solid var(--gray-100);white-space:nowrap}
tbody tr[data-drill]{cursor:pointer}
tbody tr[data-drill]:hover td{background:var(--blue-50)}
tr.grouprow td{background:var(--gray-100);font-weight:700;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--az-ink)}
tr.totalrow td{background:var(--orange-50);font-weight:700;border-top:2px solid var(--az-orange)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--gray-400)}

.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:700}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)} .p-none{background:var(--none-bg);color:var(--none)}
.flag{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:11px}
.flag i{width:8px;height:8px;border-radius:2px;display:inline-block}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--gray-600);margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.note{background:var(--blue-50);border-left:3px solid var(--az-blue);border-radius:0 8px 8px 0;padding:10px 12px;font-size:12px;color:var(--gray-700);line-height:1.55;margin-top:12px}
.note.warn{background:var(--warn-bg);border-left-color:var(--warn)}
.note.bad{background:var(--bad-bg);border-left-color:var(--bad)}
.note b{color:var(--gray-900)}

.srcbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:10.5px;color:var(--gray-500);padding:8px 18px;background:var(--gray-50);border-top:1px solid var(--gray-100);border-radius:0 0 12px 12px}
.srctag{background:#fff;border:1px solid var(--gray-200);border-radius:99px;padding:1px 8px;font-weight:600}
.srctag.live{border-color:var(--ok);color:var(--ok)}
.srctag.sheet{border-color:var(--az-blue);color:var(--az-blue)}
.srctag.none{border-color:var(--bad);color:var(--bad)}

/* ===== drawer ===== */
.scrim{position:fixed;inset:0;background:rgba(19,26,34,.42);opacity:0;pointer-events:none;transition:opacity 200ms;z-index:80}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;width:min(820px,96vw);height:100vh;background:#fff;box-shadow:var(--shadow-3);transform:translateX(100%);transition:transform 260ms var(--ease-out);z-index:90;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer-hd{padding:16px 20px;border-bottom:1px solid var(--gray-200);display:flex;align-items:flex-start;gap:12px}
.drawer-hd .dic{width:34px;height:34px;border-radius:9px;background:var(--blue-50);color:var(--az-blue);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.drawer-hd .dic svg{width:17px;height:17px}
.drawer-hd .eyebrow{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--gray-400)}
.drawer-hd h3{font-size:16px;font-weight:700;line-height:1.25}
.drawer-hd .sub{font-size:11.5px;color:var(--gray-500);margin-top:3px}
.drawer-hd .sp{flex:1}
.drawer-x{border:none;background:var(--bad-bg);width:28px;height:28px;border-radius:7px;cursor:pointer;font-size:14px;color:var(--bad);flex-shrink:0}
.drawer-bd{padding:16px 20px 30px;overflow-y:auto;flex:1;background:var(--gray-50)}
.dpanel{background:#fff;border-radius:11px;box-shadow:var(--shadow-1);margin-bottom:14px;overflow:hidden}
.dpanel-hd{padding:13px 16px 0;font-size:13px;font-weight:700}
.dpanel-bd{padding:11px 16px 14px}
.dpanel-bd.flush{padding:0}
.dscroll{max-height:400px;overflow:auto}
.dfoot{padding:9px 16px;font-size:11.5px;color:var(--gray-500);border-top:1px solid var(--gray-100);background:var(--gray-50)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:9px}
.statgrid div{background:var(--gray-50);border-radius:9px;padding:9px 11px}
.statgrid span{display:block;font-size:10.5px;color:var(--gray-500);margin-bottom:2px}
.statgrid b{font-size:16px;font-variant-numeric:tabular-nums}
.crumb{font-size:11px;color:var(--gray-500);margin-bottom:8px}
.crumb b{color:var(--az-blue)}

/* ===== chart primitives (inline SVG / CSS — no external libs) ===== */
.hbar{display:flex;align-items:center;gap:10px;margin:9px 0;cursor:pointer;padding:2px 4px;border-radius:6px}
.hbar:hover{background:var(--gray-50)}
.hbar .lb{width:150px;font-size:11.5px;color:var(--gray-700);text-align:right;flex-shrink:0}
.hbar .tr{flex:1;height:16px;background:var(--gray-100);border-radius:4px;overflow:hidden;position:relative}
.hbar .tr i{display:block;height:100%;border-radius:0 4px 4px 0;position:relative;z-index:1}
/* Goal is a pale band behind the bar, not a rule across it — a hairline in the
   middle of a bar reads as a defect, and at 0% it looks like a stray mark. */
.hbar .tr .goal{position:absolute;left:0;top:0;bottom:0;background:var(--gray-300);border-radius:4px;z-index:0}
.hbar .vl{width:96px;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;flex-shrink:0}
.spark{display:inline-flex;align-items:flex-end;gap:2px;height:20px}
.spark i{width:5px;border-radius:1px 1px 0 0;background:var(--gray-300)}
.spark i.hi{background:var(--az-orange)}
.heat td.hc{text-align:center;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.stackbar{display:flex;height:22px;border-radius:4px;overflow:hidden;gap:2px;background:var(--gray-100)}
.stackbar i{display:block;cursor:pointer}
svg .gridline{stroke:var(--gray-200);stroke-width:1}
svg .axis{stroke:var(--gray-300);stroke-width:1}
svg text{font-family:var(--font-sans);fill:var(--gray-500);font-size:10px}
svg text.vlab{fill:var(--gray-700);font-size:10px;font-weight:600}

/* ===== map — chrome mirrors the Vedanta grant-dashboard map card:
   breadcrumb control top-left, hover card top-right, zoom bottom-right,
   ramp legend bottom-left, drag to pan. ===== */
.map-wrap{position:relative;background:#F7F8F8;border:1px solid var(--gray-200);border-radius:10px;overflow:hidden}
.map-wrap svg{display:block;cursor:grab;touch-action:none}
.map-wrap svg.drag{cursor:grabbing}
.map-ctl{position:absolute;top:10px;left:10px;z-index:3;display:flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:calc(100% - 200px)}
.map-crumb{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.94);border:1px solid var(--gray-200);border-radius:8px;padding:5px 9px;font-size:11.5px;box-shadow:var(--shadow-1)}
.map-crumb .step{color:var(--az-blue);cursor:pointer;font-weight:600}
.map-crumb .step:hover{text-decoration:underline}
.map-crumb .cur{color:var(--gray-800);font-weight:700}
.map-crumb i{color:var(--gray-300);font-style:normal}
.map-shade{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.94);border:1px solid var(--gray-200);border-radius:8px;padding:0 6px 0 9px;height:30px;box-shadow:var(--shadow-1)}
.map-shade span{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--gray-500)}
.map-shade select{border:none;background:none;font-family:inherit;font-size:12px;font-weight:600;color:var(--gray-800);cursor:pointer;outline:none}
.map-hover{position:absolute;top:10px;right:10px;z-index:3;width:212px;background:#fff;border:1px solid var(--gray-200);border-radius:10px;box-shadow:var(--shadow-2);padding:11px 13px;display:none}
.map-hover.has-content{display:block}
.map-hover .overline{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--gray-400)}
.map-hover h5{font-size:13.5px;font-weight:700;margin:1px 0 8px}
.gh-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px 10px}
.gh-grid div span{display:block;font-size:9.5px;color:var(--gray-500);text-transform:uppercase;letter-spacing:.04em}
.gh-grid div b{font-size:12.5px;font-variant-numeric:tabular-nums}
.map-zoom{position:absolute;right:10px;bottom:10px;z-index:3;display:flex;flex-direction:column;border-radius:8px;overflow:hidden;box-shadow:var(--shadow-1);border:1px solid var(--gray-200)}
.map-zoom button{width:29px;height:29px;border:none;background:#fff;color:var(--gray-700);font-size:15px;line-height:1;cursor:pointer;border-bottom:1px solid var(--gray-200);padding:0}
.map-zoom button:last-child{border-bottom:none;font-size:11px}
.map-zoom button:hover{background:var(--gray-100);color:var(--az-blue)}
.map-legend{position:absolute;left:10px;bottom:10px;z-index:3;display:flex;align-items:center;gap:3px;background:rgba(255,255,255,.94);border:1px solid var(--gray-200);border-radius:8px;padding:5px 9px;font-size:10px;color:var(--gray-500);box-shadow:var(--shadow-1)}
.map-legend i{width:15px;height:9px;display:inline-block}
.map-legend i:first-of-type{border-radius:2px 0 0 2px}
.map-legend i:last-of-type{border-radius:0 2px 2px 0}
.map-legend b{color:var(--gray-700);font-variant-numeric:tabular-nums}
.map-note{font-size:10.5px;color:var(--gray-500);margin-top:6px}
.map-shade.fin-on{border-color:var(--ok)}
.map-shade.fin-on span,.map-shade.fin-on select{color:var(--ok)}
.fin-strip{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--gray-200);border-radius:9px;overflow:hidden;margin-top:10px;background:#fff}
.fin-strip div{flex:1;min-width:116px;padding:9px 12px;border-right:1px solid var(--gray-100)}
.fin-strip div:last-child{border-right:none}
.fin-strip span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--gray-500)}
.fin-strip b{font-size:14px;font-variant-numeric:tabular-nums}

/* sidebar: Pillar Leads opens into its three pillars */
.nav-group .nav-chev{width:13px;height:13px;margin-left:auto;transition:transform 150ms}
.nav-group[aria-expanded="true"] .nav-chev{transform:rotate(180deg)}
.nav-sub{display:none;margin:2px 8px 6px 26px;border-left:1px solid var(--gray-200);padding-left:6px}
.nav-sub.open{display:block}
.nav-subitem{display:block;width:100%;text-align:left;border:none;background:none;padding:7px 10px;border-radius:7px;font-size:12.5px;color:var(--gray-600);cursor:pointer}
.nav-subitem:hover{background:var(--gray-100);color:var(--gray-800)}
.nav-subitem.on{background:var(--orange-50);color:var(--az-orange-600);font-weight:700}

/* filter bar — primary row + "More" row */
.filter-strip .frow{flex-wrap:wrap}
.fspacer{flex:1}
.fmore-btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border:1px solid var(--gray-200);border-radius:8px;background:#fff;font-size:12.5px;font-weight:600;color:var(--gray-700);cursor:pointer}
.fmore-btn:hover,.fmore-btn.open{border-color:var(--az-orange);color:var(--az-orange-600)}
.fmore-btn .badge{display:none;background:var(--az-orange-600);color:#fff;border-radius:99px;padding:0 6px;font-size:11px}
.fmore-btn svg{transition:transform 150ms}
.fmore-btn.open svg{transform:rotate(180deg)}
.filter-strip{position:relative;z-index:40}
.filter-strip .frow{align-items:center}
.filter-strip .fpill{height:36px;padding:0 6px 0 12px;border-radius:9px}
.filter-strip .fpill select{min-width:120px}
.filter-strip .fpill[data-f="fy"]{border-color:var(--az-blue);background:var(--blue-50)}
.filter-strip .fpill[data-f="fy"] > span,.filter-strip .fpill[data-f="fy"] select{color:var(--az-blue-700)}
.fmore-anchor{position:relative}
.fmore-btn{height:36px;border-radius:9px;padding:0 14px}
.fmore-btn svg{transform:rotate(180deg)}
.fmore-btn.open svg{transform:none}
.fmore{display:none;position:absolute;top:calc(100% + 8px);left:-320px;width:min(760px,calc(100vw - 260px));background:#fff;border:1px solid var(--gray-200);border-radius:14px;box-shadow:var(--shadow-3);padding:16px 20px 20px;z-index:70}
.fmore.on{display:block}
.fmore-hd{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.fmore-hd > span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-500)}
.fmore-hd .fsearch{flex:1;max-width:none;height:34px}
.fmore-segs{display:flex;flex-wrap:wrap;gap:14px 34px;padding-bottom:16px;border-bottom:1px solid var(--gray-100);margin-bottom:16px}
.fseg > span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gray-500);margin-bottom:7px}
.fseg .segmented{height:36px;padding:3px;border-radius:9px}
.fseg .segmented button{padding:0 13px}
.fseg .segmented button.on{color:var(--az-blue)}
.fmore-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.fmore-grid .fpill{width:100%}
.fmore-grid .fpill select{flex:1;max-width:none}
.fmore-grid .hide{display:none!important}
.filter-strip .na{opacity:.42;cursor:not-allowed}
.filter-strip .na select,.filter-strip .na button{cursor:not-allowed}

/* pillar page: project switch + project cards */
.projbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.projbar-l{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--gray-500)}
.projbar .segmented{height:auto;flex-wrap:wrap}
.projbar .segmented button{height:28px}
.pcard-grid-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.pcard{background:#fff;border-radius:12px;box-shadow:var(--shadow-1);border-top:3px solid var(--gray-300);padding:15px 17px 12px;cursor:pointer;transition:box-shadow 200ms,transform 150ms var(--ease-out)}
.pcard:hover{box-shadow:var(--shadow-2);transform:translateY(-1px)}
.pcard-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.pcard-hd b{font-size:13.5px;line-height:1.35}
.pcard-sub{font-size:11px;color:var(--gray-500);margin:4px 0 10px}
.pcard-big{display:flex;align-items:baseline;gap:7px}
.pcard-big b{font-size:24px;font-weight:700;line-height:1.1}
.pcard-big span{font-size:11.5px;color:var(--gray-500)}
.pcard-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.pcard-grid div{background:var(--gray-50);border-radius:7px;padding:6px 8px}
.pcard-grid span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--gray-400)}
.pcard-grid b{font-size:12.5px;font-variant-numeric:tabular-nums}
.pcard-ft{display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:9px;border-top:1px solid var(--gray-100);font-size:11px;color:var(--gray-500)}
.pcard-ft .go{margin-left:auto;color:var(--az-blue);font-weight:600;white-space:nowrap}

/* map control row stays on one line: crumb · shade by · financials toggle */
.map-ctl{flex-wrap:nowrap;max-width:calc(100% - 60px)}
.map-fin{display:inline-flex;align-items:center;gap:5px;height:30px;min-width:30px;justify-content:center;padding:0 8px;background:rgba(255,255,255,.94);border:1px solid var(--gray-200);border-radius:8px;box-shadow:var(--shadow-1);color:var(--gray-400);cursor:pointer;flex-shrink:0}
.map-fin:hover{color:var(--gray-700);border-color:var(--gray-300)}
.map-fin.on{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.map-fin span{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}

/* donut + share table */
.share-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px}
.share-ring{flex:0 0 auto;margin:0 auto}
.share-wrap > div:last-child{flex:1 1 300px;min-width:0}
.share-tbl td{padding:8px 10px}
.share-tbl tbody tr[data-drill]{cursor:pointer}
.share-tbl tbody tr[data-drill]:hover td{background:var(--blue-50)}
.sharebar{display:inline-block;vertical-align:middle;width:72px;height:8px;background:var(--gray-100);border-radius:99px;overflow:hidden;margin-right:7px}
.sharebar i{display:block;height:100%;border-radius:99px}
.sharepct{font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--gray-600)}

/* drawer view switch (By Business Unit | Partner | BU-Site) */
.dview-hd{display:flex;align-items:center;gap:9px;padding-bottom:11px}
.dview-hd > span{font-size:13px;font-weight:700}
.segmented.dview{height:28px}
.segmented.dview button{font-size:12px;padding:0 10px}
tr.subrow td{background:var(--gray-50);font-weight:700;border-top:1px solid var(--gray-200)}

.empty{padding:26px;text-align:center;color:var(--gray-500);font-size:12.5px;background:var(--gray-50);border:1px dashed var(--gray-300);border-radius:10px}
.empty b{display:block;color:var(--gray-700);font-size:13px;margin-bottom:4px}

/* ===== Vedanta theme-detail KPI pattern ===== */
.rag{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.rag div{background:#fff;border-radius:11px;box-shadow:var(--shadow-1);padding:12px 15px}
.rag b{display:block;font-size:24px;font-weight:700;line-height:1.1;margin-bottom:3px}
.rag span{font-size:11.5px;font-weight:700;margin-right:6px}
.rag em{font-style:normal;font-size:11px;color:var(--gray-500)}
.kpi-lines{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-bottom:18px}
.kpi-line{background:#fff;border-radius:11px;box-shadow:var(--shadow-1);padding:13px 15px;cursor:pointer;border:1px solid transparent;transition:box-shadow 200ms}
.kpi-line:hover{box-shadow:var(--shadow-2);border-color:var(--gray-200)}
.kpi-line-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:7px}
.kpi-line-hd h5{font-size:12.5px;font-weight:600;color:var(--gray-800);line-height:1.4}
.chip{display:inline-block;white-space:nowrap;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:600;background:var(--gray-100);color:var(--gray-600)}
.prog{height:7px;background:var(--gray-100);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px}
.secondary{font-size:12px;color:var(--gray-500)} .secondary b{color:var(--gray-800)}
.caption{font-size:11px;color:var(--gray-500)}
.lnk{color:var(--az-blue);font-weight:600}
@media(max-width:720px){.rag{grid-template-columns:repeat(2,1fr)}}

@media print{
  .gd-topbar,.fsidebar,.filter-strip,.drawer,.scrim{display:none!important}
  .page{display:block!important;page-break-after:always}
  body{background:#fff}
}
</style>
</head>
<body>

    </button>

    </a>
    <span class="gd-topbar-user">Diksha Hazarika</span>

</div>

<div class="shell">
  <aside class="fsidebar">
    <div class="fsb-brand"><b>Amazon IN Ops</b><span>CSR · mGrant</span></div>
    <button class="nav-item active" data-page="lead">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Leadership Overview</button>
    <button class="nav-item" data-page="fin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12"/><path d="M6 9h12"/><path d="M14 20L7 13h3a4 4 0 000-8"/></svg>
      Financial Overview</button>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 6.5 7 .9-5 4.9 1.2 7L12 18l-6.2 3.3L7 14.3l-5-4.9 7-.9z"/></svg>
      Programme Overview</button>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/></svg>
      Pillar Leads Overview<svg class="nav-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>

          <div class="fmore" id="fMore">
            <div class="fmore-hd"><span>Refine</span>
              <div class="fsearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input type="search" id="fSearch" placeholder="Search indicators, partners, sites…"></div>

<script>
/* ============================================================
   iNOPS Dashboard — wireframe v1.6 (system data)
   Structure mirrors the Vedanta grant-dashboard (rail → pagehead →
   tabs → two-row filter strip → page, plus drawer drill-down).
   Every figure on screen is computed from FACTS, so every filter
   genuinely re-slices the page. Charts are inline SVG/CSS so the
   file renders with no network.
   ============================================================ */

const F = n => n==null ? '—' : Math.round(n).toLocaleString('en-IN');
const PCT = n => n==null ? '—' : (n*100).toFixed(0)+'%';

function ragPill(p){
  if(p==null) return '<span class="pill p-none">No goal</span>';
  if(p>=1)    return '<span class="pill p-ok">'+PCT(p)+' &#10003;</span>';
  if(p>=0.8)  return '<span class="pill p-warn">'+PCT(p)+' !</span>';
  return '<span class="pill p-bad">'+PCT(p)+' &#9660;</span>';
}
function ragBarColor(p){ return p==null?'var(--gray-300)':p>=1?'var(--ok)':p>=0.8?'var(--warn)':'var(--bad)'; }
function ragDot(p){ return p==null?'var(--gray-300)':p>=1?'var(--ok)':p>=0.8?'var(--warn)':'var(--bad)'; }

const DL={}; let dlSeq=0;
function reg(name,cols,rows){ const id='dl'+(++dlSeq); DL[id]={name:name,cols:cols,rows:rows}; return id; }
const ICO_DL='<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 21h16"/></svg>';

  if(!id) return '';

function csvEsc(v){ v=(v==null?'':String(v)); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function htmlEsc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function doDownload(id,fmt){
  const d=DL[id]; if(!d) return;
  const stamp=new Date().toISOString().slice(0,10);
  const fname='iNOPS_'+d.name.replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_')+'_'+stamp;
  let blob,ext;
  if(fmt==='csv'){
    const txt=[d.cols.join(',')].concat(d.rows.map(r=>r.map(csvEsc).join(','))).join('\r\n');
    blob=new Blob(['﻿'+txt],{type:'text/csv;charset=utf-8;'}); ext='csv';
  }else{
    const html='<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"></head><body>'+
      '<table border="1"><thead><tr>'+d.cols.map(c=>'<th>'+htmlEsc(c)+'</th>').join('')+'</tr></thead><tbody>'+
      d.rows.map(r=>'<tr>'+r.map(c=>'<td>'+htmlEsc(c)+'</td>').join('')+'</tr>').join('')+
      '</tbody></table><p>Source: iNOPS Dashboard wireframe · '+htmlEsc(d.name)+' · exported '+stamp+'</p></body></html>';
    blob=new Blob(['﻿'+html],{type:'application/vnd.ms-excel;charset=utf-8;'}); ext='xls';
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname+'.'+ext;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
}

/* ---------- horizontal bar with optional target marker ---------- */
function hbar(label,val,max,color,valText,drill,targetPct){
  const w = max? Math.max(val>0?1:0,(val/max)*100) : 0;
  return '<div class="hbar" '+(drill?'data-drill="'+drill+'"':'')+'>'+
    '<div class="lb">'+label+'</div>'+
    '<div class="tr">'+
      (targetPct!=null?'<span class="goal" style="width:'+Math.min(100,Math.max(0,targetPct*100))+'%"></span>':'')+
      '<i style="width:'+w+'%;background:'+color+'"></i>'+
    '</div>'+
    '<div class="vl">'+(valText!=null?valText:F(val))+'</div></div>';
}

/* Nice axis top: 1 / 2 / 2.5 / 5 x 10^k, so ticks read 0 · 10k · 20k · 30k. */
function niceMax(v){
  if(v<=0) return 4;
  const k=Math.pow(10,Math.floor(Math.log10(v)));
  const r=v/k;
  const step=r<=1?1:r<=2?2:r<=2.5?2.5:r<=5?5:10;
  return step*k;
}

function groupedBars(cats, series, opts){
  opts=opts||{};
  const W=opts.w||520,H=opts.h||190,PL=48,PB=28,PT=10,PR=8;
  const iw=W-PL-PR, ih=H-PT-PB;
  const max=Math.max(1,...series.flatMap(s=>s.data));
  const nice=niceMax(max);
  const gw=iw/cats.length, bw=Math.max(5,Math.min(22,(gw-10)/series.length));
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-height:'+H+'px" preserveAspectRatio="xMidYMid meet" role="img">';
  for(let i=0;i<=4;i++){const y=PT+ih-(ih*i/4);
    s+='<line class="gridline" x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'"/>';
    s+='<text x="'+(PL-6)+'" y="'+(y+3)+'" text-anchor="end">'+F(Math.round(nice*i/4))+'</text>';}
  cats.forEach((c,ci)=>{
    series.forEach((se,si)=>{
      const v=se.data[ci]||0, h=(v/nice)*ih;
      const x=PL+ci*gw+(gw-bw*series.length-2*(series.length-1))/2+si*(bw+2);
      s+='<rect x="'+x+'" y="'+(PT+ih-h)+'" width="'+bw+'" height="'+Math.max(0,h)+'" rx="3" fill="'+se.color+'"><title>'+se.name+' · '+c+': '+F(v)+'</title></rect>';
    });
    s+='<text x="'+(PL+ci*gw+gw/2)+'" y="'+(H-9)+'" text-anchor="middle">'+c+'</text>';
  });
  s+='<line class="axis" x1="'+PL+'" y1="'+(PT+ih)+'" x2="'+(W-PR)+'" y2="'+(PT+ih)+'"/></svg>';
  return s;
}

function lineChart(cats, series, opts){
  opts=opts||{};
  const W=opts.w||520,H=opts.h||190,PL=50,PB=26,PT=10,PR=12;
  const iw=W-PL-PR, ih=H-PT-PB;
  const max=Math.max(1,...series.flatMap(s=>s.data));
  const nice=niceMax(max);
  const px=i=>PL+(cats.length===1?iw/2:(iw*i/(cats.length-1)));
  const py=v=>PT+ih-(v/nice)*ih;
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-height:'+H+'px" preserveAspectRatio="xMidYMid meet" role="img">';
  for(let i=0;i<=4;i++){const y=PT+ih-(ih*i/4);
    s+='<line class="gridline" x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'"/>';
    s+='<text x="'+(PL-6)+'" y="'+(y+3)+'" text-anchor="end">'+F(Math.round(nice*i/4))+'</text>';}
  cats.forEach((c,i)=>s+='<text x="'+px(i)+'" y="'+(H-8)+'" text-anchor="middle">'+c+'</text>');
  series.forEach(se=>{
    const d=se.data.map((v,i)=>(i?'L':'M')+px(i)+' '+py(v)).join(' ');
    s+='<path d="'+d+'" fill="none" stroke="'+se.color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"'+(se.dash?' stroke-dasharray="5 4"':'')+'/>';
    se.data.forEach((v,i)=>{ s+='<circle cx="'+px(i)+'" cy="'+py(v)+'" r="4" fill="'+se.color+'" stroke="#fff" stroke-width="2"><title>'+se.name+' · '+cats[i]+': '+F(v)+'</title></circle>'; });
  });
  s+='<line class="axis" x1="'+PL+'" y1="'+(PT+ih)+'" x2="'+(W-PR)+'" y2="'+(PT+ih)+'"/></svg>';
  return s;
}

function donut(items,opts){
  const leg='<div style="display:flex;flex-direction:column;gap:6px;min-width:200px">'+items.map(it=>
    '<span style="display:flex;align-items:center;gap:7px;font-size:11.5px"><i style="width:10px;height:10px;border-radius:3px;background:'+it.c+'"></i>'+it.k+' <b style="margin-left:auto;font-variant-numeric:tabular-nums">'+F(it.v)+'</b></span>').join('')+'</div>';
  return '<div class="donut-wrap">'+donutSvg(items,opts)+leg+'</div>';
}
/* Donut beside a share table — swatch, name, value, share bar, then whatever
   extra columns the card carries. Every row is one line, aligned, clickable. */
function shareBlock(items,opts){
  opts=opts||{};
  const tot=items.reduce((a,b)=>a+(b.v>0?b.v:0),0)||1;
  const cols=opts.cols||['Name','Value','Share'];
  const tbl='<table class="share-tbl"><thead><tr><th>'+cols[0]+'</th><th class="num">'+cols[1]+'</th><th>'+cols[2]+'</th>'+
    cols.slice(3).map(c=>'<th class="num">'+c+'</th>').join('')+'</tr></thead><tbody>'+
    items.map(it=>'<tr'+(it.drill?' data-drill="'+it.drill+'"':'')+'><td><span class="flag" style="font-weight:600;font-size:12px"><i style="background:'+it.c+'"></i>'+it.k+'</span></td>'+
      '<td class="num"><b>'+(it.fmt||F(it.v))+'</b></td><td>'+shareBar(it.v>0?it.v/tot:0,it.c)+'</td>'+
      (it.extra||[]).map(x=>'<td class="num">'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
  return '<div class="share-wrap"><div class="share-ring">'+donutSvg(items.filter(it=>it.v>0),Object.assign({size:168},opts))+'</div><div style="overflow-x:auto">'+tbl+'</div></div>';
}
function donutSvg(items,opts){
  opts=opts||{}; const R=54,r=33,cx=68,cy=68, sz=opts.size||136;
  const tot=items.reduce((a,b)=>a+b.v,0)||1;
  let a0=-Math.PI/2, s='<svg viewBox="0 0 136 136" width="'+sz+'" height="'+sz+'" role="img">';
  items.forEach(it=>{
    const a1=a0+(it.v/tot)*Math.PI*2, big=(a1-a0)>Math.PI?1:0;
    const p=(ra,an)=>[cx+ra*Math.cos(an),cy+ra*Math.sin(an)];
    const q0=p(R,a0),q1=p(R,a1),q2=p(r,a1),q3=p(r,a0);
    s+='<path d="M'+q0[0]+' '+q0[1]+' A'+R+' '+R+' 0 '+big+' 1 '+q1[0]+' '+q1[1]+' L'+q2[0]+' '+q2[1]+' A'+r+' '+r+' 0 '+big+' 0 '+q3[0]+' '+q3[1]+' Z" fill="'+it.c+'" stroke="#fff" stroke-width="2"><title>'+it.k+': '+F(it.v)+'</title></path>';
    a0=a1;
  });
  /* The hole is 2×r wide. A fixed font size spills a long total straight out
     over the ring, so size the centre label to the space it actually has. */
  const ctr=String(opts.center!=null?opts.center:F(tot));
  const sub=String(opts.sub||'total');
  const fit=(txt,max,cap)=>Math.max(8,Math.min(cap,(2*r-8)/(txt.length*0.58)));
  const fs=fit(ctr,0,15), fsub=fit(sub,0,9);
  s+='<text x="68" y="66" text-anchor="middle" style="font-size:'+fs.toFixed(1)+'px;font-weight:700;fill:var(--gray-900)">'+ctr+'</text>';
  s+='<text x="68" y="79" text-anchor="middle" style="font-size:'+fsub.toFixed(1)+'px">'+sub+'</text></svg>';
  return s;
}

/* Integer apportionment, largest remainder — used only to spread the monthly
   goal over Business Units, never to invent an actual. */
function alloc(total,weights){
  const sw=weights.reduce((a,b)=>a+b,0);
  if(!sw||!total) return weights.map(()=>0);
  const raw=weights.map(w=>total*w/sw);
  const base=raw.map(Math.floor);
  let rem=total-base.reduce((a,b)=>a+b,0);
  const order=raw.map((v,i)=>[v-Math.floor(v),i]).sort((a,b)=>b[0]-a[0]);
  for(let k=0;k<order.length&&rem>0;k++){ base[order[k][1]]++; rem--; }
  return base;
}

  if(f.partner!=='All' && r.pt!==f.partner) return false;
  if(!r.goalRow){
    if(f.approval===1 && !r.appr) return false;
    if(f.approval===2 && r.appr) return false;
  }
  if(f.metric===2 && IND_BY[r.ind].meas!=='impacted') return false;
  if(f.metric===1 && IND_BY[r.ind].meas==='impacted') return false;
  if(f.q){
    const q=f.q.toLowerCase();

function group(rows,key){

    if(per==='Q1 · Apr–Jun'){ spent=p.q1u||0; plan=p.q1p||0; }
    else if(per==='Q2 · Jul–Sep'){ spent=p.q2u||0; plan=p.q2p||0; }
    else if(per==='Q3 · Oct–Dec'){ spent=0; plan=p.q3p||0; due=false; }
    else if(per==='Q4 · Jan–Mar'){ spent=0; plan=p.q4p||0; due=false; }
    else { spent=(p.q1u||0)+(p.q2u||0); plan=(p.q1p||0)+(p.q2p||0); }
    const closed=/closed/i.test(p.st||'');
    const pct=due&&plan>0?spent/plan:null;
    const pil=finPillars(p);
    return Object.assign({},p,{ix:ix,cfv:pre?(p.cf||0):0,spent:spent,plan:plan,pct:pct,closed:closed,due:due,pil:pil,ptm:finPartner(p.pt),
      flag:!due?'notdue':pct==null?'noplan':pct<0.8?'low':'ok'});
  }).filter(p=>!p.closed&&(f.ent==='All'||p.ent===f.ent)&&(f.fund==='All'||p.ft===f.fund)&&
    (f.pillar==='All'||p.pil.indexOf(f.pillar)>=0)&&
    (f.charter==='All'||p.pil.some(k=>{ const t=THEMES.find(x=>x.k===k); return t&&CHARTERS[t.ch]===f.charter; }))&&
    (f.partner==='All'||p.ptm===f.partner)&&
    fxQ(p.prog+' '+p.pt+' '+p.ent+' '+p.ft));
}
function finEnt(){
  const f=activeF();
  return FINX.ent.filter(e=>(f.ent==='All'||e.code===f.ent)&&(f.fund==='All'||e.src===f.fund)&&fxQ(e.name+' '+e.src));
}
function entLabel(e){ return e.code||e.name; }
function flagPill(p){
  if(p.flag==='notdue') return '<span class="pill p-none">Not yet due</span>';
  if(p.pct==null) return '<span class="pill p-none">No plan</span>';
  return p.flag==='low'?'<span class="pill p-bad">'+PCT(p.pct)+' &#9660;</span>':'<span class="pill p-ok">'+PCT(p.pct)+' &#10003;</span>';
}
function finGuard(){
  return finOK()?null:emptyBox('No finance tracker for '+S.f.fy,'Amazon\'s financial tracker covers FY 2026-27 (April–March for CSR compliance funds, calendar 2026 for the rest). Switch FY back to FY 26-27.');
}
function fxTotals(){
  const E=finEnt(), P=finProj();
  const scored=P.filter(p=>p.pct!=null), low=scored.filter(p=>p.flag==='low');
  /* budget, carry-forward and unallocated are set per entity — they cannot be
     cut by pillar or partner, so under such a cut they read "—", not a guess */
  const cut=finCut();
  return {E:E,P:P,scored:scored,low:low,cut:cut,
    bud:cut?null:sum(E,e=>e.tot), cf:cut?null:sum(E,e=>e.cf), fyb:cut?null:sum(E,e=>e.fyb), un:cut?null:sum(E,e=>e.unal||0), alloc:cut?null:sum(E,e=>e.alloc||0),
    po:sum(P,p=>p.po||0), rel:sum(P,p=>p.rel||0), sp:sum(P,p=>p.spent),
    gap:sum(low,p=>p.plan-p.spent)};
}

function finOverview(tab){
  if(tab===3) return finPipeline();
  const g=finGuard(); if(g) return g;
  if(tab===1) return finBreakdowns();
  if(tab===2) return finWatch();
  return finConsolidated();
}

let DRV=null;
function finReport(key,view){
  const m=FXM[key]; if(!m) return;
  view=view||'ent';
  DRV={fn:v=>finReport(key,v)};
  const T=fxTotals();
  const keyOf={ent:x=>x.ent||x.code||x.name,ft:x=>x.ft||x.src,pt:x=>x.pt};
  let items=[], note='', unit=m.lab||'Amount', basis;
  if(m.grain==='ent'&&T.cut){
    note='This figure is set per entity and fund, so it cannot be cut by pillar or partner. Clear those filters to see it.';
  }else if(m.grain==='ent'&&view!=='pt'){
    const kf=view==='ent'?entLabel:(e=>e.src);
    items=gby(T.E.map(e=>({k:kf(e),e:e})),r=>r.k).map(o=>({k:o.k,v:sum(o.rows,r=>m.v(r.e)),n:o.rows.length})).filter(o=>o.v);
    basis='fund lines';
  }else if(m.grain==='ent'){
    if(m.pv){
      const P=T.P.filter(p=>m.pv(p));
      items=gby(P.map(p=>Object.assign({k:p.pt},p)),r=>r.k).map(o=>({k:o.k,v:sum(o.rows,m.pv),n:o.rows.length,rows:o.rows}));
      note='By NGO reads the unspent balance carried into 2026 on each grant ("Balance as on 2026", "Project wise"), '+CR(sum(items,o=>o.v))+' in all — the entity sheet puts carry-forward at '+CR(T.cf)+'. The tracker does not reconcile the two.';
      basis='grants';
    }else{
      note=key==='fx-un'?'Unallocated money is, by definition, not yet with an NGO. See Breakdowns → Unallocated funds for the grants earmarked to a project whose NGO is not yet named.'
        :'The 2026 budget is set per entity and fund; it reaches an NGO only once allocated to a grant. Open PO raised, Funds released or Spent for the NGO view.';
    }
  }else{
    const P=T.P.filter(p=>m.only?m.only(p):m.v(p)>0);
    items=gby(P.map(p=>Object.assign({k:keyOf[view](p)},p)),r=>r.k).map(o=>({k:o.k,v:sum(o.rows,m.v),n:o.rows.length,rows:o.rows}));
    basis='grants';
  }
  items.sort((a,b)=>b.v-a.v);
  const tot=sum(items,o=>o.v);
  const G=FX_VIEWS[view];
  const dl=reg(m.t+' — by '+G,[G,basis==='grants'?'Grants':'Fund lines',unit,'Share'],items.map(o=>[o.k,o.n,o.v,tot?PCT1(o.v/tot):'']));
  const body='<div class="dpanel"><div class="dpanel-hd dview-hd"><span>By</span>'+viewSwitch(['ent','ft','pt'],view,FX_VIEWS)+'</div><div class="dpanel-bd flush">'+
    (items.length?'<div class="dscroll"><table><thead><tr><th>'+G+'</th><th class="num">'+(basis==='grants'?'Grants':'Fund lines')+'</th><th class="num">'+unit+'</th><th>Share</th></tr></thead><tbody>'+
      items.map((o,ix)=>'<tr'+(o.rows?' data-drill="fxset:'+subId(o.rows)+'|'+htmlEsc(m.t+' · '+o.k)+'"':'')+'><td style="white-space:normal">'+(o.rows?'<span class="lnk">'+htmlEsc(o.k)+'</span>':'<b>'+htmlEsc(o.k)+'</b>')+'</td>'+
        '<td class="num">'+o.n+'</td><td class="num"><b>'+CR(o.v)+'</b></td>'+
        '<td>'+shareBar(tot?o.v/tot:0,C[ix%5])+'</td></tr>').join('')+
      '<tr class="totalrow"><td>Total</td><td class="num">'+sum(items,o=>o.n)+'</td><td class="num">'+CR(tot)+'</td><td></td></tr></tbody></table></div>'
      :'<div style="padding:14px 16px">'+emptyBox('No '+G.toLowerCase()+' view for this figure',note)+'</div>')+
    '</div>'+(items.length&&note?'<div class="dfoot">'+note+'</div>':'')+'</div>';
  openDrawer('FINANCE',m.t,CR(m.grain==='ent'&&view!=='pt'?tot:(items.length?tot:0))+' · '+(key==='fx-fl'?items.reduce((a,b)=>a+b.n,0)+' grants below 80% of plan · ':'')+FX_SRC,body,dl,ICO.doc);
}

/* SDG mapping is at indicator level so nothing is counted twice.
   Proposed by us from the framework wording — needs client confirmation. */
const SDG=[
  {n:2,k:'Zero Hunger',c:C[0],ind:['A.1.1','A.1.2','A.1.3','A.1.4','A.1.5']},
  {n:5,k:'Gender Equality',c:C[3],ind:['A.2.3']},

function leadOverview(){
  const rows=slice(), prev=prevSlice();
  const t=totT(rows), i=totI(rows), g=totG(rows);
  const v=totV(rows), pv=prev?(S.f.metric===2?totI(prev):totT(prev)):null;
  const pi=prev?totI(prev):null;
  const sites=distinct(rows.filter(r=>r.t>0),r=>r.site).size;
  const indsWith=distinct(rows.filter(r=>r.t>0),r=>r.ind).size;
  const indsAll=distinct(rows,r=>r.ind).size;
  const byInd=group(rows,r=>r.ind).filter(o=>o.g>0);
  const onTrack=byInd.filter(o=>o.v>=o.g).length;
  const dT=deltaOf(v,pv), dI=deltaOf(i,pi);

  const recId=reg('Records '+periodLabel(S.f),REC_COLS,recRows(rows));
  const k=rowHead('Key figures','Every card is the current filter slice — click one for the rows behind it',recId)+
    '<div class="kpi-row">'+
    kpi({key:'touched',ico:ICO.users,val:F(v),label:metricWord()+' — '+periodLabel(S.f),delta:dT.delta,dir:dT.dir,pct:g?v/g:null,
         def:'Everyone an iNOPS activity reached in the period, across every charter in view.',
         calc:'Sum of the reach field on every submission matching the filters. A person reached twice by two activities counts twice — there is no common beneficiary key across partners yet.',
         srcTxt:SRC_SYS})+
    (S.f.metric===2
      ? kpi({key:'impacted',ico:ICO.doc,val:F(rows.filter(r=>r.i>0).length),label:'Enrolment submissions behind that figure',delta:'metric filter: impacted only',dir:'flat',
             def:'Count of submission rows carrying an impacted figure.',srcTxt:'Scheme Application + SEEF · inops.mgrant.in'})
      : kpi({key:'impacted',ico:ICO.check,val:F(i),label:'Lives impacted — scheme enrolments',delta:dI.delta,dir:dI.dir,
             def:'People who received a concrete benefit, not just an interaction — today that means an enrolment into a social entitlement scheme.',
             calc:'Sum of reach on the indicators classified as impact-bearing (A.3.2 and the Associate Welfare enrolment lines). Every impacted life is also a life touched, so the two cards overlap by design.',
             srcTxt:'Scheme Application + SEEF · inops.mgrant.in'}))+
    kpi({key:'sites',ico:ICO.pin,val:String(sites),unit:'/ '+SITE_MASTER,label:'Active sites / all sites',delta:PCT(sites/SITE_MASTER)+' of all sites active',dir:sites/SITE_MASTER>0.75?'up':'flat',pct:sites/SITE_MASTER,
         def:'How much of the Amazon site footprint actually filed something in the period.',
         calc:'Distinct BU-Sites with at least one non-zero submission, over the '+SITE_MASTER+'-site master. A site that reported a nil counts as reporting; a site that filed nothing does not.',
         srcTxt:'Site master + ICE Form geography, read from inops.mgrant.in'})+
  '</div>';

  if(!rows.length) return k+emptyBox('Nothing reported in this slice','No partner return matches '+periodLabel(S.f)+' on the current filters. Clear a filter, or pick a period that has closed.');

  const mapCard = card('Geographic footprint',
    'Zone → State → District → BU-Site. Shape colour is the measure chosen in the map; grey states carry no iNOPS operations. iNOPS geography is Amazon\'s operational hierarchy laid over administrative India.',
    '<div class="grid32"><div>'+indiaMap(REC(sliceWholeState()))+'</div><div>'+geoPanel(REC(rows))+'</div></div>',
    src('live','Gram Panchayat (BU-Site) master + form geography, read from inops.mgrant.in '+SYS.pulled_at+'. Boundaries from public state and district datasets, simplified.'),
    reg('Geography '+periodLabel(S.f),
      ['Zone','State','District','BU-Site','Lives touched','Lives impacted','Goal share']
        .concat(S.map.fin?['Allocated','Utilised']:[],['Records']),
      group(REC(rows),r=>r.z+'|'+r.prov+'|'+r.loc+'|'+r.site).map(o=>o.k.split('|')
        .concat([o.t,o.i,o.g],S.map.fin?[sum(o.rows,r=>r.bg),sum(o.rows,r=>r.sp)]:[],[o.n]))),
    'Each shape aggregates every submission whose BU-Site sits inside it, on the current filters. "% of goal" divides the period goal apportioned to that geography.');

  /* ---- SDG table ---- */
  const sdgRows=SDG.map(s=>{
    const r=rows.filter(x=>s.ind.indexOf(x.ind)>=0);
    const v=totV(r), g=totG(r);
    return {s:s,v:v,g:g,n:distinct(r.filter(x=>x.t>0),x=>x.ind).size,tot:s.ind.length,sp:sum(r,x=>x.sp)};
  }).filter(o=>o.v||o.g);
  const grand=Math.max(1,sdgRows.reduce((a,b)=>a+b.v,0));
  const sdgCard=card('Sustainable Development Goals',
    'Each indicator is mapped to exactly one SDG, so the ring sums to the portfolio without double counting. This mapping is proposed from the framework wording and is not yet client-confirmed.',
    shareBlock(sdgRows.map(o=>({k:'SDG '+o.s.n+' · '+o.s.k,v:o.v,c:o.s.c,drill:'sdg:'+o.s.n,
        extra:[o.g?ragPill(o.v/o.g):'<span class="pill p-none">No goal</span>',o.n+' of '+o.tot]})),
      {center:F(grand),sub:metricWord().toLowerCase(),cols:['Goal',metricWord(),'Share','% of goal','Indicators live']}),
    src('live','Indicator → SDG mapping proposed by Dhwani, not client-confirmed. Figures: '+SRC_SYS),
    reg('SDG view '+periodLabel(S.f),['SDG','Name','Reach','Share','Goal','% of goal','Indicators reporting','Indicators','Spend'],
      sdgRows.map(o=>['SDG '+o.s.n,o.s.k,o.v,PCT1(o.v/grand),o.g,o.g?PCT1(o.v/o.g):'',o.n,o.tot,o.sp])),
    'Reach is summed from the indicators mapped to that goal. Share is that SDG over the total of all mapped indicators in the current slice.');

  /* ---- pillar table ---- */
  const pilRows=THEMES.map(th=>{
    const r=rows.filter(x=>x.pil===th.k);
    const v=totV(r), g=totG(r);
    return {th:th,v:v,g:g,parts:distinct(r.filter(x=>x.t>0),x=>x.pt).size,
            sites:distinct(r.filter(x=>x.t>0),x=>x.site).size,
            rep:distinct(r.filter(x=>x.t>0),x=>x.ind).size,tot:distinct(r,x=>x.ind).size};
  }).filter(o=>o.tot);
  const pgrand=Math.max(1,pilRows.reduce((a,b)=>a+b.v,0));
  const pillarCard=card('Pillars',
    'Share of the portfolio by pillar. Click a slice or a line below to open the pillar.',
    shareBlock(pilRows.map(o=>({k:o.th.k,v:o.v,c:o.th.c,drill:'pillar:'+o.th.k,
        extra:[o.g?ragPill(o.v/o.g):'<span class="pill p-none">No goal</span>',o.parts,o.sites]})),
      {center:F(pgrand),sub:metricWord().toLowerCase(),cols:['Pillar',metricWord(),'Share','% of goal','Partners','Sites']}),
    src('live',SRC_SYS+'. '+SRC_GOAL),
    reg('Pillar view '+periodLabel(S.f),['Pillar','Reach','Share','Goal','% of goal','Partners','Sites','Indicators reporting','Indicators'],
      pilRows.map(o=>[o.th.k,o.v,PCT1(o.v/pgrand),o.g,o.g?PCT1(o.v/o.g):'',o.parts,o.sites,o.rep,o.tot])),
    'Goal is the period goal for every indicator in the pillar, including those that filed nothing — a retained zero still carries its target.');

  /* ---- pillar performance against the goal (restored on request) ---- */
  const perf=pilRows.filter(o=>o.v||o.g);
  const maxP=Math.max(1,...perf.map(o=>Math.max(o.v,o.g)));
  const perfCard=card('Pillar performance against the goal',
    'Solid bar is actual; the pale band behind it is that pillar\'s goal for the period. Click a bar to open the pillar.',
    legend([{k:metricWord(),c:'var(--c1)'},{k:'Goal',c:'var(--gray-300)'}])+
    perf.map(o=>hbar(o.th.k,o.v,maxP,ragBarColor(o.g?o.v/o.g:null),
      F(o.v)+'  '+(o.g?PCT(o.v/o.g):''),'pillar:'+o.th.k,o.g?o.g/maxP:null)).join(''),
    src('live',SRC_SYS+'. '+SRC_GOAL),
    reg('Pillar performance '+periodLabel(S.f),['Pillar','Actual','Goal','% of goal'],
      perf.map(o=>[o.th.k,o.v,o.g,o.g?PCT1(o.v/o.g):''])),
    'The rule sits at the pillar\'s goal on the same scale as the bars, so a bar past its rule is ahead. Pillars with no goal set show a bar and no rule.');

  /* flow: where (map) → which pillar, and against what goal → which SDG */
  return k + mapCard + '<div class="grid2">'+pillarCard+perfCard+'</div>' + sdgCard;
}

const MAP_METRICS={
  reach:{k:'reach',label:'Lives reached',fmt:F,get:r=>VAL(r)},
  impacted:{k:'impacted',label:'Lives impacted',fmt:F,get:r=>r.i},
  sites:{k:'sites',label:'BU-Sites reporting',fmt:F,count:'site'},
  spend:{k:'spend',label:'Spend (₹)',fmt:v=>CR(v),get:r=>r.sp,money:true},
  budget:{k:'budget',label:'Allocation (₹)',fmt:v=>CR(v),get:r=>r.bg,money:true},
  unit:{k:'unit',label:'Cost per life (₹)',fmt:v=>'₹'+F(v),unit:true,money:true}
};
function CR(v){
  if(v==null) return '—';
  if(v<0) return '−'+CR(-v);
  if(v>=1e7) return '₹'+(v/1e7).toFixed(2)+' Cr';
  if(v>=1e5) return '₹'+(v/1e5).toFixed(1)+' L';
  return '₹'+F(v);
}
function mapValue(rows){
  const m=MAP_METRICS[S.map.metric]||MAP_METRICS.reach;
  if(m.ratio){ const g=totG(rows); return g?totV(rows)/g:null; }
  if(m.count) return distinct(rows.filter(r=>r.t>0),r=>r.site).size;
  if(m.unit){ const t=totV(rows); return t?sum(rows,r=>r.sp)/t:null; }
  return sum(rows,m.get);
}
function mapFmt(v){ return (MAP_METRICS[S.map.metric]||MAP_METRICS.reach).fmt(v); }
function mapLabel(){ return (MAP_METRICS[S.map.metric]||MAP_METRICS.reach).label; }

/* Vedanta's own ramp and bucket maths (grant_dashboard/ui.js YLGNBU +
   geographic.py _bucket): 8 steps, index = floor(v/max × 7.999), and a
   fixed no-data fill. Kept identical so the finished build can drop this
   wireframe's map straight onto the Vedanta component. */
const YLGNBU=['#DCEEDD','#C1E1C4','#A0D0A6','#7CBC86','#559F66','#347E4C','#1C6237','#0B4726'];
const MAP_NODATA='#EDEBE7';
function bucketColor(v,max){
  if(v==null||!max||max<=0) return MAP_NODATA;
  return YLGNBU[Math.max(0,Math.min(YLGNBU.length-1,Math.floor((v/max)*(YLGNBU.length-0.001))))];
}
const HOVER={}; let hovSeq=0;
const ZONE_OF={}; ZN.forEach(z=>Object.keys(GEO[z].prov).forEach(p=>{ZONE_OF[p]=z;}));
function bboxOf(paths){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  paths.join(' ').replace(/(-?[\d.]+)\s+(-?[\d.]+)/g,function(_,a,b){
    const x=+a,y=+b; if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; return '';
  });
  return [x0,y0,x1,y1];
}
function viewBoxFor(paths,pad){
  const b=bboxOf(paths), p=pad||14;
  const w=Math.max(30,b[2]-b[0]+2*p), h=Math.max(30,b[3]-b[1]+2*p);
  return (b[0]-p)+' '+(b[1]-p)+' '+w+' '+h;
}
function rampColor(v,max){
  if(v==null||max<=0) return 'var(--gray-100)';
  const i=Math.min(6,Math.max(0,Math.round((v/max)*6)));
  return SEQ[i];
}
/* A shape's hover card — the same four-to-six figure grid Vedanta shows,
   pinned top-right of the map while the pointer is on the shape. */
function hoverPayload(kind,title,rows){
  const id='hv'+(++hovSeq);
  const g=totG(rows);
  const cells=[
    ['Reached',F(totV(rows))],['Impacted',F(totI(rows))],
    ['Sites',String(distinct(rows.filter(r=>r.t>0),r=>r.site).size)],
    ['Partners',String(distinct(rows.filter(r=>r.t>0),r=>r.pt).size)]
  ];
  /* financial figures appear only while the map's Financials switch is on */
  if(S.map.fin){
    const b=sum(rows,r=>r.bg), s=sum(rows,r=>r.sp), t=totV(rows);
    cells.push(['Allocated',CR(b)],['Utilised',CR(s)],
               ['Utilisation',b?PCT(s/b):'—'],['Cost / life',t?'₹'+F(s/t):'—']);
  }else{
    cells.push(['Records',F(REC(rows).length)]);
  }
  HOVER[id]={kind:kind,title:title,cells:cells};
  return id;
}
function mapCrumb(){
  const g=S.geo;
  const parts=['<span class="'+(!g.zone?'cur':'step')+'" data-go="india">India</span>'];
  if(g.zone) parts.push('<span class="'+(!g.province?'cur':'step')+'" data-go="zone">'+g.zone+'</span>');
  if(g.province) parts.push('<span class="'+(!g.locality?'cur':'step')+'" data-go="state">'+g.province+'</span>');
  if(g.locality) parts.push('<span class="cur">'+g.locality+'</span>');
  return '<div class="map-crumb">'+parts.join('<i>&rsaquo;</i>')+'</div>';
}
function indiaMap(rows){
  /* District is the deepest the map goes: picking a district keeps the state's
     district map on screen, outlines the pick, and lists its BU-Sites in the panel. */
  const g=S.geo, lvl=g.province?'district':g.zone?'zone':'india';
  const selDist=g.locality&&g.province?(GEO[ZONE_OF[g.province]].prov[g.province].loc[g.locality]||{}).dist:null;
  const statePath=st=>IN_DIST[st]?IN_DIST[st].map(d=>d[1]).join(''):IN_STATES[st];
  const opsStates=Object.keys(IN_DIST);
  const distPath=(st,d)=>{const e=(IN_DIST[st]||[]).find(x=>x[0]===d); return e?e[1]:null;};

  let shapes=[], markers=[], baseVB, title;
  if(lvl==='district'){
    const st=g.province, ds=IN_DIST[st]||[];
    const byDist={},rowsOf={};
    group(rows.filter(r=>r.prov===st),r=>r.loc).forEach(o=>{
      const L=GEO[ZONE_OF[st]].prov[st].loc[o.k];
      if(L&&L.dist){ byDist[L.dist]=mapValue(o.rows); rowsOf[L.dist]=o.rows; }
    });
    const mx=Math.max(1,...Object.values(byDist).map(v=>v||0));
    shapes=ds.map(d=>({n:d[0],d:d[1],v:byDist[d[0]]==null?null:byDist[d[0]],max:mx,
      off:byDist[d[0]]==null,drill:byDist[d[0]]!=null?'mdist:'+d[0]:null,sel:d[0]===selDist,
      hv:rowsOf[d[0]]?hoverPayload('District',d[0],rowsOf[d[0]]):null}));
    baseVB=viewBoxFor(ds.map(d=>d[1]),8);
    title=st+' — districts'+(g.locality?' · '+g.locality+' selected':'');
  }else if(lvl==='zone'){
    const provs=Object.keys(GEO[g.zone].prov);
    const byProv={},rowsOf={};
    group(rows,r=>r.prov).forEach(o=>{byProv[o.k]=mapValue(o.rows);rowsOf[o.k]=o.rows;});
    const mx=Math.max(1,...Object.values(byProv).map(v=>v||0));
    shapes=provs.map(p=>({n:p,d:statePath(p),v:byProv[p]==null?null:byProv[p],max:mx,
      off:byProv[p]==null,drill:'mprov:'+p,hv:rowsOf[p]?hoverPayload('State',p,rowsOf[p]):null}));
    baseVB=viewBoxFor(provs.map(statePath).filter(Boolean),12);
    title=g.zone+' zone — states';
  }else{
    const byProv={},rowsOf={};
    group(rows,r=>r.prov).forEach(o=>{byProv[o.k]=mapValue(o.rows);rowsOf[o.k]=o.rows;});
    const mx=Math.max(1,...Object.values(byProv).map(v=>v||0));
    shapes=Object.keys(IN_STATES).map(s=>({n:s,d:IN_STATES[s],v:null,max:mx,off:true}))
      .concat(opsStates.map(s=>({n:s,d:statePath(s),v:byProv[s]==null?null:byProv[s],max:mx,
        off:byProv[s]==null,drill:byProv[s]!=null?'mprov:'+s:null,
        hv:rowsOf[s]?hoverPayload('State',s,rowsOf[s]):null})));
    baseVB='0 0 396 442';
    title='India — '+mapLabel().toLowerCase()+' by state';
  }

  if(!S.map.view||S.map.viewFor!==lvl+'|'+(g.zone||'')+'|'+(g.province||'')){
    S.map.view=baseVB.split(' ').map(Number);
    S.map.viewFor=lvl+'|'+(g.zone||'')+'|'+(g.province||'');
  }
  const vb=S.map.view.join(' ');
  const mx=Math.max(1,...shapes.filter(s=>s.v!=null).map(s=>s.v),...markers.map(m=>m.v));

  const svg='<svg id="gdMapSvg" viewBox="'+vb+'" width="100%" style="height:404px" role="img" aria-label="'+title+'">'+
    shapes.filter(s=>!s.sel).concat(shapes.filter(s=>s.sel)).map(s=>'<path d="'+s.d+'" fill="'+(s.off?MAP_NODATA:bucketColor(s.v,s.max))+'" '+
      'fill-opacity="'+(s.off?0.55:0.9)+'" stroke="'+(s.sel?'#1F2937':'#fff')+'" stroke-width="'+(s.sel?2.2:lvl==='india'?0.8:1)+'" stroke-linejoin="round"'+(s.sel?' data-sel="1"':'')+
      (s.drill?' data-drill="'+s.drill+'"':'')+(s.hv?' data-hv="'+s.hv+'"':'')+
      (s.drill?' style="cursor:pointer"':'')+'><title>'+s.n+
      (s.v==null?' — no operations':' · '+mapLabel()+': '+mapFmt(s.v))+'</title></path>').join('')+
    markers.map(m=>'<g data-drill="'+m.drill+'" data-hv="'+m.hv+'" style="cursor:pointer">'+
      '<circle cx="'+m.x.toFixed(1)+'" cy="'+m.y.toFixed(1)+'" r="'+m.r.toFixed(1)+'" fill="'+m.c+'" '+
      'fill-opacity="0.92" stroke="#fff" stroke-width="1.6"/>'+
      '<title>'+m.n+' · '+mapLabel()+': '+mapFmt(m.v)+'</title></g>').join('')+
    '</svg>';

  const shade='<label class="map-shade"><span>Shade by</span><select id="mapMetric">'+
    Object.keys(MAP_METRICS).filter(k=>S.map.fin||!MAP_METRICS[k].money)
      .map(k=>'<option value="'+k+'"'+(S.map.metric===k?' selected':'')+'>'+MAP_METRICS[k].label+'</option>').join('')+
    '</select></label>';
  /* Financials stay out of sight by default — safe to put on a screen in front
     of an external audience. A small toggle beside Shade by brings them back. */
  const finBtn='<button type="button" class="map-fin'+(S.map.fin?' on':'')+'" id="mapFin" aria-pressed="'+(S.map.fin?'true':'false')+'" '+
    'title="'+(S.map.fin?'Hide financial figures (for external presentations)':'Show financial figures')+'">'+
    '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12"/><path d="M6 9h12"/><path d="M14 20L7 13h3a4 4 0 000-8"/>'+
    (S.map.fin?'':'<path d="M3 3l18 18" stroke-width="2.2"/>')+'</svg>'+(S.map.fin?'<span>On</span>':'')+'</button>';

  /* Financials on → the money view for every region at the level in view. */
  let finStrip='';
  if(S.map.fin){
    const b=sum(rows,r=>r.bg), s=sum(rows,r=>r.sp), t=totV(rows);
    finStrip='<div class="fin-strip">'+
      '<div><span>Allocated</span><b>'+CR(b)+'</b></div>'+
      '<div><span>Utilised</span><b>'+CR(s)+'</b></div>'+
      '<div><span>Utilisation</span><b>'+(b?PCT(s/b):'—')+'</b></div>'+
      '<div><span>Unutilised</span><b>'+CR(b-s)+'</b></div>'+
      '<div><span>Cost / life</span><b>'+(t?'₹'+F(s/t):'—')+'</b></div>'+
      '<div><span>Regions in view</span><b>'+shapes.filter(x=>!x.off).length+'</b></div>'+
      '</div>';
  }

  return '<div class="map-wrap" id="gdMap">'+
    '<div class="map-ctl">'+mapCrumb()+shade+finBtn+'</div>'+
    '<div class="map-hover" id="gdMapHover"></div>'+svg+
    '<div class="map-zoom"><button data-zoom="in" title="Zoom in">+</button>'+
    '<button data-zoom="out" title="Zoom out">&minus;</button>'+
    '<button data-zoom="reset" title="Reset view">&#8634;</button></div>'+
    '<div class="map-legend"><span>Low</span>'+YLGNBU.map(c=>'<i style="background:'+c+'"></i>').join('')+
    '<span>High</span><b style="margin-left:5px">'+mapFmt(mx)+'</b></div>'+
    '</div>'+finStrip+'<div class="map-note">'+title+' · drag to pan, zoom on the buttons, click a shape to drill. '+
    'Grey carries no iNOPS operations.'+(S.map.fin?' Financials are <b>on</b> — allocation, spend and unit cost are shown for every region.':'')+'</div>';
}
function geoPanel(rows){
  const g=S.geo;
